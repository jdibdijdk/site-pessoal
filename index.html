function notaItems(){
  let items=S.notes.map(n=>({k:n.type==='questao'?'questao':n.type==='caso'?'caso':n.type==='fluxo'?'fluxo':n.type==='bula'?'bula':'note',o:n})).concat(S.pdfs.map(p=>({k:'pdf',o:p})),S.decks.map(d=>({k:'deck',o:d})));
  const ttl=i=>i.k==='deck'?i.o.name:i.o.title;
  if(UI.ntype)items=items.filter(i=>i.k===UI.ntype);
  if(UI.nf==='__none')items=items.filter(i=>!i.o.folderId);
  else if(UI.nf){const ids=folderDesc(UI.nf);items=items.filter(i=>ids.indexOf(i.o.folderId)>=0);}
  if(UI.ncat)items=items.filter(i=>{const r=catRoot(i.o.catId);return r&&r.id===UI.ncat;});
  if(UI.qgrp)items=items.filter(i=>i.k==='questao'&&(UI.qgrp==='__none'?!i.o.qgroup:i.o.qgroup===UI.qgrp));
  if(UI.nq){
    const qn=norm(UI.nq.trim());
    if(qn.charAt(0)==='#'&&qn.length>1){const tg=qn.slice(1);items=items.filter(i=>isNoteK(i.k)&&noteTags(i.o).some(x=>x.indexOf(tg)===0));}
    else items=items.filter(i=>norm((ttl(i)||'')+' '+(isNoteK(i.k)?noteText(i.o)+' '+noteFieldsText(i.o)+' '+(i.k==='questao'?qOrigin(i.o)+' '+i.o.qgroup:''):'')).includes(qn));
  }
  return items.sort((a,b)=>(b.o.updated||0)-(a.o.updated||0));
}
const isNoteK=k=>k==='note'||k==='questao'||k==='caso'||k==='fluxo'||k==='bula';
function noteFieldsText(n){
  let x=['wrong','right','just','s','o','a','p','g1','g2','g3','g4','evo','mec','pearls'].map(f=>{if(!n[f])return '';const t=document.createElement('div');t.innerHTML=cleanHTML(n[f]);return t.textContent||'';}).join(' ');
  if(n.type==='fluxo'&&n.fx){n.fx.nodes.forEach(q=>{x+=' '+q.text;});n.fx.edges.forEach(q=>{x+=' '+q.label;});}
  if(n.type==='caso'){
    CASO_LISTS.forEach(l=>{x+=' '+(n[l[0]]||[]).join(' ');});
    (n.exams||[]).concat(n.req||[]).forEach(e=>{x+=' '+e.name+' '+e.why+' '+e.result+' '+(e.params||[]).map(q=>q.name+' '+q.value+' '+q.ref).join(' ');});
    (n.rx||[]).forEach(r=>{x+=' '+r.drug+' '+r.dose+' '+r.use;});PLAN_LISTS.forEach(l=>{x+=' '+(n[l[0]]||[]).join(' ');});
  }
  if(n.type==='bula'){x+=' '+n.cls+' '+(n.meds||[]).map(m=>m.name).join(' ');BULA_SECS.forEach(s=>{const b=n.bf[s[0]];x+=' '+richText(b.gen)+' '+Object.keys(b.meds).map(k=>richText(b.meds[k])).join(' ');});}
  return x;
}
function noteImgs(o,max){
  const out=[],seen={};
  ['html','s','o','a','p','g1','g2','g3','g4','evo','wrong','right','just','mec','pearls'].forEach(f=>{
    if(out.length>=max||typeof o[f]!=='string'||o[f].indexOf('<img')<0)return;
    const re=/<img[^>]+src=["']([^"']+)["']/gi;let m;
    while((m=re.exec(o[f]))&&out.length<max){const s=m[1];if(/^(data:image\/|https:\/\/)/i.test(s)&&!seen[s]){seen[s]=1;out.push(s);}}
  });
  return out;
}

document.addEventListener('keydown',e=>{
  const t=e.target,ned=t&&t.closest?t.closest('.ned.editing'):null;
  if(ned&&isEd(ned)&&e.key==='Tab'&&!e.altKey&&!e.metaKey&&!e.isComposing){
    const li=liAt(ned);
    if(li){e.preventDefault();if(e.ctrlKey||e.shiftKey)outdentLi(li);else indentLi(li);onNoteInput();return;}
  }
  if(ned&&isEd(ned)&&!e.ctrlKey&&!e.metaKey&&!e.altKey&&!e.isComposing){
    if(e.key==='Tab'){
      const c=cellAt();
      if(c){
        e.preventDefault();const cells=Array.prototype.slice.call(c.closest('table').querySelectorAll('td,th')),i=cells.indexOf(c)+(e.shiftKey?-1:1);
        if(i<0)return;
        if(i>=cells.length){tableAddRow({tr:c.parentNode,idx:0});onNoteInput();}

        return;
      }
    }
    if((e.key==='Enter'&&!e.shiftKey)||e.key==='Backspace'){if(objKey(e,ned))return;if(e.key==='Enter'&&tpKey(e,ned))return;}
  }
  // linhas das listas finais do caso clínico: Enter cria a próxima linha, Backspace numa linha vazia remove
  if(t&&t.classList&&t.classList.contains('olt')){
    const n=curNote();if(!n)return;const k=t.dataset.ol,i=Number(t.dataset.i);n[k]=n[k]||[];const arr=n[k];
    if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){
      e.preventDefault();while(arr.length<=i)arr.push('');const pos=t.selectionStart,full=t.value;arr[i]=full.slice(0,pos);arr.splice(i+1,0,full.slice(pos));n.updated=Date.now();save();olRefresh(n,k,i+1,false);
    }else if(e.key==='Backspace'&&t.value===''&&arr.length>1){

    }
  }
});

/* ----- atalhos de digitação: "* " vira bullet, setas e símbolos, sub-bullets, tópicos ----- */
const ARROWS=[['-->','↦'],['==>','⇒'],['>=','≥']];
const BLK_TAGS=/^(DIV|P|LI|H3|H4|BLOCKQUOTE)$/;
function blockOf(node,ned){let n=node.nodeType===1?node:node.parentNode;while(n&&n!==ned){if(n.nodeType===1&&BLK_TAGS.test(n.tagName))return n;n=n.parentNode;}return null;}
function setCaret(node,off){const s=window.getSelection(),r=document.createRange();r.setStart(node,off);r.collapse(true);s.removeAllRanges();s.addRange(r);}
function noteAutoFormat(e){
  const ned=e.target&&e.target.closest?e.target.closest('.ned.editing'):null;if(!ned||!isEd(ned))return;
  if(/^(delete|history)/.test(e.inputType||''))return;
  const s=window.getSelection();if(!s.rangeCount||!s.isCollapsed)return;
  const node=s.anchorNode,off=s.anchorOffset;if(!node||node.nodeType!==3)return;
  const d=node.data.slice(0,off);
  for(let i=0;i<ARROWS.length;i++){const pat=ARROWS[i][0],sym=ARROWS[i][1];
    if(d.endsWith(pat)){node.replaceData(off-pat.length,pat.length,sym);setCaret(node,off-pat.length+sym.length);return;}}
  if(!/(\*|\d{1,3}\.)\s$/.test(d))return;
  const blk=blockOf(node,ned);
  if(blk){
    if(!/^(DIV|P)$/.test(blk.tagName)||blk.closest('.obj,.tp,table'))return;
    const mk=listKind(textBefore(blk,node,off));if(!mk)return;
    const r=document.createRange();r.setStart(blk,0);r.setEnd(node,off);r.deleteContents();
    const li=document.createElement('li');while(blk.firstChild)li.appendChild(blk.firstChild);
    if(!li.firstChild)li.appendChild(document.createElement('br'));
    const prev=blk.previousElementSibling;
    if(prev&&prev.tagName===mk.toUpperCase()&&!prev.className){prev.appendChild(li);blk.parentNode.removeChild(blk);}
    else{const ul=document.createElement(mk);ul.appendChild(li);blk.parentNode.replaceChild(ul,blk);}
    placeCaret(li);onNoteInput();return;
  }
  // texto solto direto no editor (primeira linha)
  if(node.parentNode===ned&&listKind(d)){const mk=listKind(d);
    const pv=node.previousSibling;if(pv&&!(pv.nodeType===1&&(pv.tagName==='BR'||BLK_TAGS.test(pv.tagName)||/^(UL|OL|TABLE)$/.test(pv.tagName))))return;
    node.replaceData(0,off,'');
    const li=document.createElement('li'),ul=document.createElement(mk);ned.replaceChild(ul,node);ul.appendChild(li);li.appendChild(node);
    if(!node.data)li.appendChild(document.createElement('br'));
    placeCaret(li);onNoteInput();
  }
}
const listKind=t=>/^\*\s$/.test(t)?'ul':/^\d{1,3}\.\s$/.test(t)?'ol':null;
function textBefore(blk,node,off){const r=document.createRange();r.setStart(blk,0);r.setEnd(node,off);return r.toString();}
document.addEventListener('input',noteAutoFormat);
function liAt(ned){
  const s=window.getSelection();if(!s||!s.rangeCount)return null;let n=s.anchorNode;while(n&&n.nodeType!==1)n=n.parentNode;
  const li=n&&n.closest?n.closest('li'):null;return li&&ned.contains(li)?li:null;
}
function keepCaret(fn){
  const s=window.getSelection(),sc=s.anchorNode,so=s.anchorOffset;fn();
  if(sc&&document.body.contains(sc)){const r=document.createRange();r.setStart(sc,so);r.collapse(true);s.removeAllRanges();s.addRange(r);}
}
const isList=el=>!!el&&el.nodeType===1&&/^(UL|OL)$/.test(el.tagName);
function indentLi(li){
  const prev=li.previousElementSibling;if(!prev||prev.tagName!=='LI')return false;
  keepCaret(()=>{
    let sub=prev.lastElementChild;
    if(!isList(sub)){sub=document.createElement(li.parentNode.tagName);prev.appendChild(sub);}
    sub.appendChild(li);
  });return true;
}
function outdentLi(li){
  const list=li.parentNode,pli=list&&list.parentNode;
  if(!pli||pli.tagName!=='LI')return false;
  keepCaret(()=>{
    const after=[];for(let n=li.nextElementSibling;n;n=n.nextElementSibling)after.push(n);
    if(after.length){let sub=li.lastElementChild;if(!isList(sub)){sub=document.createElement(list.tagName);li.appendChild(sub);}after.forEach(x=>sub.appendChild(x));}
    pli.parentNode.insertBefore(li,pli.nextSibling);
    if(!list.children.length)list.parentNode.removeChild(list);
  });return true;
}

function tpKey(e,ned){
  const s=window.getSelection();if(!s.rangeCount)return false;let n=s.anchorNode;while(n&&n.nodeType!==1)n=n.parentNode;
  const tp=n&&n.closest?n.closest('.tp'):null;if(!tp||!ned.contains(tp))return false;
  e.preventDefault();const rg=s.getRangeAt(0);if(!rg.collapsed)rg.deleteContents();
  const tail=document.createRange();tail.setStart(rg.endContainer,rg.endOffset);tail.setEnd(tp,tp.childNodes.length);
  const nl=document.createElement('div');nl.appendChild(tail.extractContents());
  if(nl.querySelector('.tpn')){const f=nl.querySelector('.tpn');while(f.firstChild)f.parentNode.insertBefore(f.firstChild,f);f.remove();}
  if(!nl.textContent&&!nl.querySelector('br,img'))nl.appendChild(document.createElement('br'));
  tp.parentNode.insertBefore(nl,tp.nextSibling);placeCaret(nl);onNoteInput();return true;
}

function fxBoundary(x,tx,ty){
  const cx=x.x+x.w/2,cy=x.y+x.h/2,dx=tx-cx,dy=ty-cy;if(!dx&&!dy)return [cx,cy];

function gsSnip(it,terms){
  const src=it.body;if(!src)return '';const n=norm(src);let at=-1;
  for(let i=0;i<terms.length;i++){const k=n.indexOf(terms[i]);if(k>=0&&(at<0||k<at))at=k;}
  if(at<0)return src.slice(0,90);
  const a=Math.max(0,at-35),b=Math.min(src.length,at+75);
  let t=src.slice(a,b);
  return (a>0?'… ':'')+t+(b<src.length?' …':'');
}
function gsMark(txt,terms){
  // destaca os termos (comparando sem acentos, mas mostrando o texto original)
  const n=norm(txt);let marks=[];
  terms.forEach(t=>{if(!t)return;let i=0;while((i=n.indexOf(t,i))>=0){marks.push([i,i+t.length]);i+=t.length;}});
  if(!marks.length||n.length!==txt.length)return esc(txt);
  marks.sort((x,y)=>x[0]-y[0]);const mg=[];marks.forEach(m=>{const l=mg[mg.length-1];if(l&&m[0]<=l[1])l[1]=Math.max(l[1],m[1]);else mg.push(m.slice());});
  let h='',p=0;mg.forEach(m=>{h+=esc(txt.slice(p,m[0]))+'<mark>'+esc(txt.slice(m[0],m[1]))+'</mark>';p=m[1];});
  return h+esc(txt.slice(p));
}
function gsSearch(q){
  const terms=norm(q).split(/\s+/).filter(Boolean);if(!terms.length)return {terms:terms,res:[]};
  if(!GS_IDX)GS_IDX=gsBuild();
  const res=[];
  GS_IDX.forEach(it=>{
    let sc=0;
    for(let i=0;i<terms.length;i++){
      const t=terms[i],inT=it.tn.indexOf(t),inB=it.bn.indexOf(t);
      if(inT<0&&inB<0){sc=-1;break;}
      sc+=inT===0?100:inT>0?60:15;
    }
    if(sc>0)res.push({it:it,sc:sc});
  });
  res.sort((a,b)=>b.sc-a.sc);
  return {terms:terms,res:res};
}
function gsTagsHTML(q){
  const s=norm(q.trim());if(s.charAt(0)!=='#'||s.length<2)return '';
  const tg=s.slice(1),m=allTags().filter(x=>x.t.indexOf(tg)===0).slice(0,12);if(!m.length)return '';
  return '<div class="cite-g">Marcadores</div><div class="frow" style="padding:4px 4px 10px">'+m.map(x=>'<button class="chip tagc" data-a="tag-go" data-t="'+esc(x.t)+'">#'+esc(x.t)+' <small>'+x.n+'</small></button>').join('')+'</div>';
}
function gsResultsHTML(q){
  const r=gsSearch(q);
  if(!r.terms.length)return '<p class="muted small" style="padding:14px 4px">Digite para procurar em atividades, tarefas, documentos, notas (inclusive o texto), fluxogramas, PDFs, baralhos, receitas, datas, objetivos, links e mais.</p>';
  if(!r.res.length)return gsTagsHTML(q)||'<p class="muted small" style="padding:14px 4px">Nada encontrado para "'+esc(q)+'".</p>';
  const shown=r.res.slice(0,60),by={},order=[];
  shown.forEach(x=>{if(!by[x.it.g]){by[x.it.g]=[];order.push(x.it.g);}by[x.it.g].push(x.it);});
  let h=gsTagsHTML(q),n=0;
  order.forEach(g=>{
    h+='<div class="cite-g">'+esc(g)+'</div>';
    by[g].slice(0,12).forEach(it=>{
      const sn=it.tn.indexOf(r.terms[0])<0||r.terms.some(t=>it.tn.indexOf(t)<0)?gsSnip(it,r.terms):'';
      h+='<button class="gs-i'+(n===GS_SEL?' sel':'')+'" data-a="gs-go" data-i="'+GS_IDX.indexOf(it)+'">'+ic(it.icon,15)+'<span class="gs-t"><b>'+gsMark(it.title||'Sem título',r.terms)+'</b>'+(sn?'<small>'+gsMark(sn,r.terms)+'</small>':'')+'</span>'+(it.sub?'<span class="gs-s">'+esc(it.sub)+'</span>':'')+'</button>';
      n++;
    });
  });
  if(r.res.length>shown.length)h+='<p class="muted small" style="padding:8px 4px">Mostrando os '+shown.length+' melhores de '+r.res.length+'. Refine a busca.</p>';
  return h;
}

  else if(k==='goal'){if(goalById(id))openGoalView(id);else toast('Este objetivo não existe mais.');}
  else if(k==='date'){if(dateById(id))openDateView(id);else toast('Esta data não existe mais.');}

  if(t.id==='ncdl'){const n=noteById(UI.nview.id);if(n){n.cd=Object.assign({date:'',label:''},n.cd,{label:t.value});save();}return true;}
  if(t.id==='qprova'||t.id==='qano'||t.id==='qgroup'){const n=noteById(UI.nview.id);if(n){n[{qprova:'prova',qano:'ano',qgroup:'qgroup'}[t.id]]=t.value.trim();n.updated=Date.now();save();}return true;}

  if(t.id==='fxq'){const l=$('#fxList');if(l)l.innerHTML=fxRefListHTML(t.value);return true;}
  if(t.dataset&&t.dataset.exf){exInput(t);return true;}
  if(t.dataset&&t.dataset.rxf){rxInput(t);return true;}
  if(t.dataset&&t.dataset.bf!==undefined){bfInput(t);return true;}
  if(t.dataset&&t.dataset.bmn){const n=curNote(),m=n&&n.meds.find(x=>x.id===t.dataset.bmn);if(m){m.name=t.value;n.updated=Date.now();save();}return true;}

  return false;
}

function noteSize(delta){
  const ned=curEd();if(!ned)return;ned.focus();
  const s=window.getSelection();
  if(!s.rangeCount||s.isCollapsed||!ned.contains(s.anchorNode)){toast('Selecione o trecho de texto para mudar o tamanho.');return;}
  const n=s.anchorNode,el=n.nodeType===3?n.parentElement:n,cur=parseFloat(window.getComputedStyle(el).fontSize)||16,next=Math.max(10,Math.min(48,Math.round(cur+delta)));
  document.execCommand('styleWithCSS',false,false);

    let sp=f;
    if(f.tagName==='FONT'){sp=document.createElement('span');while(f.firstChild)sp.appendChild(f.firstChild);f.replaceWith(sp);}
    sp.style.fontSize=next+'px';

}
function noteColor(c){

// Imagens: reduz o tamanho antes de guardar, para não pesar a planilha
function compressImage(file,o){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file),im=new Image();
    im.onload=()=>{
      URL.revokeObjectURL(url);let max=(o&&o.max)||1400,q=.86,out='';
      for(let i=0;i<5;i++){
        const sc=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');
        c.width=Math.max(1,Math.round(im.width*sc));c.height=Math.max(1,Math.round(im.height*sc));
        const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);
        out=c.toDataURL('image/jpeg',q);if(out.length<((o&&o.limit)||650000))break;max=Math.round(max*.8);q=Math.max(.5,q-.1);
      }
      res({src:out,w:Math.min(im.width,1400)});
    };
    im.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('Não consegui ler a imagem.'));};
    im.src=url;
  });
}
const GIF_MAX=3*1024*1024; // GIFs são guardados como estão (mantêm a animação); acima disso pesam demais na planilha
function fileToDataURL(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(new Error('Não consegui ler o arquivo.'));r.readAsDataURL(file);});}

async function insertImageFile(file){
  if(!file||!/^image\//.test(file.type)){toast('Esse arquivo não é uma imagem.');return;}
  try{
    let src,w;
    if(file.type==='image/gif'){ // GIF: sem recompressão, para não perder a animação
      if(file.size>GIF_MAX){toast('Esse GIF tem '+(file.size/1048576).toFixed(1).replace('.',',')+' MB. O limite é 3 MB para manter a nota leve.');return;}
      toast('Inserindo GIF…');
      src=await fileToDataURL(file);w=await imageNaturalWidth(src);
    }else{
      toast('Inserindo imagem…');
      const r=await compressImage(file);src=r.src;w=r.w;
    }
    const edc=curEd();if(!edc||!(edc.closest('#fCard')||(UI.nview&&UI.nview.edit)))return;
    restoreRange();
    document.execCommand('insertHTML',false,'<img src="'+src+'" style="width:'+Math.min(w,520)+'px"><br>');
    onNoteInput();toast(file.type==='image/gif'?'GIF inserido com a animação. Toque nele para ajustar o tamanho.':'Imagem inserida. Toque nela para ajustar o tamanho.');

}

function inkPath(pts){
  if(pts.length<4)return 'M'+pts[0]+' '+pts[1]+' L'+pts[0]+' '+pts[1];
  let d='M'+pts[0]+' '+pts[1];
  for(let i=2;i<pts.length-2;i+=2)d+=' Q'+pts[i]+' '+pts[i+1]+' '+((pts[i]+pts[i+2])/2)+' '+((pts[i+1]+pts[i+3])/2);
  return d+' L'+pts[pts.length-2]+' '+pts[pts.length-1];
}

let PD=null;
function inkDist(px,py,ax,ay,bx,by){const dx=bx-ax,dy=by-ay,l=dx*dx+dy*dy;let t=l?((px-ax)*dx+(py-ay)*dy)/l:0;t=Math.max(0,Math.min(1,t));const x=ax+t*dx,y=ay+t*dy;return Math.hypot(px-x,py-y);}
function inkErase(pgEl,e){ // apaga os traços de caneta tocados pelo ponto
  const i=Number(pgEl.dataset.p),r=pgEl.getBoundingClientRect(),px=e.clientX-r.left,py=e.clientY-r.top;let n=0;
  const keep=[];
  (PV.p.annots||[]).forEach(a=>{
    if(a.p!==i||a.type!=='ink'||!a.pts){keep.push(a);return;}
    const th=Math.max(7,(a.w||2.6)*PV.scale/2+5);let hit=false;

      if(inkDist(px,py,ax,ay,bx,by)<=th)hit=true;

function inkDown(e,pgEl){

  if(PV.tool==='erase'||eraserEnd){
    const n=inkErase(pgEl,e);
    if(n||eraserEnd){PD={mode:'ink-erase',pg:pgEl};e.preventDefault();return true;}
    return false; // borracha fora de um traço: apaga grifos/comentários como antes

document.addEventListener('pointermove',e=>{

let ATTN=[],ATTMAP={};
function computeAttention(){
  const now=new Date(),today=todayISO(),nm=now.getHours()*60+now.getMinutes(),m={};
  const get=t=>m[t.id]||(m[t.id]={t:t,byAct:{},dl:''});
  occurrences(addISO(today,-14),today).forEach(o=>{
    if(!(o.date<today||(o.date===today&&tmin(o.end)<=nm)))return;
    S.tasks.filter(t=>!t.done&&(t.activityIds||[]).includes(o.act.id)).forEach(t=>{
      const e=get(t),stamp=o.date+' '+o.end,cur=e.byAct[o.act.id];
      if(!cur||cur.stamp<stamp)e.byAct[o.act.id]={stamp:stamp,txt:'"'+aT(o.act)+'" terminou '+(o.date===today?'hoje':fmtDM(o.date))+' às '+o.end};
    });
  });
  S.tasks.forEach(t=>{
    const due=tDue(t),dh=tDueTime(t);
    if(t.done||!due)return;
    if(due<today||(due===today&&dh&&tmin(dh)<=nm))
      get(t).dl='O prazo '+(due===today?'de hoje ('+dh+')':'de '+fmtDM(due)+(dh?' às '+dh:''))+' passou';
  });
  ATTN=Object.keys(m).map(id=>{
    const e=m[id],rs=[];if(e.dl)rs.push(e.dl);
    Object.keys(e.byAct).forEach(k=>rs.push('A atividade '+e.byAct[k].txt));
    return {t:e.t,reasons:rs,hasDl:!!e.dl,stamp:Object.keys(e.byAct).map(k=>e.byAct[k].stamp).sort().pop()||''};
  }).filter(x=>S.dismissed['att-'+x.t.id]!==today).sort((a,b)=>(a.hasDl?0:1)-(b.hasDl?0:1)||(a.stamp<b.stamp?1:-1));
  ATTMAP={};ATTN.forEach(x=>{ATTMAP[x.t.id]=true;});
}
function attnHTML(){
  if(!ATTN.length)return '';
  if(S.prefs.attnHide)return '<button class="attnmin" data-a="attn-toggle">'+ic('eye',14)+' Mostrar '+ATTN.length+(ATTN.length===1?' Pendência':' Pendências')+'</button>';
  return '<section class="attn"><div class="attn-h">'+ic('bell',16)+'<b>'+ATTN.length+(ATTN.length===1?' pendência em destaque':' pendências em destaque')+'</b><span class="muted small">Conclua, ajuste o prazo ou reagende.</span><button class="btn sm ghost" style="margin-left:auto" data-a="attn-toggle">'+ic('eyeOff',14)+' Ocultar</button></div><div class="attn-row">'+
    ATTN.map(x=>'<div class="acard"><div class="at1"><b>'+esc(x.t.title)+'</b>'+dueChip(x.t)+'</div>'+x.reasons.map(r=>'<div class="small muted">'+esc(r)+'</div>').join('')+
      '<div class="aact"><button class="btn sm primary" data-a="att-done" data-id="'+x.t.id+'">'+ic('check',13)+' Concluir</button><button class="btn sm" data-a="view-task" data-id="'+x.t.id+'">Ver</button><button class="btn sm" data-a="att-plus1" data-id="'+x.t.id+'">Prazo +1 dia</button><button class="btn sm" data-a="sched-task" data-id="'+x.t.id+'">Reagendar</button><button class="btn sm ghost" data-a="att-snooze" data-id="'+x.t.id+'">Hoje não</button></div></div>').join('')+'</div></section>';
}
function notifyNew(){
  ATTN.forEach(x=>{
    if(UI.notified[x.t.id])return;UI.notified[x.t.id]=1;toast('Pendência: '+x.t.title);
    try{if(window.Notification&&Notification.permission==='granted')new Notification('Tarefa pendente',{body:x.t.title+' · '+x.reasons[0]});}catch(e){}
  });

function tick(){
  const before=ATTN.map(x=>x.t.id).join();computeAttention();
  if(before!==ATTN.map(x=>x.t.id).join()){
    const ae=document.activeElement;
    if($('#modal').hidden&&!UI.nview&&!(ae&&/INPUT|TEXTAREA|SELECT/.test(ae.tagName)))renderMain();
    notifyNew();

function ntCheck(){
  const c=ntCfg();if(!c.on)return;const now=Date.now(),sent=ntSent();let ch=false;
  Object.keys(sent).forEach(k=>{if(now-sent[k]>4*864e5){delete sent[k];ch=true;}});
  ntItems().forEach(it=>{
    if(sent[it.key]||it.at>now)return;

function hrRange(){
  const today=todayISO(),ws=mondayOf(today),d=parseISO(today),r=UI.hr.range;
  if(r==='week')return [ws,addISO(ws,6)];
  if(r==='prev')return [addISO(ws,-7),addISO(ws,-1)];
  if(r==='month')return [toISO(new Date(d.getFullYear(),d.getMonth(),1)),toISO(new Date(d.getFullYear(),d.getMonth()+1,0))];
  if(r==='pmonth')return [toISO(new Date(d.getFullYear(),d.getMonth()-1,1)),toISO(new Date(d.getFullYear(),d.getMonth(),0))];
  if(r==='90')return [addISO(today,-89),today];
  const a=UI.hr.from||ws,b=UI.hr.to||addISO(ws,6);return a<=b?[a,b]:[b,a];
}
function hoursData(){
  const rg=hrRange(),occ=occurrences(rg[0],rg[1]),mins=o=>Math.max(0,tmin(o.end)-tmin(o.start));
  const group=(keyFn,colFn)=>{const g={};occ.forEach(o=>{const k=keyFn(o),e=g[k]||(g[k]={k:k,p:0,d:0,c:colFn?colFn(o):'#CBD2DE'});e.p+=mins(o);if(o.done)e.d+=mins(o);});return Object.keys(g).map(k=>g[k]).sort((a,b)=>b.p-a.p);};
  const root=o=>{const r=catRoot(o.act.catId);return r?r.name:'Sem categoria';};
  return {rg:rg,occ:occ,total:occ.reduce((s,o)=>s+mins(o),0),done:occ.filter(o=>o.done).reduce((s,o)=>s+mins(o),0),
    byArea:group(root,o=>catColor(o.act.catId)),
    bySub:group(o=>{const p=catPath(o.act.catId);return p.length?(p.length>1?p[0].name+' › '+p[1].name:p[0].name):'Sem categoria';},o=>catColor(o.act.catId)),
    byTipo:group(o=>actParts(o.act).tipo||'Sem tipo'),byBloco:group(o=>blockById(o.act.blockType).label),
    byWeek:group(o=>mondayOf(o.date))};
}

  recForm({title:(e0?'Editar: ':'Registrar: ')+sc.label.toLowerCase(),fields:sc.fields,data:d,

// Atividade física concluída no cronograma -> vai para a aba Saúde
function isFisica(a){return a.blockType==='fisica'||catPath(a.catId).some(c=>/atividade f[ií]sica/i.test(c.name));}
function fisicaGuess(a){
  const txt=norm(aT(a)+' '+catPath(a.catId).map(c=>c.name).join(' ')+' '+(a.theme||''));
  if(/corrida|correr/.test(txt))return 'Corrida';if(/academia|muscula|treino/.test(txt))return 'Academia';
  if(/caminhada/.test(txt))return 'Caminhada';if(/ciclismo|bicicleta/.test(txt))return 'Ciclismo';if(/natacao/.test(txt))return 'Natação';if(/funcional/.test(txt))return 'Funcional';
  return '';
}
function healthFromOcc(a,key){
  const p=key.split('|'),date=p[1],s=a.slots.find(x=>x.id===p[0]);if(!s)return null;
  const src=a.id+'|'+key;let e=S.health.find(x=>x.src===src);
  if(!e){e={id:uid(),type:'treino',date:date,time:s.start,act:fisicaGuess(a)||'Atividade física',min:Math.max(0,tmin(s.end)-tmin(s.start)),km:null,kcal:null,hr:null,hrmax:null,steps:null,session:'',note:'',src:src,auto:true,touched:false};S.health.push(e);}
  return e;
}
function maybeHealth(a,key){ // chamado ao marcar como concluída
  if(!isFisica(a))return;
  const e=healthFromOcc(a,key);if(!e)return;save();openHealthPrompt(e);
}
function unlinkHealth(a,key){ // ao desmarcar a conclusão
  const src=a.id+'|'+key,e=S.health.find(x=>x.src===src);if(!e)return;
  const filled=e.touched&&(e.kcal||e.km||e.hr||e.hrmax||e.steps||e.session);
  if(!filled){S.health=S.health.filter(x=>x!==e);toast('Registro removido da aba Saúde.');return;}
  e.src='';
  askConfirm('Remover também da Saúde?','Você já preencheu detalhes deste treino na aba Saúde. Quer apagar esse registro?',()=>{S.health=S.health.filter(x=>x.id!==e.id);save();closeModal();rerender();},'Remover');
}

    '<label class="f hp-gym">Sessão da academia<select name="session"><option value="">—</option>'+['A','B','C'].map(s=>'<option '+sel(s,e.session)+'>'+s+'</option>').join('')+'</select></label></div>'+

    '<div class="fgrid"><label class="f">Passos<input name="steps" inputmode="numeric" value="'+(e.steps!=null?e.steps:'')+'"></label><label class="f">Observações<input name="note" value="'+esc(e.note||'')+'" autocomplete="off"></label></div>'+
    '<div class="ff"><button type="button" class="btn" data-a="hp-skip">Preencher depois</button><button class="btn primary">Salvar na Saúde</button></div></form>');

    ev.preventDefault();const E=f.elements,en=S.health.find(x=>x.id===f.dataset.id);if(!en)return;

    save();closeModal();rerender();toast('Treino salvo na aba Saúde.');

function hpToggle(){

   29. FINANÇAS: saldo, cartões, contas, dívidas, entradas e dinheiro de eventos

const accOpts=()=>S.fin.accounts.map(a=>[a.id,a.name]);
const REC_OPTS=[['none','Uma vez'],['month','Todo mês'],['week','Toda semana']];
function recDates(item,from,to){
  const out=[],base=item.date;if(!base)return out;
  if(!item.rec||item.rec==='none'){if(base>=from&&base<=to)out.push(base);return out;}
  for(let k=0;k<600;k++){const d=item.rec==='week'?addISO(base,7*k):addMonthsISO(base,k);if(d>to)break;if(item.until&&d>item.until)break;if(d>=from)out.push(d);}
  return out;
}
function invoiceFor(c,dateISO){
  const d=parseISO(dateISO),dim=(yy,mm)=>new Date(yy,mm+1,0).getDate();
  const m=d.getMonth()+(d.getDate()>c.close?1:0),y=d.getFullYear(),cl=new Date(y,m,Math.min(c.close,dim(y,m)));
  const dm=cl.getMonth()+(c.due<=c.close?1:0),dy=cl.getFullYear(),du=new Date(dy,dm,Math.min(c.due,dim(dy,dm)));
  return {key:cl.getFullYear()+'-'+pad(cl.getMonth()+1),close:toISO(cl),due:toISO(du)};
}
function cardInvoices(c){
  const map={};
  S.fin.buys.concat(S.fin.spends.filter(s=>s.pay==='credit').map(s=>({id:s.id,card:s.card,date:s.date,desc:(s.desc||s.cat||'Saída')+(s.cat&&s.desc?' · '+s.cat:''),amount:s.amount,n:s.n}))).filter(b=>b.card===c.id).forEach(b=>{
    const n=Math.max(1,b.n||1),part=b.amount/n;
    for(let i=0;i<n;i++){
      const iv=invoiceFor(c,addMonthsISO(b.date,i)),e=map[iv.key]||(map[iv.key]={key:iv.key,close:iv.close,due:iv.due,total:0,items:[]});
      e.total+=part;e.items.push({desc:b.desc,date:b.date,k:i+1,n:n,amount:part,id:b.id});
    }
  });
  return Object.keys(map).map(k=>map[k]).sort((a,b)=>a.due<b.due?-1:1).map(v=>{v.paid=S.fin.paid['inv|'+c.id+'|'+v.key]||null;return v;});
}
function finEvents(from,to){
  const F=S.fin,out=[];
  const push=(key,kind,name,amount,date,acc,sub)=>out.push({key:key,kind:kind,name:name,amount:amount,date:date,acc:acc,sub:sub||'',paid:F.paid[key]||null});
  F.incomes.forEach(i=>recDates(i,from,to).forEach(d=>push('inc|'+i.id+'|'+d,'in',i.name,i.amount,d,i.acc,i.rec==='month'?'mensal':i.rec==='week'?'semanal':'')));
  F.bills.forEach(b=>recDates(b,from,to).forEach(d=>push('bill|'+b.id+'|'+d,'out',b.name,b.amount,d,b.acc,b.rec==='month'?'conta mensal':'conta')));
  F.debts.forEach(db=>{for(let k=1;k<=db.n;k++){const d=addMonthsISO(db.first,k-1);if(d>=from&&d<=to)push('debt|'+db.id+'|'+k,'out',db.name,db.inst,d,db.acc,'dívida '+k+'/'+db.n);}});
  F.cards.forEach(c=>cardInvoices(c).forEach(v=>{if(v.due>=from&&v.due<=to)push('inv|'+c.id+'|'+v.key,'out','Fatura '+c.name,v.total,v.due,c.acc,'cartão');}));
  // Dinheiro lançado dentro de atividades e tarefas
  S.acts.forEach(a=>(a.moneys||[]).forEach(m=>{if(m.date>=from&&m.date<=to)push('mon|'+m.id,m.kind==='in'?'in':'out',m.desc||m.cat||'Valor',Number(m.amount)||0,m.date,m.acc,(m.cat||'Outro')+' · '+aT(a));}));
  S.acts.forEach(a=>{if(a.shop&&a.shop.done&&a.shop.paidOn>=from&&a.shop.paidOn<=to)push('shop|'+a.id,'out','Compra do Mercado',Number(a.shop.real)||0,a.shop.paidOn,a.shop.acc,'Alimentação · estimado '+money(a.shop.est));});
  S.meals.forEach(m=>{if(m.kind==='fora'&&m.done&&m.date>=from&&m.date<=to)push('meal|'+m.id,'out',mealTitle(m),Number(m.amount)||0,m.date,(F.paid['meal|'+m.id]||{}).acc||'','Alimentação fora');});
  S.tasks.forEach(t=>(t.moneys||[]).forEach(m=>{if(m.date>=from&&m.date<=to)push('mon|'+m.id,m.kind==='in'?'in':'out',m.desc||m.cat||'Valor',Number(m.amount)||0,m.date,m.acc,(m.cat||'Outro')+' · '+t.title);}));
  F.spends.forEach(s=>{if(s.pay==='debit'&&s.date>=from&&s.date<=to&&s.date<=todayISO()){push('sp|'+s.id,'out',s.desc||s.cat||'Saída',s.amount,s.date,s.acc,(s.cat||'Outros')+' · débito');out[out.length-1].paid={on:s.date,amt:s.amount,acc:s.acc,k:'out'};}});
  return out.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);
}
function accBalance(a){let b=Number(a.start)||0;Object.keys(S.fin.paid).forEach(k=>{const p=S.fin.paid[k];if(p.acc===a.id)b+=p.k==='in'?p.amt:-p.amt;});const t=todayISO();S.fin.spends.forEach(s=>{if(s.pay==='debit'&&s.acc===a.id&&s.date<=t)b-=Number(s.amount)||0;});return b;}
const totalBalance=()=>S.fin.accounts.reduce((s,a)=>s+accBalance(a),0);
function finToggle(key){
  const F=S.fin;if(key.indexOf('sp|')===0){toast('Saída de débito já saiu da conta. Para mudar, edite ou exclua em Finanças > Saídas.');return;}if(F.paid[key]){delete F.paid[key];return;}
  const t=todayISO(),ev=finEvents(addISO(t,-900),addISO(t,900)).find(e=>e.key===key);if(!ev)return;
  F.paid[key]={on:t,amt:ev.amount,acc:ev.acc||(F.accounts[0]&&F.accounts[0].id)||'',k:ev.kind==='in'?'in':'out'};

function accName(id){const a=S.fin.accounts.find(x=>x.id===id);return a?a.name:'';}

function finMoneyCard(){
  const t=todayISO(),d=parseISO(t),from=toISO(new Date(d.getFullYear(),d.getMonth(),1)),to=toISO(new Date(d.getFullYear(),d.getMonth()+1,0));
  const ev=finEvents(from,to).filter(e=>e.key.indexOf('mon|')===0);
  if(!ev.length)return '';
  const by={};let total=0;
  ev.forEach(e=>{const c=(e.sub||'').split(' · ')[0]||'Outro',v=e.kind==='in'?e.amount:-e.amount;by[c]=(by[c]||0)+v;total+=v;});
  return '<div class="card sec" style="margin-top:12px"><h3>Dinheiro de atividades e tarefas neste mês</h3><p>Valores lançados dentro de eventos e tarefas (material, lanche, almoço, compras).</p>'+

function finPay(){
  const today=todayISO();
  let h='<div class="toolbar"><div><b>Contas e dívidas</b><div class="muted small">O que vence, quando e quanto falta pagar.</div></div><div class="opts"><button class="btn" data-a="fin-new" data-t="bill">'+ic('plus',15)+' Conta</button><button class="btn primary" data-a="fin-new" data-t="debt">'+ic('plus',15)+' Dívida</button></div></div>';

  S.fin.debts.forEach(db=>{
    const ks=[];for(let k=1;k<=db.n;k++)ks.push({k:k,d:addMonthsISO(db.first,k-1),p:S.fin.paid['debt|'+db.id+'|'+k]});

function finDelete(t,id){
  const F=S.fin,map={account:'accounts',income:'incomes',bill:'bills',debt:'debts',card:'cards',buy:'buys'};

const SNAP=15;let DRAG=null,lastDrag=0;
function gridRaw(col,clientY){const r=col.getBoundingClientRect(),g=col.closest('.wgrid'),lo=Number(g.dataset.lo),span=Number(g.dataset.span),h=r.height||1;return lo+Math.max(0,Math.min(h,clientY-r.top))/h*span;}
function dragSlot(raw0,raw1){
  let a,b;
  if(Math.abs(raw1-raw0)<SNAP/2){a=Math.floor(raw0/SNAP)*SNAP;b=a+60;}
  else{a=Math.floor(Math.min(raw0,raw1)/SNAP)*SNAP;b=Math.ceil(Math.max(raw0,raw1)/SNAP)*SNAP;}
  if(b>1439)b=1439;if(a>=b)a=Math.max(0,b-SNAP);return [a,b];
}
function drawGhost(){
  if(!DRAG)return;const g=DRAG.col.closest('.wgrid'),lo=Number(g.dataset.lo),span=Number(g.dataset.span),s=dragSlot(DRAG.r0,DRAG.r1);
  if(!DRAG.ghost){DRAG.ghost=document.createElement('div');DRAG.ghost.className='dragghost';DRAG.col.appendChild(DRAG.ghost);}
  DRAG.ghost.style.top=((s[0]-lo)/span*100)+'%';DRAG.ghost.style.height=((s[1]-s[0])/span*100)+'%';DRAG.ghost.textContent=mt(s[0])+' – '+mt(s[1]);
}
document.addEventListener('pointerdown',e=>{
  if(e.button!==0||e.pointerType==='touch')return;
  const col=e.target.closest&&e.target.closest('.gcol[data-date]');if(!col||e.target.closest('.ev'))return;
  const r=gridRaw(col,e.clientY);DRAG={col:col,r0:r,r1:r,ghost:null};e.preventDefault();
});
document.addEventListener('pointermove',e=>{if(!DRAG)return;DRAG.r1=gridRaw(DRAG.col,e.clientY);drawGhost();});
document.addEventListener('pointerup',e=>{
  if(!DRAG)return;const D=DRAG;DRAG=null;if(D.ghost)D.ghost.remove();lastDrag=Date.now();
  const s=dragSlot(D.r0,D.r1);openActForm({prefill:{slots:[defaultSlot(D.col.dataset.date,mt(s[0]),mt(s[1]))]}});

   25. BARALHOS E FLASHCARDS
       Tipos: Frente e verso, Oclusão de palavras (como o Cloze do Anki) e
       Oclusão de imagem/tabela. Os cards só aparecem agrupados em baralhos.
   ========================================================================== */
const deckById=id=>S.decks.find(d=>d.id===id);
const cardById=id=>S.cards.find(c=>c.id===id);
const CARD_TYPES={basic:'Frente e verso',cloze:'Oclusão de palavras',occ:'Oclusão de imagem/tabela'};
// Depois de virar o card, você classifica; a classificação define quando ele volta
const RATES=[
  {k:1,label:'Muito difícil',ms:30e3,txt:'menos de 1 min',cls:'r1'},
  {k:2,label:'Difícil',ms:3*60e3,txt:'3 min',cls:'r2'},
  {k:3,label:'Normal',ms:10*60e3,txt:'10 min',cls:'r3'},
  {k:4,label:'Fácil',ms:864e5,txt:'1 dia',cls:'r4'}
];
const nlbr=t=>esc(t).replace(/\n/g,'<br>');
function inTxt(ms){
  if(ms<=0)return 'agora';const s=Math.round(ms/1000);if(s<60)return 'em '+s+' s';
  const m=Math.round(s/60);if(m<60)return 'em '+m+' min';const h=Math.round(m/60);if(h<24)return 'em '+h+' h';
  const d=Math.round(h/24);return 'em '+d+(d===1?' dia':' dias');
}
const clock=ms=>{const s=Math.max(0,Math.ceil(ms/1000));return Math.floor(s/60)+':'+pad(s%60);};
// {{c1::resposta}}, {{c1::resposta::dica}} ou {{resposta}}
const CLOZE_RE=/\{\{(?:c(\d+)::)?([^{}]+?)(?:::([^{}]+?))?\}\}/g;
function clozeIdx(t){const set=new Set();String(t||'').replace(CLOZE_RE,(m,n)=>{set.add(n||'1');return m;});return Array.from(set).sort((a,b)=>a-b);}
// Cada card gera "itens de estudo": 1 (frente e verso), 1 por lacuna, 1 por área/célula ocultada
function cardItems(c){
  if(c.type==='cloze'){const l=clozeIdx(c.text);return l.length?l:['0'];}
  if(c.type==='occ'){
    if(c.okind==='table')return (c.occ||[]).length?c.occ.slice():['0'];
    return (c.rects||[]).length?c.rects.map((_,i)=>String(i)):['0'];
  }
  return ['0'];
}
const sch=(c,i)=>((c.s||{})[i])||{due:0,reps:0};
function deckStats(deckId,now){
  let total=0,due=0,fresh=0,next=null;
  S.cards.forEach(c=>{if(c.deckId!==deckId)return;cardItems(c).forEach(i=>{total++;const s=sch(c,i);if(s.due<=now){due++;if(!s.reps)fresh++;}else if(next===null||s.due<next)next=s.due;});});
  return {total:total,due:due,fresh:fresh,review:due-fresh,next:next};
}
function dueCardCount(){const now=Date.now();let n=0;S.cards.forEach(c=>cardItems(c).forEach(i=>{if(sch(c,i).due<=now)n++;}));return n;}
function decksSection(list){
  if(!list||!list.length)return '';
  const now=Date.now();
  return secHTML('Baralhos','<div class="pills">'+list.map(d=>{const st=deckStats(d.id,now);return '<button class="pillx" data-a="deck-open" data-id="'+d.id+'">'+ic('cards',13)+esc(d.name)+' · '+(st.due?st.due+' p/ revisar':'em dia')+'</button>';}).join('')+'</div>');
}

const RICH_TAG=/<(b|i|u|br|p|div|span|ul|ol|li|img|h3|mark|strong|em|a)\b[^>]*>/i;
const richHTML=t=>{t=String(t||'');return RICH_TAG.test(t)?cleanHTML(t):nlbr(t);};
const richText=t=>{const d=document.createElement('div');d.innerHTML=richHTML(t);return (d.textContent||'').replace(/\s+/g,' ').trim();};
const richEmpty=h=>!richText(h)&&!/<img/i.test(h||'');

function cardToolbarHTML(){

    '<button class="btn sm" data-a="n-img" title="Inserir imagem (ou cole/arraste uma imagem aqui)">'+ic('image',15)+' Imagem</button></div>';
}
function cardPreview(c){
  if(c.type==='cloze')return String(c.text||'').replace(CLOZE_RE,(m,n,a)=>'['+a+']');
  if(c.type==='occ')return c.okind==='table'?'Tabela '+((c.table||[]).length)+'×'+((((c.table||[])[0])||[]).length)+' · '+(c.occ||[]).length+' célula(s) oculta(s)':'Imagem · '+(c.rects||[]).length+' área(s) oculta(s)';
  return c.front||'(só imagem)';
}

function saveCardForm(more){
  if(!CARDF||!$('#fCard'))return;const t=CARDF.type,now=Date.now(),data={type:t};
  if(t==='basic'){
    const fr=$('#cf-front').value.trim(),bk=edVal('#cf-back');

document.addEventListener('pointerdown',e=>{
  const box=e.target.closest&&e.target.closest('#occbox');if(!box||e.target.closest('[data-a]'))return;
  const r=box.getBoundingClientRect(),pv=document.createElement('div');pv.className='dragprev';box.appendChild(pv);
  OCCD={box:box,x0:(e.clientX-r.left)/r.width,y0:(e.clientY-r.top)/r.height,pv:pv,r:null};e.preventDefault();
});
document.addEventListener('pointermove',e=>{
  if(!OCCD)return;const b=OCCD.box.getBoundingClientRect();
  const x=Math.max(0,Math.min(1,(e.clientX-b.left)/b.width)),y=Math.max(0,Math.min(1,(e.clientY-b.top)/b.height));
  const L=Math.min(OCCD.x0,x),T=Math.min(OCCD.y0,y),W=Math.abs(x-OCCD.x0),H=Math.abs(y-OCCD.y0);
  OCCD.pv.style.left=(L*100)+'%';OCCD.pv.style.top=(T*100)+'%';OCCD.pv.style.width=(W*100)+'%';OCCD.pv.style.height=(H*100)+'%';OCCD.r={x:L,y:T,w:W,h:H};
});

/* ----- estudo: o card vira (ou a lacuna/célula aparece) com Enter ----- */
function studyPool(deckIds){
  const out=[];
  S.cards.forEach(c=>{if(deckIds.indexOf(c.deckId)<0)return;cardItems(c).forEach(i=>{const s=sch(c,i);out.push({c:c,i:i,due:s.due||0,reps:s.reps||0});});});
  return out;
}
function studyPick(){
  const st=UI.study,now=Date.now(),pool=studyPool(st.deckIds),due=pool.filter(x=>x.due<=now);
  if(due.length){
    due.sort((a,b)=>((b.reps>0)-(a.reps>0))||(a.due-b.due)||((a.c.created||0)-(b.c.created||0)));
    let p=due[0];if(st.cur&&due.length>1&&p.c.id===st.cur.cardId&&p.i===st.cur.idx)p=due[1];
    return {kind:'card',cardId:p.c.id,idx:p.i};
  }
  const fut=pool.filter(x=>x.due>now&&x.due-now<=30*60*1000).sort((a,b)=>a.due-b.due)[0];
  return fut?{kind:'wait',until:fut.due}:{kind:'done'};
}
function studyAdvance(){
  const st=UI.study;if(!st)return;clearInterval(st.timer);st.timer=null;st.revealed=false;
  const p=studyPick();
  if(p.kind==='card'){st.cur={cardId:p.cardId,idx:p.idx};st.wait=null;}
  else if(p.kind==='wait'){
    st.cur=null;st.wait=p.until;
    st.timer=setInterval(()=>{
      const left=st.wait-Date.now();
      if(left<=0){studyAdvance();renderMain();}
      else{const el=$('#stcount');if(el)el.textContent=clock(left);}
    },500);
  }else{st.cur=null;st.wait=null;}
}
function studyStop(){if(UI.study&&UI.study.timer)clearInterval(UI.study.timer);UI.study=null;}
function stFace(c,idx){
  const img=u=>u?'<img class="st-img" src="'+u+'" alt="">':'';
  const extra=!richEmpty(c.extra)?'<div class="st-extra revealed-only">'+richHTML(c.extra)+'</div>':'';
  if(c.type==='cloze'){
    const t=esc(c.text||'').replace(CLOZE_RE,(m,n,ans,hint)=>(n||'1')===String(idx)
      ?'<span class="clz"><span class="q">'+(hint?'['+hint+']':'[…]')+'</span><span class="a">'+ans+'</span></span>':'<span class="clz-o">'+ans+'</span>').replace(/\n/g,'<br>');
    return '<div id="stcard" class="stplain st-cloze"><div class="cl-text">'+t+'</div>'+extra+'</div>';
  }
  if(c.type==='occ'){
    let body;
    if(c.okind==='table'){
      body='<table class="occt">'+(c.table||[]).map((row,r)=>'<tr>'+row.map((cell,k)=>{
        const tag=(c.hdr!==false&&r===0)?'th':'td';
        return (r+':'+k)===String(idx)?'<'+tag+' class="act"><span class="q">?</span><span class="a">'+esc(cell)+'</span></'+tag+'>':'<'+tag+'>'+esc(cell)+'</'+tag+'>';
      }).join('')+'</tr>').join('')+'</table>';
    }else{
      const r=(c.rects||[])[Number(idx)];
      body='<div class="occwrap"><img src="'+(c.image||'')+'" alt="">'+(r?'<div class="occr act" style="left:'+(r.x*100)+'%;top:'+(r.y*100)+'%;width:'+(r.w*100)+'%;height:'+(r.h*100)+'%"><span>?</span></div>':'')+'</div>';
    }
    return '<div id="stcard" class="stplain st-occ">'+body+extra+'</div>';
  }
  return '<div class="flipwrap"><div id="stcard" class="flipcard st-basic"><div class="face front">'+img(c.frontImg)+'<div class="ft">'+nlbr(c.front)+'</div></div>'+
    '<div class="face back"><div class="fsmall">'+nlbr(c.front)+'</div><hr>'+img(c.backImg)+'<div class="ft">'+richHTML(c.back)+'</div>'+(!richEmpty(c.extra)?'<div class="st-extra">'+richHTML(c.extra)+'</div>':'')+'</div></div></div>';
}
function studyHomeHTML(){
  const now=Date.now(),decks=S.decks.slice().sort((a,b)=>(a.name||'').localeCompare(b.name||'')),all=dueCardCount();
  let h='<div class="toolbar"><div><b style="font-size:17px">Estudar</b><div class="muted small">Cards voltam conforme a sua classificação: muito difícil em menos de 1 min, difícil em 3 min, normal em 10 min e fácil em 1 dia.</div></div>'+
    '<button class="btn primary" data-a="st-start" '+(all?'':'disabled')+'>'+ic('play',14)+' Estudar tudo pendente'+(all?' ('+all+')':'')+'</button></div>';
  if(!decks.length)return nSubBar()+h+'<div class="empty">Você ainda não tem baralhos.<br><button class="btn primary" data-a="deck-new">'+ic('plus',15)+' Criar baralho</button></div>';
  return nSubBar()+h+'<div class="card">'+decks.map(d=>{
    const st=deckStats(d.id,now);
    return '<div class="crow"><span class="lki">'+ic('cards',16)+'</span><div class="cprev"><b>'+esc(d.name||'Baralho')+'</b><div class="muted small">'+st.total+' itens · '+st.fresh+' novos · '+st.review+' para revisar'+(!st.due&&st.next?' · próximo '+inTxt(st.next-now):'')+'</div></div>'+
      '<span class="tact"><button class="btn sm '+(st.due?'primary':'')+'" data-a="st-start" data-id="'+d.id+'" '+(st.total?'':'disabled')+'>'+ic('play',13)+' Estudar'+(st.due?' ('+st.due+')':'')+'</button><button class="icon-btn sm" data-a="deck-open" data-id="'+d.id+'" title="Abrir baralho" aria-label="Abrir baralho">'+ic('chevR',15)+'</button></span></div>';
  }).join('')+'</div>';

function studyHTML(){
  const st=UI.study;if(!st)return studyHomeHTML();
  const now=Date.now(),dueN=studyPool(st.deckIds).filter(x=>x.due<=now).length,names=st.deckIds.map(id=>{const d=deckById(id);return d?d.name:'';}).filter(Boolean).slice(0,3).join(', ');
  let h='<div class="nhead"><button class="btn sm ghost" data-a="st-exit">'+ic('chevL',14)+' Sair do estudo</button><span class="sp"></span><span class="muted small">'+esc(names)+' · pendentes: <b>'+dueN+'</b> · revisados: <b>'+st.done+'</b></span></div>';
  if(st.cur){
    const c=cardById(st.cur.cardId);if(!c){studyAdvance();return studyHTML();}
    h+='<div class="stwrap '+(st.revealed?'is-rev':'')+'">'+stFace(c,st.cur.idx)+
      '<div class="st-actions"><button class="btn primary big" id="stshow" data-a="st-reveal" '+(st.revealed?'hidden':'')+'>'+(c.type==='basic'?'Virar o card':'Mostrar')+' <kbd>Enter</kbd></button>'+
      '<div id="strate" class="st-rate" '+(st.revealed?'':'hidden')+'>'+RATES.map(r=>'<button class="rate '+r.cls+'" data-a="st-rate" data-r="'+r.k+'"><b>'+r.label+'</b><span>'+r.txt+'</span><kbd>'+r.k+'</kbd></button>').join('')+'</div>'+
      '<button class="btn sm ghost" data-a="st-edit" data-id="'+c.id+'">'+ic('edit',13)+' Editar este card</button></div></div>';
    if(st.revealed)setTimeout(()=>{const sc=$('#stcard');if(sc)sc.classList.add('revealed');},0);
  }else if(st.wait){
    h+='<div class="stwrap"><div class="panel-wait"><h3>Próximo card em <b id="stcount">'+clock(st.wait-now)+'</b></h3><p class="muted">Você classificou algo como difícil: ele volta em instantes.</p><button class="btn primary" data-a="st-skip">Mostrar agora <kbd>Enter</kbd></button></div></div>';
  }else{
    const next=studyPool(st.deckIds).filter(x=>x.due>now).sort((a,b)=>a.due-b.due)[0];
    h+='<div class="stwrap"><div class="panel-wait"><h3>Tudo revisado por enquanto</h3><p class="muted">'+st.done+(st.done===1?' card revisado':' cards revisados')+' nesta sessão.'+(next?' O próximo volta '+inTxt(next.due-now)+'.':'')+'</p><button class="btn primary" data-a="st-exit">Concluir</button></div></div>';
  }
  return h;
}

// ----- professores já usados -----
function splitTeachers(t){return String(t||'').split(',').map(x=>x.trim()).filter(Boolean);}
function teacherList(){
  const cnt={};S.acts.forEach(a=>splitTeachers(a.teacher).forEach(n=>{const k=n.toLowerCase();cnt[k]=(cnt[k]||0)+1;}));
  return S.teachers.slice().sort((a,b)=>(cnt[b.toLowerCase()]||0)-(cnt[a.toLowerCase()]||0)||a.localeCompare(b,'pt-BR'));
}
function rememberTeachers(text){
  let ch=false;
  splitTeachers(text).forEach(n=>{if(S.teachers.map(x=>x.toLowerCase()).indexOf(n.toLowerCase())<0){S.teachers.push(n);ch=true;}});
  return ch;
}
function renderProfChips(){
  const box=$('#profchips'),f=$('#fAct');if(!box||!f)return;
  const list=teacherList(),cur=splitTeachers(f.elements.teacher.value).map(x=>x.toLowerCase());
  box.innerHTML=list.length?'<span class="lbl">Usados antes:</span>'+list.slice(0,14).map(n=>'<button type="button" class="chip '+(cur.indexOf(n.toLowerCase())>=0?'on':'')+'" data-a="prof-pick" data-v="'+esc(n)+'">'+esc(n)+'</button>').join(''):'';
}

function quickPrev(){const f=$('#fQuick');if(!f)return;$('#qprev').innerHTML='Título: <b>'+esc(quickTitle(quickById(f.dataset.k)))+'</b>';}
function quickSlots(f){
  const E=f.elements,date=E.date.value,start=E.start.value,end=E.end.value,rep=E.rep.value;
  if(!date||!start||!end)return {err:'Informe o dia e o horário.'};
  if(tmin(end)<=tmin(start))return {err:'O horário final precisa ser depois do início.'};
  const wk=wd=>({id:uid(),mode:'weekly',weekday:wd,start:start,end:end,from:date,until:''});
  if(rep==='weekly')return {slots:[wk(parseISO(date).getDay())],date:date};
  if(rep==='weekdays')return {slots:[1,2,3,4,5].map(wk),date:date};
  if(rep==='daily')return {slots:[1,2,3,4,5,6,0].map(wk),date:date};
  return {slots:[{id:uid(),mode:'date',date:date,start:start,end:end}],date:date};
}
function saveQuick(){
  const f=$('#fQuick');if(!f)return;const q=quickById(f.dataset.k),r=quickSlots(f);
  if(r.err){toast(r.err);return;}
  const a={id:uid(),done:{},createdAt:Date.now(),title:'',theme:q.theme,themeNA:!q.theme,noArea:false,tipoAtv:q.tipo,kind:'Organização',blockType:q.block,catId:quickCat(q),teacher:'',place:'',link:'',doWhat:'',where:'',plan:{},bring:'',slots:r.slots,docIds:[],goalIds:[],relId:'',itemIds:[],linkIds:[],stow:{},extras:[],moneys:[]};
  a.title=composeTitle(a);S.acts.push(a);
  UI.weekStart=mondayOf(r.date);UI.day=r.date;UI.gscroll=null;
  save();closeModal();rerender();toast(q.short+' adicionado'+(r.slots.length>1?' em '+r.slots.length+' dias':'')+'.');
}

  'sp-free'(el){

  'sp-pick'(el,e){

    const r=el.getBoundingClientRect(),lo=Number(el.dataset.lo),span=Number(el.dataset.span);

    const sm=c.st?tmin(c.st):null,dur=(sm!=null&&c.en&&tmin(c.en)>sm)?tmin(c.en)-sm:60;

/* ==========================================================================
   27. CULINÁRIA (1/2): dados, cálculo de estoque e faltas, telas
       Estoque de ingredientes, receitas e planejamento alimentar semanal.
   ========================================================================== */
const SLOTS=[
  {k:'cafe',l:'Café',s:'Café',t:'07:00'},
  {k:'lm',l:'Lanche da Manhã',s:'Lanche da manhã',t:'10:00'},
  {k:'almoco',l:'Almoço',s:'Almoço',t:'12:00'},
  {k:'lt',l:'Lanche da Tarde',s:'Lanche da tarde',t:'15:30'},
  {k:'jantar',l:'Jantar',s:'Jantar',t:'19:30'}
];
const slotBy=k=>SLOTS.find(s=>s.k===k)||SLOTS[2];
const slotNear=min=>SLOTS.slice().sort((x,y)=>Math.abs(tmin(x.t)-min)-Math.abs(tmin(y.t)-min))[0];
const MOMENTOS=['Café da Manhã','Almoço e Janta','Lanches','Outros'];
const AREAS=['Carnes Vermelhas','Aves','Peixes','Massas','Pratos Vegetarianos','Acompanhamentos','Molhos','Sobremesas','Pães e Lanches'];
const UNITS=[['g','g (gramas)'],['mL','mL'],['un','unidades']];
const ingById=id=>S.ingr.find(i=>i.id===id);
const ingByName=n=>S.ingr.find(i=>norm(i.name)===norm(String(n||'').trim()));
const recById=id=>S.recipes.find(r=>r.id===id);
const mealById=id=>S.meals.find(m=>m.id===id);
const pantryOf=ingId=>S.pantry.find(p=>p.ingId===ingId);
const numIn=v=>{const n=parseFloat(String(v==null?'':v).replace(',','.'));return isFinite(n)?n:0;};
const fmtN=n=>String(Math.round(n*100)/100).replace('.',',');
const r2=x=>Math.round((Number(x)||0)*100)/100;
const ingUnit=id=>{const i=ingById(id);return i?i.unit:'g';};
const ingName=id=>{const i=ingById(id);return i?i.name:'(ingrediente removido)';};
function fmtQty(q,unit,gosto){
  if(gosto)return 'à gosto';
  if(unit==='g'&&q>=1000)return fmtN(q/1000)+' kg';
  if(unit==='mL'&&q>=1000)return fmtN(q/1000)+' L';
  return fmtN(q)+' '+(unit==='un'?'un':unit);
}
// valor médio: R$ por "embalagem" (ex.: R$ 6,00 por 1000 g). À gosto: vale o preço de uma embalagem
function ingCost(ing,qty,gosto){if(!ing)return 0;const p=Number(ing.price)||0;return gosto?p:p*qty/(Number(ing.pack)||1);}

// ----- semana de planejamento: segunda a sábado; no domingo já vale a semana seguinte -----
const foodWeekOf=iso=>parseISO(iso).getDay()===0?addISO(iso,1):mondayOf(iso);
const weekDays=mon=>[0,1,2,3,4,5].map(i=>{const iso=addISO(mon,i);return {iso:iso,wd:WD[parseISO(iso).getDay()]};});
const curFoodWeek=()=>foodWeekOf(todayISO());
const remainingDays=()=>{const t=todayISO();return weekDays(curFoodWeek()).filter(d=>d.iso>=t);};
const dayLabel=iso=>WD[parseISO(iso).getDay()]+' '+fmtDM(iso);
const cmpMeal=(a,b)=>a.date<b.date?-1:a.date>b.date?1:SLOTS.findIndex(s=>s.k===a.slot)-SLOTS.findIndex(s=>s.k===b.slot);

// ----- quantidades por prato -----
function recipeNeeds(r,servings){
  const f=(Number(servings)||Number(r.servings)||1)/(Number(r.servings)||1);
  return (r.ings||[]).map(x=>({ingId:x.ingId,qty:x.gosto?0:(Number(x.qty)||0)*f,gosto:!!x.gosto,note:x.note||''}));
}
// Reparte o estoque pelos pratos planejados (do primeiro ao último). O que não couber vira lista de compras.
function allocWeek(week){
  const stock={},stock0={},need={};S.pantry.forEach(p=>{stock[p.ingId]={qty:p.gosto?Infinity:(Number(p.qty)||0),gosto:!!p.gosto};stock0[p.ingId]={qty:p.gosto?Infinity:(Number(p.qty)||0),gosto:!!p.gosto};});
  const days=weekDays(week).map(d=>d.iso);
  const ms=S.meals.filter(m=>m.kind==='recipe'&&!m.st&&days.indexOf(m.date)>=0).sort(cmpMeal);
  const per={},short={},have={};
  ms.forEach(m=>{
    const r=recById(m.recipeId);if(!r){per[m.id]={rows:[],ok:true,gone:true};return;}
    const rows=recipeNeeds(r,m.servings).map(n=>{
      if(!n.gosto)need[n.ingId]=(need[n.ingId]||0)+n.qty;
      const st=stock[n.ingId];let take=0,miss=0;
      if(n.gosto){miss=(st&&(st.gosto||st.qty>0))?0:1;}
      else{const av=st?st.qty:0;take=Math.min(av,n.qty);miss=n.qty-take;if(st&&isFinite(st.qty))st.qty-=take;}
      if(miss>0.0001){const s=short[n.ingId]=short[n.ingId]||{ingId:n.ingId,qty:0,gosto:false};if(n.gosto){if(!s.qty)s.gosto=true;}else{s.qty+=miss;s.gosto=false;}}
      if(take>0||(n.gosto&&miss<=0)){const h=have[n.ingId]=have[n.ingId]||{ingId:n.ingId,qty:0,gosto:false};if(n.gosto)h.gosto=true;else h.qty+=take;}
      return {ingId:n.ingId,need:n.qty,gosto:n.gosto,take:take,miss:miss,note:n.note};
    });
    per[m.id]={rows:rows,ok:rows.every(x=>x.miss<=0.0001)};
  });
  // Estoque mínimo: o que ficaria abaixo do limite depois dos pratos planejados entra na lista de compras
  S.ingr.forEach(i=>{
    const mn=ingMin(i);if(!(mn>0))return;
    const s0=stock0[i.id];if(s0&&s0.gosto)return;
    const q0=s0?s0.qty:0,final=q0-(need[i.id]||0);
    if(final>=mn-0.0001)return;
    const pk=Number(i.pack)||1,buy=Math.ceil((mn-final)/pk-1e-9)*pk,s=short[i.id]=short[i.id]||{ingId:i.id,qty:0,gosto:false};
    const plan=s.qty;s.gosto=false;s.qty=Math.max(plan,buy);s.min=mn;s.left=Math.max(0,final);s.why=plan>0.0001?'plano':'min';
  });
  return {per:per,short:Object.keys(short).map(k=>short[k]),have:Object.keys(have).map(k=>have[k]),ms:ms};
}
const ingMin=i=>(Number(i&&i.minPk)||0)*(Number(i&&i.pack)||1);
// ingredientes cujo estoque atual está abaixo do mínimo (sem contar pratos planejados)
function lowStock(){
  return S.ingr.map(i=>{
    const mn=ingMin(i);if(!(mn>0))return null;
    const p=pantryOf(i.id);if(p&&p.gosto)return null;
    const q=p?(Number(p.qty)||0):0;
    return q<mn-0.0001?{ing:i,qty:q,min:mn}:null;
  }).filter(Boolean).sort((a,b)=>a.ing.name.localeCompare(b.ing.name,'pt-BR'));
}
const lowNames=ids=>lowStock().filter(x=>ids.indexOf(x.ing.id)>=0).map(x=>x.ing.name);
function shopItems(week){
  return allocWeek(week).short.map(s=>{
    const ing=ingById(s.ingId),qty=s.gosto?0:Math.ceil(s.qty*100)/100;
    const o={ingId:s.ingId,qty:qty,gosto:!!s.gosto,est:r2(ingCost(ing,qty,s.gosto))};
    if(s.why){o.why=s.why;o.left=r2(s.left);o.min=s.min;}
    return o;
  }).sort((a,b)=>ingName(a.ingId).localeCompare(ingName(b.ingId),'pt-BR'));
}
// Compras ainda abertas acompanham o planejamento da semana: prato novo ou trocado entra na lista e na soma
function syncShop(){
  S.acts.forEach(a=>{
    if(!a.shop||a.shop.done)return;
    const items=shopItems(a.shop.week),est=r2(items.reduce((t,i)=>t+i.est,0));
    if(JSON.stringify(items)!==JSON.stringify(a.shop.items)||Math.abs(est-(a.shop.est||0))>0.001){a.shop.items=items;a.shop.est=est;}
  });
}
function foodSave(){syncShop();save();}
function mealLabel(m){
  if(m.kind==='fora')return m.done?{t:'Concluído',cls:'s-eaten'}:{t:'Planejado',cls:'s-prep'};
  if(m.st==='eaten')return {t:'Consumido',cls:'s-eaten'};
  if(m.st==='prep')return {t:'Preparado',cls:'s-done'};
  const a=allocWeek(foodWeekOf(m.date)).per[m.id];
  return a&&!a.ok?{t:'A comprar',cls:'s-buy'}:{t:'A preparar',cls:'s-prep'};
}
const mealTitle=m=>{if(m.kind==='fora')return slotBy(m.slot).s+' fora';const r=recById(m.recipeId);return r?r.title:'(receita excluída)';};
const mstChip=l=>'<span class="mst '+l.cls+'">'+l.t+'</span>';

// ----- estoque -----
function addPantry(ingId,qty,gosto){
  const p=pantryOf(ingId);
  if(!p){S.pantry.push({id:uid(),ingId:ingId,qty:gosto?0:r2(qty),gosto:!!gosto});return;}
  if(gosto){p.gosto=true;return;}
  if(p.gosto)return;
  p.qty=Math.round(((Number(p.qty)||0)+qty)*1000)/1000;
}
function takePantry(ingId,qty){
  const p=pantryOf(ingId);if(!p||p.gosto)return 0;
  const take=Math.min(Number(p.qty)||0,qty);if(take<=0)return 0;
  p.qty=Math.round((p.qty-take)*1000)/1000;
  if(p.qty<=0.0005)S.pantry=S.pantry.filter(x=>x!==p);
  return take;
}
// Preparado: os ingredientes (conforme as porções) saem do estoque; Consumido: só muda o status
function prepMeal(m){
  const r=recById(m.recipeId);if(!r)return;const used=[];
  recipeNeeds(r,m.servings).forEach(n=>{if(n.gosto)return;const t=takePantry(n.ingId,n.qty);if(t>0)used.push({ingId:n.ingId,qty:t});});
  m.used=used;m.st='prep';
}
function unprepMeal(m){(m.used||[]).forEach(u=>addPantry(u.ingId,u.qty,false));m.used=[];m.st='';}

// ----- ligação com o evento "Alimentação" do cronograma -----
const alimOccs=date=>occurrences(date,date).filter(o=>o.act.tipoAtv==='Alimentação');
function autoLinkAct(m){
  const occ=alimOccs(m.date);if(!occ.length)return '';
  const t=tmin(slotBy(m.slot).t);occ.sort((a,b)=>Math.abs(tmin(a.start)-t)-Math.abs(tmin(b.start)-t));
  return occ[0].act.id;
}
function addMeal(o){
  const m={id:uid(),date:o.date,slot:o.slot,kind:o.fora?'fora':'recipe',recipeId:o.fora?'':o.recipeId,servings:Number(o.servings)||1,st:'',actId:o.actId||'',amount:0,done:false,used:[],created:Date.now()};
  if(!m.actId)m.actId=autoLinkAct(m);
  S.meals.push(m);return m;
}
// Refeições que aparecem dentro de uma ocorrência do evento Alimentação (as ligadas a ele ou, se soltas, as do seu horário)
function mealsForOcc(o){
  if(!S.meals.length||o.act.tipoAtv!=='Alimentação')return [];
  const ms=S.meals.filter(m=>m.date===o.date);if(!ms.length)return [];
  const occs=alimOccs(o.date);
  return ms.filter(m=>{
    const lk=m.actId&&actById(m.actId);
    if(lk&&lk.tipoAtv==='Alimentação')return lk.id===o.act.id;
    if(!occs.length)return false;
    const t=tmin(slotBy(m.slot).t),best=occs.slice().sort((a,b)=>Math.abs(tmin(a.start)-t)-Math.abs(tmin(b.start)-t))[0];
    return best.act.id===o.act.id&&best.slot.id===o.slot.id;
  }).sort(cmpMeal);
}
const foodLine=o=>{if(!S.meals.length||o.act.tipoAtv!=='Alimentação')return '';return mealsForOcc(o).map(mealTitle).join(' · ');};

/* ----- 2. receitas ----- */
function recStock(r,servings){ // situação de cada ingrediente da receita frente ao estoque
  return recipeNeeds(r,servings).map(n=>{
    const ing=ingById(n.ingId),p=pantryOf(n.ingId);
    let have=0,state='no';
    if(p&&p.gosto){state='ok';have=Infinity;}
    else if(p){have=Number(p.qty)||0;if(n.gosto)state=have>0?'ok':'no';else state=have>=n.qty-0.0001?'ok':have>0?'part':'no';}
    return {n:n,ing:ing,have:have,state:state};
  });
}
function recipesFiltered(){
  const q=norm(UI.cq||'');
  return S.recipes.filter(r=>(!UI.cmo||r.momento===UI.cmo)&&(!UI.car||r.area===UI.car)&&(!q||norm(r.title).includes(q))).sort((a,b)=>a.title.localeCompare(b.title,'pt-BR'));

const ingDatalist=()=>'<datalist id="ingNames">'+S.ingr.map(i=>'<option value="'+esc(i.name)+'">').join('')+'</datalist>';
const packOf=u=>u==='un'?1:1000;
const unitName=u=>u==='un'?'unidades':u;

/* ----- estoque: adicionar, alterar ----- */
function newIngFields(){
  return '<div class="newing" id="newIng" hidden><p class="hint"><b>Ingrediente novo:</b> informe a unidade e o valor médio de mercado (usado para estimar suas compras).</p>'+
    '<div class="fgrid"><label class="f">Unidade<select name="nunit">'+UNITS.map(x=>'<option value="'+x[0]+'">'+x[1]+'</option>').join('')+'</select></label>'+
    '<div class="f"><span>Valor médio</span><div class="frow" style="flex-wrap:nowrap"><span class="muted">R$</span><input name="nprice" inputmode="decimal" placeholder="0,00" style="flex:1"><span class="muted">por</span><input name="npack" inputmode="decimal" value="1000" style="width:84px"><span class="muted" id="npu">g</span></div></div></div></div>';
}
function openPantry(id){
  const p=id?S.pantry.find(x=>x.id===id):null,ing=p?ingById(p.ingId):null;
  openModal('<form id="fPantry" class="form"><div class="fh"><h2>'+(p?'Alterar ingrediente':'Adicionar ao estoque')+'</h2><button type="button" class="icon-btn" data-a="close" aria-label="Fechar">'+ic('x')+'</button></div>'+ingDatalist()+
    '<label class="f">Ingrediente<input name="name" list="ingNames" required value="'+esc(ing?ing.name:'')+'" autocomplete="off"></label>'+
    '<div class="f"><span>Quantidade</span><div class="frow" style="flex-wrap:nowrap"><input name="qty" inputmode="decimal" value="'+(p&&!p.gosto?esc(String(p.qty).replace('.',',')):'')+'" style="flex:1"><span class="qtyunit" id="pUnit">g / mL / un</span></div>'+
    '<label class="chip cb"><input type="checkbox" name="gosto" '+(p&&p.gosto?'checked':'')+'><span>À gosto (não controlar a quantidade)</span></label></div>'+newIngFields()+
    '<div class="ff"><span class="sp"></span><button type="button" class="btn" data-a="close">Cancelar</button><button class="btn primary">Salvar</button></div></form>');
  const f=$('#fPantry'),E=f.elements;
  const refresh=()=>{
    const i=ingByName(E.name.value);$('#newIng').hidden=!(E.name.value.trim()&&!i);
    const u=i?i.unit:E.nunit.value;$('#pUnit').textContent=unitName(u);$('#npu').textContent=E.nunit.value;
    if(!i&&document.activeElement===E.nunit)E.npack.value=packOf(E.nunit.value);
    E.qty.disabled=E.gosto.checked;
  };
  f.addEventListener('input',refresh);f.addEventListener('change',refresh);refresh();
  f.addEventListener('submit',e=>{
    e.preventDefault();const name=E.name.value.trim();if(!name)return;
    const gosto=E.gosto.checked,qty=numIn(E.qty.value);
    if(!gosto&&qty<=0){toast('Informe a quantidade ou marque "à gosto".');E.qty.focus();return;}
    let i=ingByName(name);
    if(!i){i={id:uid(),name:name,unit:E.nunit.value,price:r2(numIn(E.nprice.value)),pack:numIn(E.npack.value)||packOf(E.nunit.value)};S.ingr.push(i);}
    if(p){
      const other=pantryOf(i.id);
      if(other&&other!==p){ // virou um ingrediente que já estava no estoque: junta
        if(gosto)other.gosto=true;else if(!other.gosto)other.qty=r2((Number(other.qty)||0)+qty);S.pantry=S.pantry.filter(x=>x!==p);
      }else{p.ingId=i.id;p.gosto=gosto;p.qty=gosto?0:qty;}
    }else{
      if(pantryOf(i.id)){addPantry(i.id,qty,gosto);toast('Somado ao que você já tinha de '+i.name+'.');}
      else S.pantry.push({id:uid(),ingId:i.id,qty:gosto?0:qty,gosto:gosto});
    }
    foodSave();closeModal();rerender();
  });
  setTimeout(()=>{if(!p)E.name.focus();},40);
}

function openShopDone(a,k){
  const items=a.shop.items||[];
  if(UI.openOcc&&UI.openOcc.aid===a.id)UI.back={type:'occ',aid:a.id,key:k};
  openModal('<form id="fShop" class="form"><div class="fh"><h2>Compra realizada</h2><button type="button" class="icon-btn" data-a="cancel" aria-label="Fechar">'+ic('x')+'</button></div>'+ingDatalist()+
    '<p class="hint">Estimativa de mercado: <b>'+money(a.shop.est)+'</b>. Informe o valor real e o que você comprou.</p>'+
    '<div class="fgrid"><label class="f">Valor real gasto <small>R$</small><input name="real" inputmode="decimal" required placeholder="0,00"></label><label class="f">Conta<select name="acc">'+S.fin.accounts.map(c=>'<option value="'+c.id+'">'+esc(c.name)+'</option>').join('')+'</select></label></div>'+
    (items.length?'<div class="f"><span>O que você comprou <small>desmarque o que não comprou: continua na lista de faltas; reduza a quantidade se comprou menos</small></span><div id="shopRows">'+items.map(shopRowHTML).join('')+'</div></div>':'')+
    '<div class="f"><span>Comprou algo a mais? <small>vira ingrediente novo ou soma ao estoque</small></span><div id="shopExtra"></div><div><button type="button" class="btn sm" data-a="sh-extra">'+ic('plus',14)+' Ingrediente</button></div></div>'+
    '<div class="ff"><span class="sp"></span><button type="button" class="btn" data-a="cancel">Cancelar</button><button class="btn primary">Concluir compra</button></div></form>');
  const f=$('#fShop');
  f.addEventListener('submit',e=>{
    e.preventDefault();const real=numIn(f.elements.real.value);
    if(!(real>0)){toast('Informe o valor real gasto.');f.elements.real.focus();return;}
    const bought=[];
    $$('#shopRows .sh',f).forEach(r=>{
      if(!$('.sh-ck',r).checked)return;
      const id=r.dataset.ing,it=items.find(x=>x.ingId===id);if(!it)return;
      if(it.gosto){const fresh=!pantryOf(id);addPantry(id,0,true);bought.push({ingId:id,qty:0,gosto:true,fresh:fresh});return;}
      const q=numIn($('.sh-qty',r).value);if(q<=0)return;
      addPantry(id,q,false);bought.push({ingId:id,qty:q,gosto:false});
    });
    $$('#shopExtra .ex',f).forEach(r=>{
      const name=$('.ri-name',r).value.trim(),q=numIn($('.ri-qty',r).value);if(!name||q<=0)return;
      let ing=ingByName(name);
      if(!ing){const u=$('.ri-unit',r).value;ing={id:uid(),name:name,unit:u,price:r2(numIn($('.ri-price',r).value)),pack:packOf(u)};S.ingr.push(ing);}
      addPantry(ing.id,q,false);bought.push({ingId:ing.id,qty:q,gosto:false,extra:true});
    });
    const acc=f.elements.acc.value;
    Object.assign(a.shop,{done:true,real:r2(real),bought:bought,acc:acc,paidOn:todayISO()});
    a.done[k]=Date.now();
    S.fin.paid['shop|'+a.id]={on:todayISO(),amt:r2(real),acc:acc,k:'out'};
    foodSave();finishForm();toast('Compra concluída: '+money(real)+'. O estoque foi atualizado.');
  });
  setTimeout(()=>{f.elements.real.focus();},40);
}
function undoShop(a,k){
  askConfirm('Desfazer esta compra?','Os itens que deram entrada saem do estoque (até onde ainda existirem) e o gasto sai de Finanças.',()=>{
    (a.shop.bought||[]).forEach(b=>{if(b.gosto){if(b.fresh)S.pantry=S.pantry.filter(p=>p.ingId!==b.ingId);}else takePantry(b.ingId,b.qty);});
    delete S.fin.paid['shop|'+a.id];
    Object.assign(a.shop,{done:false,real:0,bought:[],paidOn:''});delete a.done[k];
    foodSave();closeModal();rerender();toast('Compra desfeita.');
  },'Desfazer');
}

/* ==========================================================================
   34b. NOTAS: alinhamento, espaçamento e links no texto (Ctrl+K)
   ========================================================================== */
const LEAF_SEL='p,div,h3,h4,li,blockquote';
function edRange(ned){
  const s=window.getSelection();
  if(s&&s.rangeCount&&ned.contains(s.anchorNode))return s.getRangeAt(0);
  ned.focus();const r=document.createRange();
  if(UI.range&&ned.contains(UI.range.startContainer))r.setStart(UI.range.startContainer,UI.range.startOffset),r.setEnd(UI.range.endContainer,UI.range.endOffset);
  else{r.selectNodeContents(ned);r.collapse(false);}
  s.removeAllRanges();s.addRange(r);return s.getRangeAt(0);
}
function leafOf(node,ned){let n=node&&(node.nodeType===1?node:node.parentNode);while(n&&n!==ned){if(n.nodeType===1&&n.matches(LEAF_SEL))return n;n=n.parentNode;}return null;}
// Trechos soltos na raiz da nota (texto sem parágrafo) viram um <div> por linha, só onde a seleção passa,
// para que alinhamento e espaçamento tenham a que se aplicar.
function ensureRootBlocks(ned,rng){
  if(!ned.firstChild){const d=document.createElement('div');d.appendChild(document.createElement('br'));ned.appendChild(d);rng.setStart(d,0);rng.collapse(true);return;}
  const sc=rng.startContainer,so=rng.startOffset,ec=rng.endContainer,eo=rng.endOffset,col=rng.collapsed;
  const refS=sc===ned?(ned.childNodes[so]||null):null,refE=ec===ned?(ned.childNodes[eo]||null):null;
  const caret=col?(sc===ned?(ned.childNodes[so]||ned.childNodes[so-1]||null):sc):null;
  const isBlk=n=>n.nodeType===1&&BLK_RE.test(n.tagName);
  const lines=[];let cur=[];
  Array.from(ned.childNodes).forEach(n=>{
    if(isBlk(n)){if(cur.length){lines.push({nodes:cur,br:null});cur=[];}return;}
    if(n.nodeType===1&&n.tagName==='BR'){lines.push({nodes:cur,br:n});cur=[];return;}
    if(n.nodeType===3&&!/\S/.test(n.nodeValue)&&!cur.length)return;
    cur.push(n);
  });
  if(cur.length)lines.push({nodes:cur,br:null});
  let changed=false;
  lines.forEach(L=>{
    const probe=L.nodes.length?L.nodes:[L.br];
    const hit=col?probe.some(n=>n===caret||(n.contains&&n.contains(caret))):probe.some(n=>rng.intersectsNode(n));
    if(!hit)return;
    const d=document.createElement('div');ned.insertBefore(d,probe[0]);
    if(L.nodes.length){L.nodes.forEach(n=>d.appendChild(n));if(L.br)L.br.remove();}else d.appendChild(L.br);
    changed=true;
  });
  if(!changed)return;
  try{ // mover os nós leva os limites da seleção para o pai: devolve para o mesmo ponto
    if(sc!==ned&&ned.contains(sc))rng.setStart(sc,so);else if(refS&&refS.parentNode)rng.setStartBefore(refS);
    if(ec!==ned&&ned.contains(ec))rng.setEnd(ec,eo);else if(refE&&refE.parentNode)rng.setEndBefore(refE);
    if(col)rng.collapse(true);
  }catch(e){}
}
function noteBlocks(ned,rng){
  ensureRootBlocks(ned,rng);
  if(rng.collapsed){
    let n=rng.startContainer;if(n===ned)n=ned.childNodes[rng.startOffset]||ned.childNodes[rng.startOffset-1]||null;
    const b=n&&leafOf(n,ned);return b?[b]:[];
  }
  let list=$$(LEAF_SEL,ned).filter(el=>rng.intersectsNode(el));
  list=list.filter(el=>!list.some(o=>o!==el&&el.contains(o)));
  if(list.length>1&&rng.endOffset===0){ // a seleção termina no início de um parágrafo: ele não entra
    const last=list[list.length-1];let f=last;while(f.firstChild)f=f.firstChild;
    if(rng.endContainer===last||rng.endContainer===f)list.pop();
  }
  return list;
}
function withBlocks(fn){
  const ned=curEd();if(!ned||!isEd(ned)||ned.closest('#fCard'))return null;
  ned.focus();const rng=edRange(ned),bl=noteBlocks(ned,rng);
  if(!bl.length){toast('Clique em um parágrafo ou selecione o trecho.');return null;}
  bl.forEach(fn);
  try{const s=window.getSelection();s.removeAllRanges();s.addRange(rng);}catch(e){}
  onNoteInput();return bl;
}
const tidyStyle=el=>{if(!el.getAttribute('style'))el.removeAttribute('style');};
function noteAlign(v){
  const ned=curEd();if(!ned)return;ned.focus();
  const cmd={left:'justifyLeft',center:'justifyCenter',right:'justifyRight',justify:'justifyFull'}[v];
  try{document.execCommand('styleWithCSS',false,true);document.execCommand(cmd,false,null);document.execCommand('styleWithCSS',false,false);}catch(e){}
  withBlocks(b=>{ // confere (e completa, se o navegador não aplicou) o alinhamento de cada parágrafo
    const ta=window.getComputedStyle(b).textAlign;
    if(!(ta===v||(v==='left'&&(ta==='start'||ta==='left'))))b.style.textAlign=v;
  });
}
// Imagens: a selecionada (clique nela) ou as que estão dentro da seleção
function targetImgs(){
  const ned=curEd();if(!ned)return [];
  if(IMGSEL&&document.body.contains(IMGSEL))return [IMGSEL];
  const s=window.getSelection();if(!s||!s.rangeCount||!ned.contains(s.anchorNode))return [];
  const r=s.getRangeAt(0);return $$('img',ned).filter(i=>r.intersectsNode(i));
}
function noteSpace(kind,val){
  const prop={lh:'lineHeight',mt:'marginTop',mb:'marginBottom'}[kind];
  const v=val===''?'':(kind==='lh'?String(val):val+'px');
  withBlocks(b=>{b.style[prop]=v;tidyStyle(b);});
}
function imgSpace(kind,val){
  const ims=targetImgs();if(!ims.length){toast('Clique na imagem para ajustar o espaço dela.');return;}
  ims.forEach(i=>{i.style[kind==='mt'?'marginTop':'marginBottom']=val===''?'':val+'px';tidyStyle(i);});
  onNoteInput();
}
const LH_OPTS=[['','Padrão'],[1,'1'],[1.15,'1,15'],[1.5,'1,5'],[2,'2'],[2.5,'2,5'],[3,'3']],MG_OPTS=[0,4,8,12,16,24,32];
function curSpaceVals(){
  const ned=curEd();let b=null;
  if(ned){const s=window.getSelection();if(s&&s.rangeCount&&ned.contains(s.anchorNode)){const r=s.getRangeAt(0).cloneRange();b=leafOf(r.startContainer===ned?(ned.childNodes[r.startOffset]||ned.lastChild):r.startContainer,ned);}}
  const st=b?b.style:{};
  const px=v=>{const n=parseFloat(v);return isNaN(n)?0:n;};
  return {lh:b&&st.lineHeight?String(parseFloat(st.lineHeight)):'',mt:px(st.marginTop),mb:px(st.marginBottom),ok:!!b};
}
function spaceBoxHTML(){

    '<h6>Espaço depois do parágrafo <small>px</small></h6><div class="frow">'+MG_OPTS.map(m=>chip(v.mb===m,'sp-set','mb',m,m)).join('')+'</div>'+

}

const WL_ORDER=['note','doc','task','act','goal','date','link','pdf','deck'];
function wlAt(node){const el=node&&(node.nodeType===1?node:node.parentNode);const a=el&&el.closest?el.closest('a.wl'):null;return a&&a.closest('.ned')?a:null;}
function wlItems(q){
  const t=norm(q||'');

function wlListHTML(q,canRemove){

function openLinkPicker(){

function wrapTextNodes(r){
  const root=r.commonAncestorContainer.nodeType===3?r.commonAncestorContainer.parentNode:r.commonAncestorContainer;
  const nodes=[],tw=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let n;
  while((n=tw.nextNode())){if(r.intersectsNode(n)&&n.nodeValue.length)nodes.push(n);}
  const out=[],sc=r.startContainer,so=r.startOffset,ec=r.endContainer,eo=r.endOffset;
  nodes.forEach(t=>{
    let a=0,b=t.nodeValue.length;if(t===sc)a=so;if(t===ec)b=eo;
    if(b<=a||!/\S/.test(t.nodeValue.slice(a,b)))return;
    let mid=t;if(a>0)mid=t.splitText(a);if(b-a<mid.nodeValue.length)mid.splitText(b-a);
    const el=document.createElement('a');mid.parentNode.insertBefore(el,mid);el.appendChild(mid);out.push(el);
  });
  return out;
}
const wlSet=(a,k,id)=>{a.removeAttribute('href');a.removeAttribute('target');a.removeAttribute('rel');a.className='wl';a.dataset.k=k;a.dataset.ref=k+':'+id;};
function applyWl(k,id){
  const it=citeItems().find(x=>x.k===k&&x.id===id),label=it?(it.label||'Sem título'):'item',ex=UI.wlEx;UI.wlEx=null;
  closeModal();if(!restoreRange())return;
  const ned=curEd();if(!ned)return;
  if(ex&&ned.contains(ex)){wlSet(ex,k,id);onNoteInput();toast('Link trocado.');return;}
  const s=window.getSelection(),r=s.rangeCount?s.getRangeAt(0):null;
  if(r&&!r.collapsed){
    const mk='#wl'+Date.now().toString(36);let ok=false;
    try{document.execCommand('createLink',false,mk);}catch(e){}
    let as=$$('a[href="'+mk+'"]',ned);
    if(!as.length)as=wrapTextNodes(r.cloneRange());
    as.forEach(a=>wlSet(a,k,id));ok=as.length>0;
    if(!ok){toast('Selecione o texto que será o link.');return;}
  }else{
    const html='<a class="wl" data-k="'+k+'" data-ref="'+k+':'+id+'">'+esc(label)+'</a>&nbsp;';
    let done=false;try{done=document.execCommand('insertHTML',false,html);}catch(e){}
    if(!done||!$$('a.wl[data-ref="'+k+':'+id+'"]',ned).length){const a=document.createElement('a');wlSet(a,k,id);a.textContent=label;r&&r.insertNode(document.createTextNode(' '));r&&r.insertNode(a);}
  }
  onNoteInput();toast('Link criado. Clique nele para abrir.');
}
function wlUnwrap(a){const p=a.parentNode;if(!p)return;while(a.firstChild)p.insertBefore(a.firstChild,a);a.remove();p.normalize();}
// Balão ao clicar num link dentro da edição: abrir, trocar ou remover
function hideWlBubble(){const b=$('#wlbub');if(b)b.remove();UI.wlEl=null;}

document.addEventListener('keydown',e=>{
  if(e.target&&e.target.id==='wlq'){
    const list=$$('#wlList [data-a="wl-pick"]'),cur=list.findIndex(x=>x.classList.contains('on'));
    if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();const n=Math.max(0,Math.min(list.length-1,cur+(e.key==='ArrowDown'?1:-1)));list.forEach(x=>x.classList.remove('on'));if(list[n]){list[n].classList.add('on');if(list[n].scrollIntoView)list[n].scrollIntoView({block:'nearest'});}}
    else if(e.key==='Enter'){e.preventDefault();const t=list[Math.max(0,cur)];if(t)t.click();}
    return;
  }
  if((e.ctrlKey||e.metaKey)&&!e.shiftKey&&!e.altKey&&(e.key==='k'||e.key==='K')){
    const t=e.target,ed=t&&t.closest?t.closest('.ned.editing'):null;
    if(ed&&isEd(ed)&&UI.nview&&UI.nview.type==='note'&&UI.nview.edit&&!ed.closest('#fCard')){e.preventDefault();UI.edEl=ed;openLinkPicker();}

function refInfo(k,id){
  const f={act:()=>{const a=actById(id);return a&&aT(a);},task:()=>{const t=taskById(id);return t&&t.title;},doc:()=>{const d=docById(id);return d&&d.title;},goal:()=>{const g=goalById(id);return g&&g.title;},
    date:()=>{const d=dateById(id);return d&&d.title;},link:()=>{const l=linkById(id);return l&&l.title;},note:()=>{const n=noteById(id);return n&&(n.title||'Sem título');},pdf:()=>{const p=pdfById(id);return p&&p.title;},deck:()=>{const d=deckById(id);return d&&d.name;}}[k];
  const r=f?f():null;return r==null?null:(r||'Sem título');
}
const refPill=(k,id,label)=>'<a class="ref" data-k="'+k+'" data-ref="'+k+':'+id+'">'+esc(label)+'</a>';
const NOTE_FIELDS=['html','wrong','right','just','s','o','a','p'];
function notesCiting(k,id){const key='data-ref="'+k+':'+id+'"';return S.notes.filter(n=>!(k==='note'&&n.id===id)&&(NOTE_FIELDS.some(f=>n[f]&&n[f].indexOf(key)>=0)||(n.type==='fluxo'&&n.fx&&n.fx.nodes.some(x=>x.refs.some(r=>r.k===k&&r.id===id)))));}
function refsOfNote(n){
  const set={},out=[],re=/data-ref="([a-z]+):([^"]+)"/g;
  NOTE_FIELDS.forEach(f=>{const s=n[f]||'';let m;re.lastIndex=0;while((m=re.exec(s))){const key=m[1]+':'+m[2];if(!set[key]&&!(m[1]==='note'&&m[2]===n.id)){set[key]=1;out.push([m[1],m[2]]);}}});
  if(n.type==='fluxo'&&n.fx)n.fx.nodes.forEach(x=>x.refs.forEach(r=>{const key=r.k+':'+r.id;if(!set[key]&&!(r.k==='note'&&r.id===n.id)){set[key]=1;out.push([r.k,r.id]);}}));
  return out;
}
function noteLinksHTML(n){
  const cites=refsOfNote(n).map(r=>({k:r[0],id:r[1],label:refInfo(r[0],r[1])})).filter(x=>x.label!=null);
  const by=[];notesCiting('note',n.id).forEach(x=>by.push(refPill('note',x.id,x.title||'Sem título')));
  S.docs.filter(d=>(d.noteIds||[]).indexOf(n.id)>=0).forEach(d=>by.push(refPill('doc',d.id,d.title)));

    (cites.length?'<div class="nl-row"><span class="muted small">Esta nota cita</span>'+cites.map(c=>refPill(c.k,c.id,c.label)).join('')+'</div>':'')+
    (by.length?'<div class="nl-row"><span class="muted small">Citada em</span>'+by.join('')+'</div>':'')+'</section>';
}
function docLinksHTML(d){

const noteItems=()=>S.notes.map(n=>({id:n.id,label:n.title||'Sem título',sub:n.type==='questao'?'Questão':n.type==='caso'?'Caso Clínico':n.type==='bula'?'Bulário':''}));
