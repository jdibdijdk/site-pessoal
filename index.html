/* ==========================================================================
   36. HÁBITOS: gatilho na agenda, micro-ação, recompensa imediata e "rodovia"
   ========================================================================== */
const HB_STAGES=[
  {n:'Trilha',from:0,txt:'Ainda exige esforço consciente. Seu único trabalho é aparecer.'},
  {n:'Caminho batido',from:15,txt:'A rota já está marcada e fica mais fácil a cada dia.'},
  {n:'Estrada',from:66,txt:'Quase automático: começa sem muita negociação.'},
  {n:'Rodovia',from:250,txt:'Automático: o cérebro faz sem precisar pensar.'}
];
const HB_PHRASES=['Feito. Isso conta.','Mais um passo na trilha.','Pequeno e constante vence.','Boa. O cérebro registrou.','Mais um dia na estrada.'];
const hbById=id=>S.habits.find(h=>h.id===id);
const hbStep=h=>(h.steps&&h.steps[h.lv||0])||'';
const hbReduced=()=>!!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches);
function normHabit(h){
  const x=Object.assign({id:uid(),big:'',steps:[],lv:0,min:2,anchor:{},days:[],reward:'',log:[],created:Date.now(),upSkip:'',lvAt:''},h);
  x.anchor=Object.assign({kind:'text',actId:'',when:'after',time:'',text:''},x.anchor||{});
  x.steps=(Array.isArray(x.steps)?x.steps:[]).map(s=>String(s||'').trim()).filter(Boolean);
  if(!x.steps.length)x.steps=[String(x.name||'').trim()||'Micro-ação'];
  x.lv=Math.max(0,Math.min(x.steps.length-1,Number(x.lv)||0));
  x.days=(Array.isArray(x.days)?x.days:[]).map(Number).filter(d=>d>=0&&d<=6);
  x.log=Array.from(new Set((Array.isArray(x.log)?x.log:[]).filter(d=>/^\d{4}-\d{2}-\d{2}$/.test(d)))).sort();
  x.min=[1,2,5].indexOf(Number(x.min))>=0?Number(x.min):2;
  return x;
}
// Quando o hábito vale numa data: depois/antes de um evento da agenda (nos dias em que ele acontece), num horário ou num momento livre
function hbSched(h,date){
  const wd=parseISO(date).getDay();
  if(h.days&&h.days.length&&h.days.indexOf(wd)<0)return null;
  const an=h.anchor||{};
  if(an.kind==='event'){
    const a=actById(an.actId);if(!a)return null;
    const os=occurrences(date,date).filter(o=>o.act.id===a.id).sort(cmpOcc);if(!os.length)return null;
    const o=an.when==='before'?os[0]:os[os.length-1];
    return {time:an.when==='before'?o.start:o.end,occ:o};
  }
  if(an.kind==='time')return {time:an.time||''};
  return {time:''};
}
function hbAnchorText(h){
  const an=h.anchor||{};
  if(an.kind==='event'){const a=actById(an.actId);if(!a)return 'Evento removido';const pt=actParts(a);return (an.when==='before'?'Antes de ':'Depois de ')+clip([pt.tipo,pt.theme].filter(Boolean).join(' | ')||aT(a),44);}
  if(an.kind==='time')return 'Às '+(an.time||'--:--');
  return an.text?clip(an.text,50):'Quando puder';
}
function hbStats(h){
  const today=todayISO(),key=h.id+'|'+today+'|'+h.log.length;if(HBMEMO[key])return HBMEMO[key];
  const log=new Set(h.log),cr=toISO(new Date(h.created||Date.now()));
  let streak=0,d=today,n=0;
  while(n++<500&&d>=cr){
    if(hbSched(h,d)){if(log.has(d))streak++;else if(d!==today)break;}
    d=addISO(d,-1);
  }
  let sc=0,dn=0;
  for(let i=0;i<30;i++){const dd=addISO(today,-i);if(dd<cr)break;if(hbSched(h,dd)){sc++;if(log.has(dd))dn++;}}
  return HBMEMO[key]={total:log.size,streak:streak,pct:sc?Math.round(dn/sc*100):0,sc:sc};
}
function hbStage(total){let i=0;HB_STAGES.forEach((x,k)=>{if(total>=x.from)i=k;});return {s:HB_STAGES[i],i:i};}
function hbRoadPos(total){
  const b=[0,15,66,250];if(total>=250)return 1;let i=0;while(i<2&&total>=b[i+1])i++;
  return (i+(total-b[i])/(b[i+1]-b[i]))/3;
}
function hbRoadHTML(total){
  const p=hbRoadPos(total);let segs='';
  for(let i=0;i<3;i++){const f=Math.max(0,Math.min(1,p*3-i));segs+='<div class="rseg s'+(i+1)+'"><i class="f" style="width:'+(f*100).toFixed(1)+'%"></i></div>';}
  return '<div class="road" role="img" aria-label="'+total+' dias praticados">'+segs+'<span class="rdot" style="left:'+(p*100).toFixed(1)+'%"></span></div><div class="rlbl"><span>Trilha</span><span>15 dias</span><span>66</span><span>250 · Rodovia</span></div>';
}
function hbHeat(h){
  const today=todayISO(),log=new Set(h.log),cr=toISO(new Date(h.created||0));let s='';
  for(let i=34;i>=0;i--){
    const d=addISO(today,-i),sc=hbSched(h,d);let k='off';
    if(log.has(d))k='on';else if(sc&&d===today)k='now';else if(sc&&d>=cr)k='miss';
    s+='<i class="hc '+k+(d===today?' td':'')+'" title="'+fmtDM(d)+'"></i>';
  }
  return '<div class="heat" aria-hidden="true">'+s+'</div>';
}
function hbToday(date){
  return S.habits.map(h=>({h:h,sc:hbSched(h,date)})).filter(x=>x.sc).map(x=>({h:x.h,time:x.sc.time||''}))
    .sort((a,b)=>{const x=a.time||'99:99',y=b.time||'99:99';return x<y?-1:x>y?1:0;});
}
function hbRowHTML(x,date,mini){

}
function hbRing(ratio){
  const c=2*Math.PI*26;
  return '<svg class="hbring" viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="26" class="bg"/><circle cx="32" cy="32" r="26" class="fg" transform="rotate(-90 32 32)" style="stroke-dasharray:'+c.toFixed(1)+';stroke-dashoffset:'+(c*(1-ratio)).toFixed(1)+'" data-c="'+c.toFixed(1)+'"/></svg>';
}
function hbCardHTML(h){
  const st=hbStats(h),sg=hbStage(st.total),T=todayISO();
  const up=h.steps.length>h.lv+1&&st.streak>=7&&!(h.lvAt&&diffDays(T,h.lvAt)<7)&&!(h.upSkip&&diffDays(T,h.upSkip)<7);
  const left=sg.i<3?HB_STAGES[sg.i+1].from-st.total:0;

    '<div class="hbch"><div class="hbtt"><h3>'+ic('sprout',17)+esc(hbStep(h))+'</h3>'+(h.big?'<div class="big">Rumo a: '+esc(h.big)+'</div>':'')+'<div class="big">'+ic('anchor',12)+esc(hbAnchorText(h))+(h.days.length?' · '+h.days.map(d=>WD[d]).join(', '):'')+'</div></div>'+
    '<span class="stg s'+sg.i+'">'+esc(sg.s.n)+'</span><button class="icon-btn sm" data-a="hb-edit" data-id="'+h.id+'" title="Editar" aria-label="Editar">'+ic('edit',15)+'</button></div>'+
    hbRoadHTML(st.total)+
    '<p class="hbtxt">'+esc(sg.s.txt)+(left>0?' Faltam '+left+(left===1?' dia':' dias')+' praticados para a próxima fase.':'')+'</p>'+
    '<div class="hbstats"><span><b>'+st.total+'</b> dias praticados</span><span>'+ic('flame',13)+'<b>'+st.streak+'</b> '+(st.streak===1?'seguido':'seguidos')+'</span><span><b>'+st.pct+'%</b> nos últimos 30 dias</span></div>'+
    hbHeat(h)+
    (up?'<div class="hbup">Sete dias seguidos. Pronto para o próximo degrau: <b>'+esc(h.steps[h.lv+1])+'</b>? <button class="btn sm primary" data-a="hb-up" data-id="'+h.id+'">Subir</button><button class="btn sm ghost" data-a="hb-later" data-id="'+h.id+'">Ainda não</button></div>':'')+
    '</article>';

function renderHabitos(){
  const T=todayISO(),list=hbToday(T),done=list.filter(x=>x.h.log.indexOf(T)>=0).length,all=list.length&&done===list.length;
  let h='<div class="toolbar"><div class="wlabel"><b>Hábitos</b><span class="muted small">Pequenos o bastante para acontecer todo dia</span></div><button class="btn primary" data-a="hb-new">'+ic('plus',15)+' Novo hábito</button></div>';
  if(!S.habits.length){
    return h+'<div class="hbintro"><div class="hbi">'+ic('anchor',20)+'<div><b>Gatilho</b><p>Ligue a micro-ação a algo que já está na sua agenda: depois de um evento, antes dele ou em um horário.</p></div></div>'+
      '<div class="hbi">'+ic('sprout',20)+'<div><b>Micro-ação</b><p>Reduza até não custar energia. O degrau seguinte só vem quando o primeiro ficar fácil.</p></div></div>'+
      '<div class="hbi">'+ic('sparkle',20)+'<div><b>Recompensa na hora</b><p>Cada micro-ação concluída ganha uma resposta visual imediata.</p></div></div>'+
      '<div class="hbi">'+ic('road',20)+'<div><b>Rodovia</b><p>Os dias praticados mostram a trilha virando estrada e, por fim, rodovia.</p></div></div>'+
      '<div><button class="btn primary" data-a="hb-new">'+ic('plus',15)+' Criar o primeiro hábito</button></div></div>';
  }
  const prev=UI.hbRing==null?0:UI.hbRing,ratio=list.length?done/list.length:0;
  h+='<div class="hbprog'+(all?' all':'')+'"><div class="hbpw">'+hbRing(prev)+'<b>'+done+'/'+list.length+'</b></div><div><div class="hbpt">'+(!list.length?'Nada previsto para hoje':all?'Dia completo':'Hoje')+'</div><div class="muted small">'+(!list.length?'Os hábitos ligados a eventos aparecem nos dias em que o evento acontece.':all?'Todas as micro-ações de hoje foram feitas.':(list.length-done)+(list.length-done===1?' micro-ação falta':' micro-ações faltam'))+'</div></div></div>';

const IMP_WD={dom:0,domingo:0,seg:1,segunda:1,ter:2,terca:2,qua:3,quarta:3,qui:4,quinta:4,sex:5,sexta:5,sab:6,sabado:6};
const impKey=k=>norm(k).replace(/[^a-z0-9]/g,'');
function impGet(o,names){
  if(!o||typeof o!=='object')return undefined;
  const m={};Object.keys(o).forEach(k=>{m[impKey(k)]=o[k];});
  for(let i=0;i<names.length;i++){const v=m[impKey(names[i])];if(v!==undefined&&v!==null&&v!=='')return v;}
  return undefined;
}
const impStr=v=>Array.isArray(v)?v.map(x=>String(x).trim()).filter(Boolean).join('\n'):(v==null?'':String(v).trim());
const impMoney=v=>{if(typeof v==='number')return v;return parseNum(v);};
function impDate(s){
  s=norm(String(s||'')).trim();if(!s)return '';
  if(s==='hoje')return todayISO();if(s==='amanha')return addISO(todayISO(),1);
  let m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);if(m)return m[1]+'-'+pad(+m[2])+'-'+pad(+m[3]);
  m=s.match(/^(\d{1,2})[\/.-](\d{1,2})(?:[\/.-](\d{2,4}))?$/);
  if(m){
    let y=m[3]?Number(m[3]):parseISO(todayISO()).getFullYear();if(y<100)y+=2000;
    let iso=y+'-'+pad(+m[2])+'-'+pad(+m[1]);
    if(!m[3]&&iso<addISO(todayISO(),-180))iso=(y+1)+'-'+pad(+m[2])+'-'+pad(+m[1]);
    return isNaN(parseISO(iso).getTime())?'':iso;
  }
  return '';
}
function impTimes(s,fim,dur){
  const hm=(h,mi)=>{h=+h;mi=+(mi||0);return (h>23||mi>59)?null:pad(h)+':'+pad(mi);};
  const one=t=>{const m=String(t||'').match(/^\s*(\d{1,2})\s*(?::|h)?\s*(\d{2})?\s*$/i);return m?hm(m[1],m[2]):null;};
  let a=null,b=null;
  const r=String(s||'').match(/(\d{1,2})\s*(?::|h)?\s*(\d{2})?\s*(?:-|–|—|às|as|a|até|ate)\s*(\d{1,2})\s*(?::|h)?\s*(\d{2})?/i);
  if(r){a=hm(r[1],r[2]);b=hm(r[3],r[4]);}
  else{a=one(s);b=one(fim);}
  if(a&&!b){const d=Number(dur)||60,e=tmin(a)+d;if(e<=1439)b=pad(Math.floor(e/60))+':'+pad(e%60);}
  return {start:a,end:b};
}
function impCat(name){
  name=String(name||'').trim();if(!name)return {id:'',warn:''};
  const parts=name.split(/\s*(?:>|›|\/|»)\s*/).filter(Boolean),last=norm(parts[parts.length-1]);
  let c=S.cats.find(x=>norm(x.name)===last&&(parts.length<2||(x.parentId&&norm((catById(x.parentId)||{}).name)===norm(parts[parts.length-2]))))||S.cats.find(x=>norm(x.name)===last);
  if(!c)c=S.cats.find(x=>norm(x.name).indexOf(last)>=0);
  return c?{id:c.id,warn:''}:{id:'',warn:'categoria "'+name+'" não existe'};

function impBlock(b,tipo){

// monta um evento a partir de um objeto solto (linha do lote ou JSON da IA)
function impEvent(o){

  if(!titulo)return {bad:'sem título'};
  const times=impTimes(impGet(o,['horario','hora','inicio','start']),impGet(o,['fim','end','termino']),impGet(o,['duracao','duracaomin','minutos']));

  let tm=times;
  if(rawT&&!times.start)tm=impTimes(rawT);
  if(!tm.start||!tm.end)return {bad:'horário inválido (use 08:00-10:00)',titulo:titulo};
  if(tmin(tm.end)<=tmin(tm.start))return {bad:'o fim precisa ser depois do início (eventos que viram a meia-noite: divida em dois)',titulo:titulo};
  const dias=[];

  lst(dd).forEach(x=>{const d=impDate(x);if(d)dias.push({date:d});else W.push('data "'+x+'" não entendida');});
  lst(dw).forEach(x=>{
    const k=norm(String(x)).replace(/-?feira/,'').trim(),d=impDate(x);

  const cat=impCat(impGet(o,['categoria','category','cat']));if(cat.warn)W.push(cat.warn);
  const tipoR=impStr(impGet(o,['tipo','tipoatividade','tipoatv'])),tipo=TIPOS.find(t=>norm(t)===norm(tipoR))||'';

  // aviso de choque com o que já existe (só datas únicas)

}

// lê o texto colado da IA (JSON, com ou sem ```)
function impParseIA(text){
  let t=String(text||'').trim();if(!t)return {items:[],err:''};
  const fence=t.match(/```(?:json|JSON)?\s*([\s\S]*?)```/);if(fence)t=fence[1].trim();
  const a=t.search(/[\[{]/);if(a<0)return {items:[],err:'Não encontrei o bloco JSON na resposta. Peça à IA para entregar o bloco no formato combinado.'};
  const end=Math.max(t.lastIndexOf('}'),t.lastIndexOf(']'));
  let obj;
  try{obj=JSON.parse(t.slice(a,end+1));}catch(e){return {items:[],err:'O JSON está incompleto ou com erro ('+e.message.slice(0,60)+'). Peça à IA para reenviar só o bloco JSON.'};}
  if(Array.isArray(obj))obj={eventos:obj};
  const sec=(names)=>{const v=impGet(obj,names);return Array.isArray(v)?v:[];};
  const items=[];
  sec(['objetivos','goals']).forEach(o=>items.push(impItem('goal',o,'Objetivo')));
  sec(['eventos','events','agenda']).forEach((o,i)=>items.push(impItem('ev',o,'Evento '+(i+1))));
  sec(['tarefas','tasks']).forEach((o,i)=>items.push(impItem('task',o,'Tarefa '+(i+1))));
  sec(['datas','prazos','dates']).forEach((o,i)=>items.push(impItem('date',o,'Data '+(i+1))));
  sec(['habitos','habits']).forEach((o,i)=>items.push(impItem('habit',o,'Hábito '+(i+1))));
  sec(['refeicoes','alimentacao','meals','cardapio']).forEach((o,i)=>items.push(impItem('meal',o,'Refeição '+(i+1))));
  sec(['mercado','compras','listademercado','shopping']).forEach((o,i)=>items.push(impItem('shop',o,'Item '+(i+1))));
  sec(['financas','finances','financeiro']).forEach((o,i)=>{
    const tp=norm(impStr(impGet(o,['tipo','type','natureza'])));
    items.push(impItem(/entrada|receita|recebimento|income/.test(tp)?'income':/divida|parcel/.test(tp)?'debt':'bill',o,'Finança '+(i+1)));
  });
  if(!items.length)return {items:[],err:'O JSON não trouxe nenhuma seção conhecida (eventos, tarefas, financas, refeicoes, mercado, habitos, objetivos, datas).'};
  return {items:items,err:''};
}
// grava os itens escolhidos; devolve contagem por tipo
function impApply(items){
  const cnt={},bump=k=>{cnt[k]=(cnt[k]||0)+1;};let firstDate='';
  const shopList=[];
  const ensureIng=(nome,un,price,pack)=>{
    let i=ingByName(nome);
    if(!i){const uu=UNITS.find(x=>norm(x[0])===norm(un||'')),u=uu?uu[0]:'g';i={id:uid(),name:nome,unit:u,price:r2(price||0),pack:pack||(u==='un'?1:1000),minPk:0};S.ingr.push(i);}
    return i;
  };
  items.forEach(it=>{
    const d=it.d;
    if(it.kind==='goal'){
      const par=d.pai?S.goals.find(g=>norm(g.title)===norm(d.pai)):null;
      S.goals.push({id:uid(),title:d.titulo,horizon:d.horizon,parentId:par?par.id:'',done:false,linkIds:[],deadline:'',firm:false});bump('goal');
    }else if(it.kind==='ev'){
      S.acts.push(impMkAct(d));bump('ev');
      const s=d.slots.find(x=>x.mode==='date');if(s&&(!firstDate||s.date<firstDate))firstDate=s.date;
    }else if(it.kind==='task'){
      S.tasks.push({id:uid(),title:d.titulo,notes:d.notas,deadline:d.prazo,deadlineTime:d.hora,catId:d.catId,docId:'',link:d.link,done:false,activityIds:[],goalIds:[],linkIds:[],itemIds:[],where:d.metodologia,plan:{},dateIds:[],moneys:[],createdAt:Date.now()});bump('task');
    }else if(it.kind==='date'){
      S.dates.push({id:uid(),title:d.titulo,date:d.data,time:d.hora,cat:'Prazo',notes:d.notas,catId:''});bump('date');
    }else if(it.kind==='bill'){
      S.fin.bills.push({id:uid(),name:d.nome,amount:d.valor,date:d.data,rec:d.rec,until:'',acc:d.acc});bump('bill');
    }else if(it.kind==='income'){
      S.fin.incomes.push({id:uid(),name:d.nome,amount:d.valor,date:d.data,rec:d.rec,until:'',acc:d.acc});bump('income');
    }else if(it.kind==='debt'){
      S.fin.debts.push({id:uid(),name:d.nome,creditor:d.credor,n:d.n,inst:d.inst,first:d.first,acc:d.acc});bump('debt');
    }else if(it.kind==='habit'){
      S.habits.push(normHabit({big:d.big,steps:d.steps,min:d.min,anchor:{kind:'text',text:d.gatilho},days:d.days,reward:d.reward}));bump('habit');
    }else if(it.kind==='meal'){
      if(d.fora){addMeal({date:d.data,slot:d.slot,fora:true,servings:d.porcoes});}
      else{
        let r=S.recipes.find(x=>norm(x.title)===norm(d.receita));
        if(!r){r={id:uid(),title:d.receita,photo:'',momento:MOMENTOS.find(m=>norm(m)===norm(d.momento))||'',area:AREAS.find(m=>norm(m)===norm(d.area))||'',servings:d.porcoes||2,ings:d.ings.map(x=>{const g=!(x.qtd>0),i=ensureIng(x.nome,x.un,0);return {ingId:i.id,qty:g?0:x.qtd,gosto:g,note:x.obs};}),steps:d.steps,created:Date.now(),updated:Date.now()};S.recipes.push(r);}
        addMeal({date:d.data,slot:d.slot,recipeId:r.id,servings:d.porcoes});
      }
      bump('meal');
    }else if(it.kind==='shop'){
      shopList.push(d);
    }
  });
  if(shopList.length){
    // cada item vira ingrediente (com valor, se informado) e as quantidades ficam numa tarefa de compra
    shopList.forEach(x=>{const i=ensureIng(x.nome,x.un,x.valor,x.qtd>0?x.qtd:0);if(x.valor>0&&!(Number(i.price)>0)){i.price=r2(x.valor);if(x.qtd>0)i.pack=x.qtd;}});
    const total=shopList.reduce((t,x)=>t+(x.valor||0),0);
    S.tasks.push({id:uid(),title:'Comprar no mercado ('+shopList.length+' itens)',notes:shopList.map(x=>'- '+x.nome+(x.qtd?': '+fmtN(x.qtd)+' '+(x.un||''):'')+(x.valor?' ('+money(x.valor)+')':'')).join('\n'),deadline:'',deadlineTime:'',catId:'',docId:'',link:'',done:false,activityIds:[],goalIds:[],linkIds:[],itemIds:[],where:'',plan:{},dateIds:[],
      moneys:total>0?[{id:uid(),desc:'Compra de mercado',amount:r2(total),kind:'out',cat:'Compras',date:todayISO(),acc:S.fin.accounts[0].id}]:[],createdAt:Date.now()});
    cnt.shop=shopList.length;
  }
  return {cnt:cnt,firstDate:firstDate};
}

   ========================================================================== */
const stripExt=n=>String(n||'').replace(/\.[a-z0-9]{1,5}$/i,'').trim();
function driveFolder(){
  let f=S.dfolders.find(x=>!x.parentId&&norm(x.name)==='resumos starnote');
  if(!f){f={id:uid(),name:'Resumos StarNote',parentId:''};S.dfolders.push(f);}
  return f;
}
// Junta a lista do Drive com os documentos; devolve {added,updated}
function driveMerge(res){
  const files=(res&&res.arquivos)||[];let added=0,updated=0;
  files.forEach(fl=>{
    const title=stripExt(fl.nome)||fl.nome;
    let d=S.docs.find(x=>x.driveId===fl.id);
    if(!d)d=S.docs.find(x=>!x.driveId&&norm(x.title)===norm(title));
    if(!d){
      const fo=driveFolder();
      S.docs.push({id:uid(),createdAt:Date.now(),title:title,catId:'',link:fl.url,notes:'',todo:[],goalIds:[],linkIds:[],noteIds:[],folderId:fo.id,ext:detectExt(fl.nome)||'',status:'finalizado',source:'',srcLink:'',starnote:true,driveId:fl.id,driveMod:fl.mod||0});
      added++;return;
    }
    let ch=false;
    if(d.driveId!==fl.id){d.driveId=fl.id;ch=true;}
    if(fl.url&&d.link!==fl.url){d.link=fl.url;ch=true;}
    if((fl.mod||0)!==(d.driveMod||0)){d.driveMod=fl.mod||0;ch=true;}
    if(d.status!=='finalizado'){d.status='finalizado';d.todo.forEach(x=>{if(x.label==='Concluir')x.done=true;});ch=true;}
    if(ch)updated++;
  });
  if(added||updated){save();}
  return {added:added,updated:updated,total:files.length};
}
async function driveSync(manual){
  if(UI.drvBusy)return;
  if(!Cloud.on()){if(manual)toast('A ponte com o Drive só funciona com o site aberto pelo Apps Script (link /exec ou Google Sites).');return;}
  UI.drvBusy=true;if(manual)toast('Procurando na pasta Resumos_StarNote…');
  try{
    const r=await Cloud.call('resumos');
    if(!r||r.ok===false)throw new Error((r&&r.erro)||'resposta vazia');
    const m=driveMerge(r);UI.drvAt=Date.now();
    if(UI.tab==='docs')rerender();
    if(manual||m.added||m.updated)toast(m.added||m.updated?(m.added+' novo(s), '+m.updated+' atualizado(s) a partir do Drive.'):'Drive conferido: '+m.total+' arquivo(s), nada novo.');
  }catch(e){
    if(manual)toast(/is not a function|api_resumos|página em vez/i.test(String(e.message))?'O Code.gs precisa ser atualizado e publicado numa nova versão (função api_resumos).':'Não consegui ler o Drive: '+e.message);
  }finally{UI.drvBusy=false;}
}
function driveAuto(){if(Cloud.ready&&(!UI.drvAt||Date.now()-UI.drvAt>30*60e3))driveSync(false);}

const PM_PHASES=[['focus','Foco'],['short','Pausa Curta'],['long','Pausa Longa']];
function pmGet(){
  const p=S.prefs.pomo=S.prefs.pomo||{};
  p.cfg=Object.assign({focus:25,short:5,long:15,every:4},p.cfg||{});
  p.subs=p.subs||{};p.log=p.log||[];
  p.cur=Object.assign({taskId:'',title:'',phase:'focus',running:false,endsAt:0,left:0,n:0},p.cur||{});
  if(!p.cur.left&&!p.cur.running)p.cur.left=pmDur(p,p.cur.phase);
  return p;
}
const pmDur=(p,ph)=>Math.max(1,Number(p.cfg[ph]||25))*60;
const pmKey=p=>p.cur.taskId||'free';
function pmLeft(p){return p.cur.running?Math.max(0,Math.round((p.cur.endsAt-Date.now())/1000)):p.cur.left;}
const pmFmt=s=>pad(Math.floor(s/60))+':'+pad(s%60);
function pmNext(p,ph){
  const c=p.cur;
  if(ph==='focus'){c.n=(c.n||0)+1;c.phase=(c.n%Math.max(1,Number(p.cfg.every)||4)===0)?'long':'short';}
  else c.phase='focus';
  c.running=false;c.endsAt=0;c.left=pmDur(p,c.phase);
}
function pmComplete(){
  const p=pmGet(),c=p.cur;if(!c.running)return;
  const ph=c.phase;
  if(ph==='focus'){
    const t=c.taskId&&taskById(c.taskId);
    p.log.push({d:todayISO(),at:Date.now(),min:Math.round(pmDur(p,'focus')/60),title:t?t.title:(c.title||''),taskId:c.taskId||''});
    if(p.log.length>500)p.log=p.log.slice(-500);
  }
  pmNext(p,ph);save();
  ntFire(ph==='focus'?'Foco concluído':'Pausa terminou',ph==='focus'?'Hora da '+(c.phase==='long'?'pausa longa.':'pausa curta.'):'Vamos para o próximo foco?','pomodoro');

}

/* ----- árvore: cada atividade concluída faz a árvore crescer ----- */
const GM_TREE=40,GM_STAGES=[[0,'Semente'],[4,'Broto'],[10,'Muda'],[18,'Árvore Jovem'],[26,'Árvore Adulta'],[34,'Árvore Florida']];
const GM_W={evento:3,tarefa:3,habito:2,pomodoro:2,sub:1};
function gmXP(){
  const T=todayISO();let tot=0,today=0,parts={evento:0,tarefa:0,habito:0,pomodoro:0,sub:0};
  const add=(k,d)=>{const n=GM_W[k];tot+=n;parts[k]+=n;if(d===T)today+=n;};
  const dOf=ts=>{const n=Number(ts);return n>1e11?toISO(new Date(n)):'';};
  S.acts.forEach(a=>{if(quickOf(a))return;Object.keys(a.done||{}).forEach(k=>add('evento',dOf(a.done[k])));});
  S.tasks.forEach(t=>{if(t.done)add('tarefa',dOf(t.doneAt));});
  S.habits.forEach(h=>(h.log||[]).forEach(d=>add('habito',d)));
  const p=pmGet();p.log.forEach(e=>add('pomodoro',e.d));
  Object.keys(p.subs).forEach(k=>p.subs[k].forEach(s=>{if(s.done)add('sub',dOf(s.doneAt));}));
  return {tot:tot,today:today,parts:parts};
}
function gmStage(inTree){let s=0;GM_STAGES.forEach((x,i)=>{if(inTree>=x[0])s=i;});return s;}
function treeSVG(stage,mini){

  const trunk=[0,26,48,72,92,104][Math.min(stage,5)];
  if(stage===0)h+='<ellipse cx="100" cy="182" rx="9" ry="6" class="tr-seed"/>';
  else{
    h+='<g class="tr-grow"><path d="M100 190 L100 '+(190-trunk)+'" class="tr-trunk" style="stroke-width:'+(5+stage*2.2)+'"/>';
    if(stage===1)h+='<ellipse cx="90" cy="'+(190-trunk-2)+'" rx="12" ry="6" transform="rotate(-25 90 '+(190-trunk-2)+')" class="tr-leaf"/><ellipse cx="110" cy="'+(190-trunk-4)+'" rx="12" ry="6" transform="rotate(25 110 '+(190-trunk-4)+')" class="tr-leaf2"/>';
    if(stage===2)h+=g(0,100,190-trunk-6,20,'tr-leaf')+g(0,84,190-trunk+8,14,'tr-leaf2')+g(0,116,190-trunk+8,14,'tr-leaf2');
    if(stage>=3){const cy=190-trunk,R=[0,0,0,30,38,44][Math.min(stage,5)];
      h+=g(0,100,cy-R*.35,R,'tr-leaf')+g(0,100-R*.7,cy+R*.2,R*.7,'tr-leaf2')+g(0,100+R*.7,cy+R*.2,R*.7,'tr-leaf2');
      if(stage>=4)h+=g(0,100-R*.4,cy-R*.9,R*.55,'tr-leaf3')+g(0,100+R*.45,cy-R*.8,R*.5,'tr-leaf3');
      if(stage>=5)[[-.5,-.2],[.4,-.5],[.1,.35],[-.15,-.8],[.65,.1],[-.75,.25]].forEach(f=>{h+=g(0,100+f[0]*R*1.3,cy+f[1]*R*1.1,4.2,'tr-fruit');});}

  return h+'</svg>';

/* ----- rotas: ?tab=semana&d=2026-10-20, ?nota=ID, ?do=done&k=CHAVE (vindas dos atalhos, widgets e notificações) ----- */
const ROUTE={
  read(search){
    let q;try{q=new URLSearchParams(search!=null?search:location.search);}catch(e){return;}
    const tab=q.get('tab'),d=q.get('d'),nota=q.get('nota');

  },

/* ----- ações tocadas na notificação (Concluir, Feito, Adiar) ----- */
function ntAction(a,key,n){
  const p=String(key||'').split('|'),k=p[0];
  if(a==='snooze'){
    const mins=(k==='ev'||k==='pp')?10:60,at=Date.now()+mins*60000;
    NC.snooze({k:key.replace(/\|s\d+$/,'')+'|s'+at,at:at,t:(n&&n.t)||'Lembrete adiado',b:(n&&n.b)||''});
    toast('Aviso adiado por '+(mins===60?'1 hora':mins+' minutos')+'.');return;
  }
  if(a==='done'){
    if(k==='tk'){const t=taskById(p[1]);if(t&&!t.done){t.done=true;t.doneAt=Date.now();if(t.status)delete t.status;save();rerender();toast('Tarefa concluída: '+t.title);}return;}
    if(k==='hb'){const h=hbById(p[1]),d=p[2]||todayISO();if(h&&h.log.indexOf(d)<0&&d<=todayISO()){h.log.push(d);h.log.sort();save();rerender();toast('Hábito marcado.');}return;}
  }
  ROUTE.go(ntUrl(key));
}

const PWA={
  evt:null,waiting:null,
  isIOS(){return /iphone|ipad|ipod/i.test(navigator.userAgent)&&!window.MSStream;},

  },
  watch(reg){
    if(!reg)return;
    const ready=w=>{this.waiting=w;this.banner();};
    if(reg.waiting&&navigator.serviceWorker.controller)ready(reg.waiting);
    reg.addEventListener('updatefound',()=>{const w=reg.installing;if(!w)return;w.addEventListener('statechange',()=>{if(w.state==='installed'&&navigator.serviceWorker.controller)ready(w);});});
    setInterval(()=>{reg.update().catch(()=>{});},30*60000);
  },
  banner(){
    if($('#updbar'))return;
    const b=document.createElement('div');b.id='updbar';b.className='updbar';b.setAttribute('role','status');
    b.innerHTML=ic('download',16)+'<span>Nova versão disponível</span><button class="btn sm primary" data-a="pwa-update">Atualizar</button><button class="icon-btn sm" data-a="pwa-update-later" aria-label="Depois">'+ic('x',14)+'</button>';

let PWA_RELOADING=false;
if('serviceWorker' in navigator){
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(PWA_RELOADING)return;PWA_RELOADING=true;flushNote();location.reload();});
  navigator.serviceWorker.addEventListener('message',e=>{
    const m=e.data||{};
    if(m.type==='open'&&m.u)ROUTE.go(m.u);
    else if(m.type==='action')ntAction(m.a,m.k,m);

      return {d:o.date,s:o.start,e:o.end,t:pp.theme||aT(o.act),k:pp.tipo||'',p:o.act.place||'',ok:o.done?1:0,c:catColor(o.act.catId)||''};});
    const tasks=S.tasks.filter(t=>!t.done).map(t=>({id:t.id,t:t.title||'Sem título',d:tDue(t)||'',h:tDueTime(t)||''})).sort((a,b)=>(a.d||'9999')<(b.d||'9999')?-1:(a.d||'9999')>(b.d||'9999')?1:0).slice(0,30);
    const habits=[];for(let i=0;i<=7;i++){const d=addISO(T,i);hbToday(d).forEach(x=>habits.push({id:x.h.id,d:d,s:x.time,t:hbStep(x.h),m:x.h.min,ok:x.h.log.indexOf(d)>=0?1:0}));}
    const notes=S.notes.slice().sort((a,b)=>(b.updated||0)-(a.updated||0)).slice(0,8).map(n=>({id:n.id,t:n.title||'Sem título',u:n.updated||0}));
    const bills=[];S.fin.bills.forEach(b=>recDates(b,T,addISO(T,20)).forEach(d=>{if(!S.fin.paid['bill|'+b.id+'|'+d])bills.push({d:d,t:b.name,v:money(b.amount)});}));
    bills.sort((a,b)=>a.d<b.d?-1:1);
    let url='';try{url=location.protocol.indexOf('http')===0?location.origin+location.pathname.replace(/[^/]*$/,''):'';}catch(e){}
    return {at:Date.now(),url:url,ev:ev,tasks:tasks,habits:habits,notes:notes,bills:bills.slice(0,10)};
  },
  write(){try{const j=JSON.stringify(this.snap());LS.set(this.KEY,j);this.post(j);this.cloud(j);}catch(e){}},
  // o app Android de widgets lê este resumo no Firestore (documento rotina/<chave>_widgets)
  last:'',lastAt:0,
  cloud(j){
    try{
      if(!FB.active())return;const body=j.replace(/"at":\d+,/,'');
      if(body===this.last&&Date.now()-this.lastAt<30*60000)return;
      this.last=body;this.lastAt=Date.now();
      FB.sdk.setDoc(FB.sdk.doc(FB.db,'rotina',FB_KEY+'_widgets'),{json:j,updated:Date.now()}).catch(()=>{this.last='';});
    }catch(e){}
  },
  post(j){try{const c=navigator.serviceWorker&&navigator.serviceWorker.controller;if(c)c.postMessage({type:'widgets',data:j||LS.get(this.KEY)||''});}catch(e){}},
  soon(){clearTimeout(this.t);this.t=setTimeout(()=>this.write(),1500);},
  // marcações feitas direto no widget (tarefa concluída, hábito feito) entram aqui ao abrir o app
  drain(){
    let q=[];try{q=JSON.parse(LS.get(this.QKEY)||'[]');}catch(e){}if(!q.length)return;LS.set(this.QKEY,'[]');let ch=false;
    q.forEach(x=>{
      if(x.a==='task'){const t=taskById(x.id);if(t&&!t.done){t.done=true;t.doneAt=x.at||Date.now();ch=true;}}
      if(x.a==='habit'){const h=hbById(x.id);if(h){const i=h.log.indexOf(x.d);if(x.on&&i<0){h.log.push(x.d);h.log.sort();ch=true;}if(!x.on&&i>=0){h.log.splice(i,1);ch=true;}}}
    });
    if(ch){save();rerender();}
  }
};
window.addEventListener('storage',e=>{if(e.key===WG.QKEY)WG.drain();});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){WG.drain();NC.merge();}else WG.write();});

/* ==========================================================================
   34c. QUESTÕES: banco MedFisher embutido; "Enviar para Notas" vira Questão ou Caso clínico
   ========================================================================== */
const MF_ORIGIN='https://medfisher-2.luiswgustavo15.workers.dev/#/';
const mfUser=()=>/^(0[1-9]|10)$/.test(S.prefs.mfUser||'')?S.prefs.mfUser:'02';
const mfUrl=()=>MF_ORIGIN+'/?u='+mfUser()+'#/questoes';
// O banco fica num quadro que nunca é recriado: trocar de aba e voltar mantém a questão onde estava
const QF={
  el:null,user:'',
  sync(){
    const on=UI.tab==='questoes',slot=$('#qslot');
    if(!on||!slot){if(this.el)this.el.hidden=true;document.body.classList.remove('qtab');return;}
    if(!this.el||this.user!==mfUser()){
      if(this.el)this.el.remove();
      const f=document.createElement('iframe');f.id='qframe';f.className='qframe';f.title='Banco de questões MedFisher';f.src=mfUrl();
      f.setAttribute('allow','clipboard-write; fullscreen');document.body.appendChild(f);this.el=f;this.user=mfUser();
    }
    document.body.classList.add('qtab');this.el.hidden=false;this.place();
  },
  place(){
    const slot=$('#qslot');if(!slot||!this.el||this.el.hidden)return;
    const r=slot.getBoundingClientRect(),top=r.top+window.scrollY,bar=$('#tabs'),bb=bar&&getComputedStyle(bar).position==='fixed'?bar.offsetHeight:0;
    Object.assign(this.el.style,{top:top+'px',left:r.left+'px',width:r.width+'px',height:Math.max(360,window.innerHeight-r.top-bb-8)+'px'});
  },
  reload(){if(this.el){this.el.src=mfUrl();}}
};
window.addEventListener('resize',()=>QF.place());
function renderQuestoes(){
  const n=S.notes.filter(x=>x.mfId).length;
  return '<div class="qhead"><h2 class="vt">Questões</h2><span class="muted small">MedFisher · usuário '+mfUser()+(n?' · '+n+(n===1?' enviada para Notas':' enviadas para Notas'):'')+'</span><span class="sp"></span>'+
    '<button class="btn sm ghost" data-a="mf-user" title="Trocar o usuário do MedFisher">'+ic('user',14)+' '+mfUser()+'</button>'+
    '<button class="btn sm ghost" data-a="mf-reload" title="Voltar para a lista de questões">'+ic('repeat',14)+' Recarregar</button>'+
    '<a class="btn sm ghost" href="'+esc(mfUrl())+'" target="_blank" rel="noopener">'+ic('external',14)+' Abrir em nova aba</a></div>'+
    '<p class="muted small qtip">Abra uma questão e toque em <b>Enviar para Notas</b> para guardá-la como Questão ou Caso clínico.</p><div id="qslot" class="qslot"></div>';
}
// texto puro do banco → HTML seguro das notas
const mfTxt=t=>String(t||'').split(/\n+/).map(l=>l.trim()).filter(Boolean).map(l=>'<div>'+esc(l)+'</div>').join('');
const mfImgs=l=>(l||[]).filter(s=>typeof s==='string'&&IMG_SRC.test(s)).slice(0,8).map(s=>'<img src="'+s+'" style="width:480px"><br>').join('');
function mfClean(q){
  const str=(v,m)=>String(v==null?'':v).slice(0,m||20000);
  return {id:str(q.id,200),numero:str(q.numero,10),instituicao:str(q.instituicao,200),ano:str(q.ano,4),area:str(q.area,200),subarea:str(q.subarea,200),foco:str(q.foco,200),
    enunciado:str(q.enunciado),gabarito:str(q.gabarito,2).toUpperCase(),anulada:!!q.anulada,comentario:str(q.comentario),
    alternativas:(Array.isArray(q.alternativas)?q.alternativas:[]).slice(0,8).map(a=>({letra:str(a&&a.letra,2).toUpperCase(),texto:str(a&&a.texto,6000),comentario:str(a&&a.comentario,6000)})),
    imagens:(Array.isArray(q.imagens)?q.imagens:[]).filter(s=>typeof s==='string'&&s.length<6e6)};
}
function mfNote(q,kind,folderId,catId){
  const alt=a=>'<div><b>'+esc(a.letra)+')</b> '+esc(a.texto)+'</div>',ok=q.alternativas.find(a=>a.letra===q.gabarito);
  const base={id:uid(),folderId:folderId,catId:catId,cd:null,created:Date.now(),updated:Date.now(),mfId:q.id};
  const enun=mfTxt(q.enunciado)+mfImgs(q.imagens);
  if(kind==='caso'){
    return normNote(Object.assign(base,{type:'caso',title:q.foco||('Caso · '+q.instituicao+' '+q.ano),
      html:enun+'<h3>Alternativas</h3>'+q.alternativas.map(alt).join('')+'<h3>Gabarito: '+esc(q.gabarito||'—')+(q.anulada?' (anulada)':'')+'</h3>'+mfTxt(q.comentario)+
        '<div style="margin-top:12px"><small>'+esc([q.instituicao+' '+q.ano,'Questão '+q.numero].join(' · '))+'</small></div>',
      hyp:ok?[ok.texto]:[],est:[[q.area,q.subarea,q.foco].filter(Boolean).join(' › ')].filter(Boolean)}));
  }
  return normNote(Object.assign(base,{type:'questao',title:'Q'+q.numero+' · '+q.instituicao+' '+q.ano,
    html:enun+q.alternativas.map(alt).join(''),
    wrong:q.alternativas.filter(a=>a.letra!==q.gabarito&&a.comentario).map(a=>'<div><b>'+esc(a.letra)+')</b> '+esc(a.texto)+'</div>'+mfTxt(a.comentario)).join(''),
    right:ok?'<div><b>'+esc(ok.letra)+')</b> '+esc(ok.texto)+'</div>'+mfTxt(ok.comentario):'<div>Gabarito: '+esc(q.gabarito||'—')+'</div>',
    just:mfTxt(q.comentario)+(q.anulada?'<div><b>Questão anulada.</b></div>':''),
    prova:q.instituicao,ano:/^\d{4}$/.test(q.ano)?q.ano:'',nivel:'R1',qgroup:q.foco||q.subarea||'',qs:{n:0,ok:0,last:0,lastOk:false}}));
}
function openMfImport(q){
  const dup=S.notes.find(n=>n.mfId===q.id),last=S.prefs.mfLast||{};
  openModal('<form id="fMf" class="form"><div class="fh"><h2>Enviar para Notas</h2><button type="button" class="icon-btn" data-a="close" aria-label="Fechar">'+ic('x')+'</button></div>'+
    '<div class="mfprev"><b>Questão '+esc(q.numero)+' · '+esc(q.instituicao)+' '+esc(q.ano)+'</b><span class="muted small">'+esc([q.area,q.subarea,q.foco].filter(Boolean).join(' › '))+'</span><p>'+esc(clip(q.enunciado,240))+'</p></div>'+
    (dup?'<div class="warn">Esta questão já está nas Notas ("'+esc(dup.title)+'"). Salvar de novo cria outra cópia.</div>':'')+
    '<div class="f"><span>Salvar como</span><div class="seg" id="mfKind">'+[['questao','Questão'],['caso','Caso clínico']].map(k=>'<button type="button" class="'+((last.kind||'questao')===k[0]?'on':'')+'" data-a="mf-kind" data-v="'+k[0]+'">'+k[1]+'</button>').join('')+'</div></div>'+
    '<div class="fgrid"><label class="f">Pasta<select name="folder">'+folderOptions(last.folder||'')+'</select></label><div class="f"><span>Categoria</span>'+catPickHTML('mfcat',last.cat||'')+'</div></div>'+
    '<div class="ff"><span class="sp"></span><button type="button" class="btn" data-a="close">Cancelar</button><button type="submit" class="btn" name="go" value="0">Salvar</button><button type="submit" class="btn primary" name="go" value="1">Salvar e abrir</button></div></form>');
  const f=$('#fMf');mountCatPicks(f);
  f.addEventListener('submit',ev=>{
    ev.preventDefault();const kind=($('#mfKind button.on',f)||{}).dataset.v||'questao',folder=f.elements.folder.value,cat=$('[data-catpick="mfcat"]',f).dataset.value||'';
    const n=mfNote(q,kind,folder,cat);S.notes.push(n);S.prefs.mfLast={kind:kind,folder:folder,cat:cat};save();closeModal();
    const go=ev.submitter&&ev.submitter.value==='1';
    if(go){flushNote();UI.tab='notas';UI.nview={type:'note',id:n.id,edit:false};renderTabs();renderMain();ROUTE.write();window.scrollTo(0,0);}
    else{toast((kind==='caso'?'Caso clínico':'Questão')+' salva em Notas.');if(UI.tab==='questoes')renderMain();}
  });
}
window.addEventListener('message',e=>{
  if(e.origin!==MF_ORIGIN)return;const d=e.data;
  if(!d||d.tipo!=='medfisher:questao'||!d.questao||typeof d.questao!=='object')return;
  openMfImport(mfClean(d.questao));
});
Object.assign(ACT,{
  'mf-kind'(el){$$('#mfKind button').forEach(b=>b.classList.toggle('on',b===el));},
  'mf-reload'(){QF.reload();},
  'mf-user'(){askText('Usuário do MedFisher (01 a 10)',mfUser(),v=>{v=String(v).trim().padStart(2,'0');if(!/^(0[1-9]|10)$/.test(v)){toast('Use um código entre 01 e 10.');return;}S.prefs.mfUser=v;save();renderMain();});}
});

$$('[data-ic]').forEach(e=>{e.innerHTML=ic(e.dataset.ic,Number(e.dataset.s)||18);});
