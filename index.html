<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns=%22http://www.w3.org/2000/svg%22%20viewBox=%220%200%2064%2064%22%3E%3Crect%20width=%2264%22%20height=%2264%22%20rx=%2214%22%20fill=%22%2316181D%22/%3E%3Cg%20fill=%22none%22%20stroke-width=%226%22%20stroke-linecap=%22round%22%20stroke-linejoin=%22round%22%3E%3Cpath%20d=%22M13%2016V48H28%22%20stroke=%22%23FFFFFF%22/%3E%3Cpath%20d=%22M52.5%2024.5A12.5%2012.5%200%201%200%2055%2033H44%22%20stroke=%22%237C98FF%22/%3E%3C/g%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Rotina">

<link rel="manifest" href="manifest.webmanifest">
<title>Rotina de Estudos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Crimson+Pro:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<script>try{if(localStorage.getItem("rotina_theme")==="dark")document.documentElement.dataset.theme="dark";}catch(e){}</script>
<style>
/* ==========================================================================
   1. TOKENS E BASE (visual claro e confortável, fonte um pouco maior)
   ========================================================================== */
:root{
  --bg:#FFFFFF; --soft:#F6F7F9; --card:#FFFFFF; --line:#E7E9EE; --line2:#EFF1F5; --line3:#D6DAE2;
  --tx:#16181D; --mut:#5F6776; --mut2:#8A92A1;
  --ink:#16181D; --onink:#fff; --topbg:rgba(255,255,255,.94); --acc:#2547D0; --accs:#EEF1FC;
  --ok:#8FD0B0; --okd:#2F8F63; --r:14px;
  --sh:0 1px 2px rgba(22,24,29,.05),0 6px 18px rgba(22,24,29,.06);
  --sh2:0 4px 16px rgba(22,24,29,.14);
  --font:'Poppins',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  --serif:'Crimson Pro','Iowan Old Style',Georgia,'Times New Roman',serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--font);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
body.noscroll{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
.ic{flex:none;vertical-align:middle}
.muted{color:var(--mut)} .small{font-size:13px} .sp{flex:1}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
h1,h2,h3,h4{margin:0}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pulse{50%{opacity:.35}}
@keyframes pop{0%{transform:scale(.7)}60%{transform:scale(1.15)}100%{transform:scale(1)}}

/* ==========================================================================
   2. CABEÇALHO E NAVEGAÇÃO
   ========================================================================== */
.top{position:sticky;top:0;z-index:20;background:var(--topbg);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:10px 26px}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;white-space:nowrap;font-size:16px}
.brand i{width:32px;height:32px;border-radius:9px;background:var(--ink);color:var(--onink);display:grid;place-items:center}
#tabs{display:flex;gap:2px;margin:0 auto 0 10px}
.tab{position:relative;display:flex;align-items:center;gap:8px;padding:9px 13px;border:0;background:none;border-radius:10px;color:var(--mut);font-weight:500;font-size:14px;transition:color .18s,background .18s}
.tab:hover{color:var(--tx);background:var(--soft)}
.tab.on{color:var(--tx)}
.tab.on:after{content:'';position:absolute;left:12px;right:12px;bottom:-11px;height:2px;border-radius:2px;background:var(--acc);animation:fade .25s}
.actions{display:flex;align-items:center;gap:6px}
main{max-width:1240px;margin:0 auto;padding:22px 26px 80px}

/* ==========================================================================
   3. BOTÕES, CHIPS, TAGS E CONTROLES (com animações ao passar o mouse)
   ========================================================================== */
.btn,.chip,.icon-btn,.pill,.act-chip,.seg button,.dbtn{transition:background .18s,border-color .18s,color .18s,transform .15s,box-shadow .18s}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line3);background:var(--card);padding:9px 16px;border-radius:10px;font-weight:500;font-size:14px;white-space:nowrap}
.btn:hover{background:var(--soft);transform:translateY(-1px);box-shadow:var(--sh)}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.primary:hover{background:#1C39A8;box-shadow:0 4px 14px rgba(37,71,208,.3)}
.btn.sm{padding:6px 12px;font-size:13px;border-radius:9px}
.btn.ghost{border-color:transparent;background:transparent;color:var(--mut)}
.btn.ghost:hover{color:var(--tx);background:var(--soft);box-shadow:none}
.btn.danger{color:#C62F2F;border-color:#EFC8C8}
.btn.danger:hover{background:#FDF1F1}
.btn:disabled{opacity:.5;cursor:default;transform:none;box-shadow:none}
.icon-btn{width:36px;height:36px;display:inline-grid;place-items:center;border:1px solid transparent;background:transparent;border-radius:10px;color:var(--mut);position:relative;flex:none;padding:0}
.icon-btn:hover{background:var(--soft);color:var(--tx);transform:scale(1.08)}
.icon-btn:active{transform:scale(.92)}
.icon-btn.sm{width:28px;height:28px;border-radius:8px}
.icon-btn.on{background:var(--accs);color:var(--acc)}
.icon-btn .badge{position:absolute;top:1px;right:1px;min-width:17px;height:17px;border-radius:9px;background:var(--acc);color:#fff;font-size:10.5px;display:grid;place-items:center;padding:0 4px}
.seg{display:inline-flex;background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:7px 13px;border-radius:8px;color:var(--mut);font-size:14px;font-weight:500;display:inline-flex;align-items:center;gap:6px}
.seg button:hover{color:var(--tx)}
.seg button.on{background:var(--card);color:var(--tx);box-shadow:0 0 0 1px var(--line),0 1px 2px rgba(22,24,29,.06)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 13px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:13px;color:var(--mut)}
.chip:hover{border-color:var(--line3);transform:translateY(-1px)}
.chip.on{background:var(--ink);color:var(--onink);border-color:var(--ink);animation:pop .22s}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;flex:none;background:var(--mut2)}
.tag{display:inline-flex;align-items:center;gap:5px;padding:3px 11px;border-radius:999px;font-size:12px;font-weight:500;background:var(--c,#EEE);color:var(--ct,#444);max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chk{width:30px;height:30px;border-radius:50%;border:2px solid #CDD3DD;background:var(--card);display:grid;place-items:center;color:transparent;flex:none;padding:0;transition:background .18s,border-color .18s,transform .15s}
.chk:hover{border-color:var(--okd);color:#BFE5D1;transform:scale(1.1)}
.chk:active{transform:scale(.9)}
.chk.on{background:var(--ok);border-color:var(--ok);color:#fff;animation:pop .28s}
.chk.sm{width:21px;height:21px;border-width:1.5px}
.chk.big{width:36px;height:36px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.empty{padding:38px 18px;text-align:center;color:var(--mut);background:var(--card);border:1px dashed var(--line3);border-radius:var(--r)}
.empty .btn{margin-top:10px}
.sechead{font-size:13px;font-weight:600;color:var(--mut);margin:22px 0 9px;display:flex;align-items:center;gap:8px}
.sechead.late{color:#C62F2F}
.count{background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:0 9px;font-size:12px;color:var(--mut)}

/* ==========================================================================
   4. PAINEL DE FILTROS (ESCONDIDO POR PADRÃO) E RADAR
   ========================================================================== */
.fpanel{border-bottom:1px solid var(--line);background:var(--soft);animation:rise .2s}
.fwrap{max-width:1240px;margin:0 auto;padding:14px 26px;display:flex;flex-direction:column;gap:10px}
.frow{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.fl{font-size:13px;font-weight:500;color:var(--mut);min-width:78px}
.sbox{display:flex;align-items:center;gap:8px;border:1px solid var(--line3);border-radius:10px;padding:0 12px;background:var(--card);flex:1;max-width:440px;color:var(--mut)}
.sbox input{border:0;outline:0;padding:9px 0;width:100%;background:transparent}
.factive{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--mut)}
.radar{margin-bottom:20px}
.radar-h{display:inline-flex;align-items:center;gap:8px;color:var(--ink);padding:4px 0;cursor:pointer}
.radar-h b{font-weight:600}
.pillc{background:var(--acc);color:#fff;border-radius:999px;font-size:12px;padding:0 9px}
.radar-row{display:flex;gap:12px;overflow-x:auto;padding:8px 2px 12px;scroll-snap-type:x proximity}
.alert{flex:0 0 288px;scroll-snap-align:start;background:var(--card);border:1px solid var(--line);border-top:3px solid var(--c);border-radius:var(--r);padding:14px 15px;box-shadow:var(--sh);display:flex;flex-direction:column;gap:8px}
.ah{display:flex;align-items:center;gap:9px}
.ah b{font-weight:600;font-size:14px;line-height:1.3;flex:1}
.ai{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex:none}
.at{font-size:13px;color:var(--mut)}
.alert details summary{font-size:13px;color:var(--acc);cursor:pointer;list-style:none;font-weight:500}
.alert details summary::-webkit-details-marker{display:none}
.alert details p{margin:6px 0 0;font-size:13px;color:var(--tx);background:var(--soft);border-radius:10px;padding:10px 12px}
.alert .btn{align-self:flex-start;margin-top:auto}

/* ==========================================================================
   5. SEMANA: NAVEGAÇÃO, FOCO, GRADE DE 24 HORAS, LISTA E DIA
   ========================================================================== */
.wnav{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.wlabel{display:flex;flex-direction:column;line-height:1.25;margin:0 8px}
.wlabel b{font-weight:600;font-size:16px}
.focus{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:4px 16px;margin-bottom:16px}
.focus summary{display:flex;align-items:center;gap:8px;cursor:pointer;list-style:none;padding:9px 0;font-weight:500;color:var(--ink);font-size:14px}
.focus summary::-webkit-details-marker{display:none}
.focus summary .ic:last-child{margin-left:auto}
.gridscroll{max-height:calc(100vh - 150px);min-height:420px;overflow:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--card);box-shadow:var(--sh)}
.wgrid{display:grid;grid-template-columns:48px repeat(7,minmax(0,1fr));background:var(--card);min-width:940px}
.gh{padding:9px 6px;text-align:center;border-bottom:1px solid var(--line);border-left:1px solid var(--line2);font-size:12px;color:var(--mut);min-height:60px;cursor:pointer;min-width:0;position:sticky;top:0;background:var(--card);z-index:7;transition:background .18s}
.gh:hover{background:var(--soft)}
.gh:first-child{border-left:0;cursor:default}
.gh b{display:block;font-weight:500}
.gh span.dn{display:inline-grid;place-items:center;min-width:28px;height:28px;border-radius:50%;font-size:15px;font-weight:600;color:var(--ink)}
.gh.today span.dn{background:var(--acc);color:#fff}
.dp{display:block;margin-top:3px;font-size:11px;padding:1px 7px;border-radius:6px;background:#FFF1DC;color:#8F6422;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
.dp.dt{background:#E4E9FF;color:#2547D0}
.dp.done{opacity:.5;text-decoration:line-through}
.gtimes{position:relative;height:var(--bh)}
.gtimes span{position:absolute;right:7px;transform:translateY(-50%);font-size:11px;color:var(--mut2)}
.gcol{position:relative;height:var(--bh);border-left:1px solid var(--line2);cursor:crosshair;user-select:none;-webkit-user-select:none}
.gcol .hl{position:absolute;left:0;right:0;border-top:1px dashed var(--line2)}
.ev{position:absolute;border-radius:9px;padding:4px 8px;font-size:12.5px;line-height:1.3;overflow:hidden;background:var(--c);color:var(--ct);border-left:4px solid var(--ct);cursor:pointer;z-index:1}
.ev:hover{transform:scale(1.025);box-shadow:var(--sh2);z-index:6}
.ev i{display:block;font-style:normal;font-weight:500;opacity:.85;font-size:11.5px}
.ev b{display:flex;align-items:center;gap:4px;font-weight:600}
.ev .th{display:block;font-weight:500}
.ev em{display:block;font-style:normal;opacity:.8;font-size:11.5px}
.bds{display:flex;gap:7px;margin-top:2px}
.bd{display:inline-flex;align-items:center;gap:2px;font-size:11px;opacity:.85}
.gc{display:block;font-size:11px;color:var(--mut2);font-weight:400;margin-top:1px}
.ev.qk{display:flex;align-items:center;justify-content:center;padding:2px}
.ev.qk svg{opacity:.85}
.ev.done{opacity:.45}
.ev.done b{text-decoration:line-through}
.now{position:absolute;left:0;right:0;border-top:2px solid #E5484D;z-index:3;pointer-events:none}
.dragghost{position:absolute;left:2px;right:2px;background:rgba(37,71,208,.16);border:2px dashed var(--acc);border-radius:8px;z-index:4;pointer-events:none;font-size:12px;padding:2px 6px;color:var(--ink);font-weight:500;overflow:hidden}
.daysec{margin-bottom:16px}
.daysec h4{font-size:13px;font-weight:600;color:var(--mut);margin:0 0 7px;display:flex;gap:8px;align-items:center}
.daysec h4.today{color:var(--ink)}
.daysec h4.today:after{content:"hoje";background:var(--acc);color:#fff;border-radius:999px;font-size:11px;padding:0 9px;font-weight:500}
.lrow{display:grid;grid-template-columns:auto 112px 1fr auto;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--c);border-radius:12px;padding:10px 13px;margin-bottom:7px;cursor:pointer}
.lrow:hover{box-shadow:var(--sh2);transform:translateY(-1px)}
.lrow.done{opacity:.5}
.lrow.done .lm b{text-decoration:line-through}
.lt{font-size:13px;color:var(--mut);font-weight:500}
.lm b{font-weight:500}
.lm .small{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.lrow.due{border-left-color:#F2C48D}
.lrow.dtm{border-left-color:var(--acc)}
.dstrip{display:flex;gap:6px;margin-bottom:14px;overflow-x:auto;padding-bottom:2px}
.dbtn{flex:1 0 58px;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;font-size:12px;color:var(--mut);line-height:1.3}
.dbtn:hover{border-color:var(--acc)}
.dbtn b{font-size:17px;font-weight:600;color:var(--ink)}
.dbtn.on{background:var(--acc);border-color:var(--acc);color:#DCE3FF}
.dbtn.on b{color:#fff}
.dbtn i{width:5px;height:5px;border-radius:50%;background:var(--acc);margin-top:2px}
.dbtn.on i{background:var(--card)}
.dbtn .nodot{visibility:hidden}

/* Cartão detalhado da atividade (timeline do dia) */
.tcard{display:grid;grid-template-columns:70px 1fr auto;gap:14px;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--c);border-radius:var(--r);box-shadow:var(--sh);padding:18px;margin-bottom:12px}
.tcard:hover{box-shadow:var(--sh2)}
.tcard.done{opacity:.55}
.tcard.done h3{text-decoration:line-through}
.tt{display:flex;flex-direction:column;line-height:1.3}
.tt b{font-size:17px;font-weight:600;color:var(--ink)}
.tt span{font-size:13px;color:var(--mut)}
.tb{min-width:0}
.tr{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:5px}
.kd{font-size:12px;color:var(--mut)}
.rp{color:var(--mut2);display:inline-flex}
.tcard h3{font-size:17px;font-weight:600;margin-bottom:4px}
.tm{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--mut);margin-bottom:6px}
.tm span,.tm a,.mi{display:inline-flex;align-items:center;gap:5px}
.lnk{color:var(--acc);text-decoration:none;font-weight:500;max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:inline-flex;align-items:center;gap:5px}
.lnk:hover{text-decoration:underline}
.tx{margin-top:10px;background:var(--soft);border-radius:10px;padding:10px 13px}
.rel{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.ts{display:flex;flex-direction:column;align-items:center;gap:4px}

/* ==========================================================================
   6. TAREFAS, DOCUMENTOS, DATAS
   ========================================================================== */
.trow{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 13px;margin-bottom:8px}
.trow:hover{box-shadow:var(--sh);transform:translateY(-1px)}
.trow.done{opacity:.55}
.trow.done .ttl{text-decoration:line-through}
.trb{flex:1;min-width:0}
.tt1{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ttl{font-weight:500;cursor:pointer;font-size:15px}
.ttl:hover{color:var(--acc)}
.tmeta{display:flex;flex-wrap:wrap;gap:5px 13px;margin-top:5px;font-size:13px;color:var(--mut);align-items:center}
.tnote{font-size:13px;color:var(--mut);margin-top:3px;white-space:pre-wrap}
.tact{display:flex;gap:0;flex:none}
.due{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:1px 10px;border-radius:999px;background:#F0F2F6;color:var(--mut);font-weight:500}
.due.soon{background:#FFF1DC;color:#8F6422}
.due.today{background:#FFE4C7;color:#8A4A10}
.due.late{background:#FBE0E0;color:#A64448}
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:12px}
/* tipo de arquivo (PDF, Word/Docs, Excel/Planilhas, PowerPoint/Slides) */
.fxi{display:inline-grid;place-items:center;width:var(--s,30px);height:var(--s,30px);flex:none;color:var(--fx)}
.fxi svg{width:100%;height:100%;display:block}
.fxi .pg{fill:var(--fxs)}
.fx-pdf{--fx:#D93C32;--fxs:#FDECEA}
.fx-doc{--fx:#2F6FDE;--fxs:#E8F0FD}
.fx-xls{--fx:#1E8F58;--fxs:#E4F5EC}
.fx-ppt{--fx:#E3732A;--fxs:#FDEFE2}
.fx-oth{--fx:#8A92A1;--fxs:#F3F4F7}
.fxtag{display:inline-flex;align-items:center;font-size:11.5px;font-weight:600;letter-spacing:.2px;line-height:1;padding:4px 9px;border-radius:999px;color:var(--fx);background:var(--fxs)}
.dtt{display:flex;align-items:center;gap:10px}.dtt span:last-child{min-width:0;overflow-wrap:anywhere}
.dxrow{display:flex;align-items:center;gap:10px}.dxrow select{flex:1;min-width:0}
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:2px;margin:0 0 12px;font-size:14px}
.crumb{border:0;background:none;color:var(--mut);padding:5px 7px;border-radius:8px;cursor:pointer;font:inherit}
.crumb:hover{background:var(--soft);color:var(--tx)}.crumb.on{color:var(--tx);font-weight:600}
.crumbs .sep{color:var(--mut2)}.crumbs .btn{margin-left:auto}
/* categorias de datas */
.dcatpick{display:flex;flex-direction:column;gap:6px}
.dcatpick select{width:100%}
.dcnew{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.dcnew input{flex:1;min-width:160px;border:1px dashed var(--line3);border-radius:9px;padding:7px 11px;background:var(--card)}
.dcmadd{display:flex;gap:6px;margin:4px 0 12px}
.dcmadd input{flex:1;min-width:0;border:1px solid var(--line3);border-radius:9px;padding:8px 12px;background:var(--card)}
.dclist{display:flex;flex-direction:column;gap:2px;max-height:50vh;overflow:auto;margin-bottom:12px}
.dcrow{display:flex;align-items:center;gap:6px;padding:4px 6px 4px calc(6px + var(--d,0)*22px);border-radius:10px}
.dcrow:hover{background:var(--soft)}
.dcn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.dcsp{width:28px;flex:none}
.dctag{max-width:100%}
/* fluxograma */
.fxwrap{margin-top:6px}
.fxbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:12px;background:var(--soft);margin-bottom:8px}

.vt{font-size:22px;font-weight:600;letter-spacing:-.015em;line-height:1.3;margin:12px 0 0}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:16px 24px;margin:20px 0 6px}
.fact{display:flex;gap:10px;align-items:flex-start;min-width:0}
.fact .ic{color:var(--mut2);margin-top:4px}
.fact dt{font-size:13px;color:var(--mut2)}
.fact dd{margin:0;font-weight:500;overflow-wrap:anywhere}
.mfoot{display:flex;gap:8px;flex-wrap:wrap;margin-top:24px;padding-top:18px;border-top:1px solid var(--line)}
.fh{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.fh h2{font-size:20px;font-weight:600}
.form{display:flex;flex-direction:column;gap:12px}
.f{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--mut);font-weight:500;min-width:0}
.f small{font-weight:400;color:var(--mut2)}
.f input,.f select,.f textarea,.catpick select{border:1px solid var(--line3);border-radius:9px;padding:9px 12px;background:var(--card);font-size:14.5px;color:var(--tx);width:100%;min-width:0;font-weight:400;transition:border-color .15s,box-shadow .15s}
.f input:focus,.f select:focus,.f textarea:focus,.catpick select:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(37,71,208,.13);outline:0}
.f textarea{resize:vertical;min-height:54px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.catpick{display:flex;gap:6px;flex-wrap:wrap}
.catpick select{flex:1 1 150px;width:auto}
.slot{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px;border:1px dashed var(--line3);border-radius:11px;margin-bottom:6px}
.slot select,.slot input{border:1px solid var(--line3);border-radius:8px;padding:7px 9px;background:var(--card);font-size:13.5px;flex:1 1 108px;min-width:0;width:auto}
.slot .to{color:var(--mut);font-size:13px}
.slot .s-unt{display:flex;align-items:center;gap:6px;font-size:13px;flex:1 1 170px;color:var(--mut)}
.slot[data-mode=date] .only-w{display:none}
.slot[data-mode=weekly] .only-d{display:none}
.mrow{display:grid;grid-template-columns:1.5fr .8fr 1fr 1fr 1fr 1fr auto;gap:6px;align-items:center;margin-bottom:6px;padding:8px;border:1px dashed var(--line3);border-radius:11px}
.mrow input,.mrow select{border:1px solid var(--line3);border-radius:8px;padding:7px 9px;background:var(--card);font-size:13.5px;min-width:0;width:100%}
.picker{border:1px solid var(--line3);border-radius:9px;background:var(--card)}
.picker summary{display:flex;align-items:center;gap:8px;padding:9px 12px;cursor:pointer;list-style:none;font-size:14.5px;font-weight:400;color:var(--tx)}
.picker summary::-webkit-details-marker{display:none}
.picker summary .pc{margin-left:auto;font-size:12px;color:var(--mut)}
.plist{max-height:200px;overflow:auto;padding:4px 11px 8px;border-top:1px solid var(--line2)}
.pitem{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:14px;color:var(--tx);font-weight:400}
.pitem input{width:auto;flex:none}
.pitem small{margin-left:auto;color:var(--mut2)}
.chip.cb input{display:none}
.chip.cb{padding:0;border:0;background:none}
.chip.cb span{display:inline-block;padding:5px 13px;border-radius:999px;border:1px solid var(--line);font-size:13px;color:var(--mut);cursor:pointer;transition:all .18s}
.chip.cb span:hover{border-color:var(--line3)}
.chip.cb input:checked+span{background:var(--ink);border-color:var(--ink);color:var(--onink)}
.ff{display:flex;gap:8px;align-items:center;justify-content:flex-end;margin-top:8px;flex-wrap:wrap}
.quick{display:flex;gap:6px;margin-top:4px;flex-wrap:wrap}
.more{border:1px solid var(--line);border-radius:11px;padding:0 12px;background:var(--soft)}
.more>summary{padding:9px 0;cursor:pointer;font-size:14px;font-weight:500;color:var(--ink);list-style:none}
.more>summary::-webkit-details-marker{display:none}
.more>summary small{color:var(--mut);font-weight:400}
.more[open]>summary{border-bottom:1px solid var(--line);margin-bottom:10px}
.more>.fgrid,.more>.f{margin-bottom:10px}
#toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--ink);color:var(--onink);padding:10px 18px;border-radius:999px;font-size:14px;z-index:80;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
.sync-dot{position:fixed;right:10px;bottom:10px;z-index:60;width:28px;height:28px;border:0;border-radius:50%;background:transparent;display:grid;place-items:center;opacity:.55;transition:opacity .2s,transform .2s;padding:0}
.sync-dot:hover{opacity:1;transform:scale(1.2)}
.sync-dot i{width:10px;height:10px;border-radius:50%;background:#2FB872}
.sync-dot.is-syncing i{background:#E6A23C;animation:pulse 1s ease-in-out infinite}
.sync-dot.is-error i{background:#D64545}
.sync-dot.is-local i{background:var(--mut2)}
.sync-dot.is-hold i{background:#E6A23C}
.sync-dot.is-error,.sync-dot.is-hold{opacity:1}
#syncInfo{margin-bottom:14px}
.sirow{display:flex;justify-content:space-between;gap:14px;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
.sirow span{color:var(--mut)}.sirow b{font-weight:500;text-align:right;overflow-wrap:anywhere}
.sync-error{color:#B03030}.sync-ok{color:#1F7A4D}
.cfopt{display:grid;gap:4px;border:1px solid var(--line3);border-radius:12px;padding:12px 14px;margin:10px 0}
.cfopt span{color:var(--mut);font-size:13.5px}.cfopt .btn{justify-self:start;margin-top:6px}

/* Detalhes da atividade, listas numeradas e plano de uso */
.dsec{border-top:1px solid var(--line);padding:13px 0}
.dsec:first-of-type{margin-top:6px}
.dsec h5{margin:0 0 6px;font-size:13px;font-weight:600;color:var(--mut)}
.dsec p{margin:0;font-size:15px;color:var(--tx)}
.d2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.lk{margin-bottom:4px}
.lk a,.blue{color:var(--acc);text-decoration:none;word-break:break-all;font-size:15px;background:none;border:0;padding:0;text-align:left}
.lk a:hover,.blue:hover{text-decoration:underline}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pillx{display:inline-flex;align-items:center;gap:7px;background:var(--soft);border:0;border-radius:999px;padding:7px 14px;font-size:14px;color:#4A5160;max-width:100%}
.pillx:hover{background:var(--accs);color:var(--acc)}
.vlist summary{list-style:none;cursor:pointer;color:var(--acc);font-size:15px;font-weight:500;margin-top:8px;display:flex;align-items:center;gap:9px}
.vlist summary::-webkit-details-marker{display:none}
.vlist summary::before{content:"";border-style:solid;border-width:5px 0 5px 8px;border-color:transparent transparent transparent var(--acc);transition:transform .15s}
.vlist[open] summary::before{transform:rotate(90deg)}
.nlist{list-style:none;counter-reset:n;margin:10px 0 0;padding:0}
.nlist>li{counter-increment:n;display:flex;gap:12px;align-items:baseline;padding:4px 0;font-size:15px}
.nlist>li::before{content:counter(n);color:var(--mut2);font-weight:600;font-size:14px;min-width:20px;flex:none}
.nc{min-width:0}
.inner{list-style:none;margin:4px 0 2px;padding:0 0 0 2px;border-left:2px solid var(--line2)}
.inner li{font-size:14px;color:var(--mut);padding:1px 0 1px 10px}
.xt{display:inline-block;background:var(--soft);border-radius:6px;padding:0 8px;font-size:12px;font-weight:600;color:var(--mut);margin-right:5px}
.xrow{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--tx)}
.xrow .icon-btn{margin-left:auto}
.xadd{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.xadd input{border:1px dashed var(--line3);border-radius:10px;padding:6px 11px;font-size:14px;background:var(--card);min-width:0}
.xadd .x-type{width:116px}
.xadd .x-name{flex:1 1 150px}
.pack-more{border:1px solid var(--line);border-radius:999px;padding:4px 11px;font-size:13px;background:var(--card);color:var(--mut);max-width:100%}
.opts{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.opts select{border:1px solid var(--line3);border-radius:10px;padding:8px 11px;background:var(--card);font-size:14px}
.sub{display:block;font-size:13px;color:var(--mut);font-weight:400}
.pobj{margin-top:12px}
.pobj:first-child{margin-top:0}
.pobj h6{margin:0 0 2px;font-size:14px;font-weight:600;display:flex;gap:6px;align-items:center;color:var(--ink)}
.pobj .nlist{margin-top:4px}
.tprev{font-size:13px;color:var(--mut);background:var(--soft);border-radius:10px;padding:8px 12px}
.tprev b{color:var(--ink);font-weight:600}
.pcard{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;background:var(--soft);display:flex;flex-direction:column;gap:8px}
.pcard .pt{display:flex;align-items:center;gap:7px;font-weight:600;font-size:14px;color:var(--ink)}
.padd{display:inline-flex;align-items:center;gap:2px}
.padd input{border:1px dashed var(--line3);border-radius:999px;padding:4px 11px;font-size:13px;width:160px;background:var(--card)}
.pnote{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mut)}
.pnote span{flex:0 0 100px;font-weight:600;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pnote input{flex:1;border:1px solid var(--line3);border-radius:9px;padding:6px 11px;background:var(--card);font-size:14px;min-width:0}
.colrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.colrow input[type=color]{width:44px;height:40px;padding:2px;border:1px solid var(--line3);border-radius:10px;background:var(--card)}
.colrow input[type=text]{width:124px;font-family:ui-monospace,Menlo,Consolas,monospace;text-transform:uppercase}
.icons{display:flex;gap:6px;flex-wrap:wrap}
.ibtn{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;color:var(--mut)}
.ibtn.on{background:var(--ink);color:var(--onink);border-color:var(--ink)}
.hx{font-size:12px;color:var(--mut2);font-family:ui-monospace,Menlo,Consolas,monospace}
.tpc{padding:0 9px;font-size:11px}
.ci{display:inline-flex;margin-right:6px;color:var(--mut);vertical-align:middle}
.irow{padding:8px 0;border-bottom:1px solid var(--line2)}
.irow .in{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.lm .clip{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bds.row{margin:0}
.mv{display:flex;gap:10px;align-items:baseline;font-size:15px;padding:2px 0;flex-wrap:wrap}

/* Pendências em destaque */
.attn{margin-bottom:16px;border:1px solid #F2C48D;background:#FFF9EF;border-radius:var(--r);padding:11px 13px}
.attn-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap;color:#8A4A10;margin-bottom:8px}
.attn-row{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px}
.acard{flex:0 0 320px;background:var(--card);border:1px solid #F2C48D;border-left:4px solid #E58A3A;border-radius:12px;padding:11px 13px;display:flex;flex-direction:column;gap:5px;box-shadow:var(--sh)}
.at1{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.aact{display:flex;gap:5px;flex-wrap:wrap;margin-top:4px}
.trow.hot{border-color:#F2C48D;background:#FFFBF4;box-shadow:0 0 0 2px #FBE3C0}
.orow{display:flex;align-items:flex-start;gap:6px}
.orow>span,.orow>div{flex:1;min-width:0}
.rm,.xp{width:24px;height:24px;border:0;background:none;color:var(--mut2);border-radius:6px;display:inline-grid;place-items:center;padding:0;flex:none}
.rm:hover{color:#C62F2F;background:#FBE0E0}
.xp:hover{background:var(--soft);color:var(--ink)}
.h5f{display:flex;align-items:center;gap:4px}
.pobj h6 .rm{margin-left:auto}
.inner li .orow{align-items:center}

/* Saúde e finanças */
.hcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-bottom:12px}
.hcards.big{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.hcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:13px 15px;display:flex;flex-direction:column;gap:4px;min-width:0}
.hcard:hover{box-shadow:var(--sh2)}
.hcard .hl{font-size:12px;font-weight:600;color:var(--mut)}
.hcard>b{font-size:21px;font-weight:600;color:var(--ink);display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.hcard>b small{font-size:13px;font-weight:400;color:var(--mut)}
.bar{height:7px;background:var(--line2);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok)}
.spark{width:100%;height:36px}
.dbars{display:flex;gap:5px;align-items:flex-end;height:44px;margin-top:4px}
.dbars span{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:2px}
.dbars span i{display:block;width:100%;background:#9FC5EC;border-radius:4px 4px 0 0;min-height:2px}
.dbars em{font-style:normal;font-size:10px;color:var(--mut2)}
.hrow{display:flex;gap:12px;padding:11px 15px;border-bottom:1px solid var(--line2);align-items:flex-start}
.hrow:last-child{border-bottom:0}
.hd{display:flex;flex-direction:column;min-width:58px}
.hbody{flex:1;min-width:0}
.hvs{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:2px;font-size:14px}
.hv i{font-style:normal;font-size:12px;color:var(--mut);margin-right:4px}
.stk{display:flex;height:8px;border-radius:5px;overflow:hidden;margin:6px 0 2px;background:var(--line2)}
.stk i{display:block;height:100%}
.hb{margin-bottom:10px}
.hbl{display:flex;justify-content:space-between;gap:8px;font-size:14px;margin-bottom:3px}
.hbar{position:relative;height:9px;background:var(--line2);border-radius:6px;overflow:hidden}
.hbar i{position:absolute;left:0;top:0;bottom:0;background:var(--c);opacity:.4}
.hbar b{position:absolute;left:0;top:0;bottom:0;background:var(--c);display:block;font-size:0}
.frw{display:flex;align-items:center;gap:10px;padding:10px 15px;border-bottom:1px solid var(--line2)}
.frw:last-child{border-bottom:0}
.frw.done{opacity:.55}
.fd{display:flex;flex-direction:column;min-width:46px}
.fn{flex:1;min-width:0;display:flex;flex-direction:column}
.fa{font-weight:600;font-size:14px;text-align:right;display:flex;flex-direction:column}
.min,.pos{color:#2F7D57}
.mout,.neg{color:#B4545A}
.inv>summary{list-style:none;display:flex;align-items:center;gap:10px;cursor:pointer;padding:6px 0}
.inv>summary::-webkit-details-marker{display:none}
.invl{padding:2px 0 6px 34px}
.invi{display:flex;gap:10px;align-items:center;justify-content:space-between;font-size:13.5px;padding:2px 0}
.invi span:first-child{flex:1}
.hbadge{font-size:11px;padding:0 8px;border-radius:999px;background:#FFF1DC;color:#8F6422;margin-left:6px}

/* ==========================================================================
   10. NOTAS, PASTAS E LEITOR DE PDF
   ========================================================================== */
.nlay{display:grid;grid-template-columns:252px 1fr;gap:22px;align-items:start}
.ftree{position:sticky;top:76px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px}
.fo{display:flex;align-items:center;gap:8px;padding:8px 8px 8px calc(8px + var(--d,0)*16px);border-radius:10px;cursor:pointer;font-size:14.5px;color:var(--mut);transition:background .15s,color .15s}
.fo:hover{background:var(--soft);color:var(--tx)}
.fo.on{background:var(--accs);color:var(--acc);font-weight:500}
.fo .fnm{flex:1;min-width:0;display:flex;align-items:center;gap:8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ncards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.ncard{padding:15px 17px;border:1px solid var(--line);border-radius:var(--r);background:var(--card);cursor:pointer;display:flex;flex-direction:column;gap:7px;border-top:3px solid var(--c,var(--line3));box-shadow:var(--sh)}
.ncard:hover{box-shadow:var(--sh2);transform:translateY(-2px)}
.ncard h3{font-size:16px;font-weight:600;display:flex;gap:7px;align-items:center}
.ncard p{font-size:14px;color:var(--mut);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;margin:0}
.nhead{display:flex;align-items:center;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.ntitle{font:inherit;font-size:24px;font-weight:600;border:0;border-bottom:2px solid var(--line);width:100%;padding:6px 0;outline:0;background:transparent}
.ntitle:focus{border-bottom-color:var(--acc)}
.nmeta{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0 4px}
.ntb{display:flex;gap:4px;flex-wrap:wrap;padding:8px;border:1px solid var(--line);border-radius:12px;background:var(--soft);margin:14px 0 8px;position:sticky;top:66px;z-index:5}
.ntb .sepv{width:1px;background:var(--line3);margin:2px 4px}
.ned{min-height:340px;padding:6px 2px;font-size:16px;line-height:1.75;outline:0;overflow-wrap:anywhere}
.ned.editing{border:1px solid var(--line3);border-radius:12px;padding:16px 18px;background:var(--card)}
.ned.editing:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(37,71,208,.12)}
.ned:empty:before{content:attr(data-ph);color:var(--mut2)}
.ned h3{font-size:20px;margin:16px 0 4px}
.ned ul,.ned ol{padding-left:26px}
.ned mark{background:#FFF1A6;border-radius:4px;padding:0 2px}
.ned p,.ned div{margin:0}
a.ref{display:inline-flex;align-items:center;gap:5px;padding:0 11px;border-radius:999px;background:var(--accs);color:var(--acc);font-size:.9em;font-weight:500;text-decoration:none;border:1px solid transparent;cursor:pointer;line-height:1.6}
a.ref:hover{border-color:var(--acc)}
a.wl{color:#1D4ED8;text-decoration:underline;text-decoration-thickness:1.5px;text-underline-offset:3px;cursor:pointer;border-radius:3px}
a.wl:hover{background:rgba(29,78,216,.1)}
.ned.editing a.wl{cursor:text}
#wlbub{position:fixed;z-index:90;display:flex;gap:2px;background:var(--card);border:1px solid var(--line3);border-radius:10px;box-shadow:0 8px 24px rgba(20,24,40,.18);padding:4px}
#wlbub button{border:0;background:none;padding:7px 11px;border-radius:7px;font-size:13.5px;cursor:pointer}
#wlbub button:hover{background:var(--soft)}
.sppop{position:absolute;z-index:30;top:100%;margin-top:6px;width:min(360px,92vw);background:var(--card);border:1px solid var(--line3);border-radius:12px;box-shadow:0 10px 30px rgba(20,24,40,.18);padding:6px 14px 12px}
.sppop h6{margin:10px 0 6px;font-size:12.5px;font-weight:600;color:var(--mut)}
.sppop h6 small{font-weight:400;color:var(--mut2)}
.sppop .chip{cursor:pointer}.sppop .chip.on{background:var(--accs);color:var(--acc);border-color:var(--acc)}
.cite-i.on{background:var(--soft)}
.nl-row,.dnotes{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px}
.nl-row>span,.dnotes>span{min-width:max-content}
a.ref[data-k=task]{background:#FFF1DC;color:#8F6422}
a.ref[data-k=doc]{background:#E6F5EC;color:#2F7D57}
a.ref[data-k=goal]{background:#EFE7FB;color:#6A45B8}
a.ref[data-k=date]{background:#FBE0E0;color:#A64448}
a.ref[data-k=link]{background:var(--soft);color:var(--mut)}
a.ref[data-k=note],a.ref[data-k=pdf]{background:#E1F3F6;color:#1F7A8C}
.cdchip{display:inline-flex;align-items:center;gap:6px;padding:3px 12px;border-radius:999px;background:var(--accs);color:var(--acc);font-size:13px;font-weight:600}
.cdchip.today{background:#FBE0E0;color:#A64448}
.cdchip.past{background:var(--soft);color:var(--mut2);font-weight:500}
.cite-list{max-height:52vh;overflow:auto;margin-top:8px}
.cite-g{font-size:12px;font-weight:600;color:var(--mut2);margin:12px 0 4px}
.cite-i{display:flex;align-items:center;gap:9px;width:100%;text-align:left;border:0;background:none;padding:9px 8px;border-radius:9px;font-size:14.5px}
.cite-i:hover{background:var(--soft)}
.cite-i small{margin-left:auto;color:var(--mut2)}
.pdfbar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:8px;border:1px solid var(--line);border-radius:12px;background:var(--soft);position:sticky;top:66px;z-index:8}

/* objetivos: nunca mudam com o modo Serifado */
body.nserif .ned .obj,body.nserif .ned .obj *,body.nserif .objsum,body.nserif .ncobj{font-family:var(--font)}
.objsum{background:var(--accs);border:1px solid var(--line3);border-left:4px solid var(--acc);border-radius:12px;padding:12px 18px 6px;margin:14px 0 20px;font-family:var(--font)}
.objsum-h{font-weight:700;font-size:12.5px;letter-spacing:.2px;color:#6B7280;margin-bottom:8px}
.objsum-i{font-size:16px;font-weight:500;line-height:1.45;padding:0 0 8px;color:var(--tx)}
.objsum-i b{color:#6B7280;font-weight:700}
.ncobj{background:var(--accs);border-left:3px solid var(--acc);border-radius:8px;padding:6px 10px;font-size:13px;line-height:1.4;display:flex;flex-direction:column;gap:2px;font-family:var(--font)}
.ncobj-h{font-weight:700;font-size:11px;letter-spacing:.2px;color:#6B7280;text-transform:uppercase}
.ncobj b{color:#6B7280}
/* rodapés e comentários */
.ned{counter-reset:ob fn}
sup.fnm{color:var(--acc);font-weight:700;font-size:.72em;cursor:pointer;padding:0 1px;user-select:none;-webkit-user-select:none;font-family:var(--font)}
sup.fnm::after{counter-increment:fn;content:counter(fn)}
.ned.editing sup.fnm{background:var(--accs);border-radius:4px}
span.cm{background:rgba(224,169,59,.22);border-bottom:2px dotted #E0A93B;cursor:help}
.ned.editing span.cm{cursor:text}
.cmnote{font-size:.78em;line-height:1.4;color:var(--mut);background:rgba(224,169,59,.12);border-left:3px solid #E0A93B;border-radius:6px;padding:5px 10px;margin:12px 0 4px;font-family:var(--font)}
.cmrow b{color:var(--tx);font-weight:600}
.fnsec{margin-top:22px;padding-top:10px;border-top:1px solid var(--line3);font-size:.85em;color:var(--mut)}
.fnh{font-weight:700;font-size:.85em;letter-spacing:.2px;margin-bottom:4px}
.fnlist{margin:0;padding-left:1.4em}
.fnlist li{margin:2px 0}
.fnk{font-weight:600;font-size:.82em;text-transform:uppercase;letter-spacing:.3px;color:var(--acc)}
/* nota impressa / pré-visualização */
.prn{font-family:var(--font);font-size:var(--pfs,11pt);line-height:var(--plh,1.5);color:#222;background:#fff}
.prn.serif .ned,.prn.serif .ned *,.prn.serif .fnsec,.prn.serif .cmnote{font-family:var(--serif)}
.prn:not(.serif) .ned,.prn:not(.serif) .ned *{font-family:var(--font)}
.prn .obj,.prn .obj *,.prn .objsum,.prn .objsum *,.prn .tpn,.prn .ned .obj-h{font-family:var(--font)!important}
.prn h1{font-size:1.9em;font-weight:600;line-height:1.2;margin:0 0 .25em;color:#111}
.prn .prm{display:flex;flex-wrap:wrap;gap:.2em 1.4em;font-size:.78em;color:#666;margin-bottom:1.2em;padding-bottom:.7em;border-bottom:1px solid #ccc}
.prn .prm b{font-weight:600;color:#444;margin-right:.3em}
.prn .ned{font-size:1em!important;line-height:inherit!important;min-height:0;padding:0;border:0;color:#222;background:none}
.prn .obj>div:not(.obj-h){font-size:1.05em;padding-bottom:.4em}
.prn .objsum{background:#f3f4f6;border-color:#bbb;border-left-color:#555;break-inside:avoid;padding:.7em 1em .3em}
.prn .objsum-i{font-size:1em;padding-bottom:.4em;color:#222}
.prn .cmnote{color:#555;background:#faf3e0;break-inside:avoid}
.prn .cmrow b{color:#222}
.prn .fnsec{color:#444;break-inside:avoid}
.prn img{max-width:100%;height:auto}
.prn table,.prn .qsec,.prn .exam{break-inside:avoid}
.prn h2,.prn h3,.prn h4{break-after:avoid}
.prn .fxprint{margin-top:.6em}
.prdlg{display:grid;grid-template-columns:minmax(240px,300px) 1fr;gap:18px;margin-top:6px}
.prctl{display:flex;flex-direction:column;gap:12px}
.prrow{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--mut)}
.prrow b{color:var(--tx);font-weight:600;margin-left:4px}
.prrow select{border:1px solid var(--line3);border-radius:9px;padding:7px 10px;background:var(--card);color:var(--tx)}
.prchk{display:flex;flex-wrap:wrap;gap:6px}

@media (max-width:760px){.prdlg{grid-template-columns:1fr}.pvwrap{max-height:44vh}}

/* caneta, marca-texto livre e páginas extras no leitor de PDF */
.inksvg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.aink{fill:none;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke;pointer-events:none}
.aink.hl{stroke-opacity:.42;mix-blend-mode:multiply;stroke-linecap:butt}
.pdfpage.ink-mode{touch-action:none;-webkit-user-select:none;user-select:none;cursor:crosshair}
.pdfpage.ink-mode .textLayer{pointer-events:none}
.pdfpage.blank{background:#fff}
.pdfpage.blank.s-lines{background-image:repeating-linear-gradient(to bottom,transparent 0,transparent calc(var(--g) - 1px),#c7d2e8 calc(var(--g) - 1px),#c7d2e8 var(--g));background-position:0 calc(var(--g) * 2)}
.pdfpage.blank.s-grid{background-image:linear-gradient(#d5dcec 1px,transparent 1px),linear-gradient(90deg,#d5dcec 1px,transparent 1px);background-size:var(--g) var(--g)}
.pgdel{position:absolute;top:8px;right:8px;z-index:5;width:30px;height:30px;border-radius:50%;border:1px solid var(--line3);background:var(--card);color:var(--mut);display:grid;place-items:center;padding:0;opacity:.75}

.pdfsw{min-height:32px;display:inline-flex;gap:6px;align-items:center;flex-wrap:wrap}
.pdfbar .csw.cust{position:relative;overflow:hidden;display:inline-block}
.pdfbar .csw.cust input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;border:0;padding:0}
.icon-btn.pw i{display:block;background:var(--tx);border-radius:99px}
.icon-btn.pw.on,.pdfbar .btn.on{background:var(--accs);border-color:var(--acc);color:var(--acc)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ===== rodada 7: grade por duração real, prévia do dia, formulário enxuto, animação de aba ===== */
:root{--free:#EEF7F2}
html[data-theme="dark"]{--free:#1B2A23}
.ev{padding:1px 6px;font-size:12px;line-height:1.2;border-radius:7px}
.ev b{align-items:flex-start;gap:4px}
.ev b .ic{flex:none;margin-top:2px}
.ev i{font-size:11px;white-space:nowrap}
.ev .ln{display:-webkit-box;-webkit-box-orient:vertical;overflow:hidden;min-width:0;overflow-wrap:normal;word-break:normal}
.ev.nar2{font-size:10.5px}.ev.nar3{font-size:9.5px}.ev.nar2 i,.ev.nar2 em{font-size:10px}.ev.nar3 i,.ev.nar3 em{font-size:9px}
.ev b .ln{flex:1}
.ev em{font-size:11px}
.ev.ico{display:flex;align-items:center;justify-content:center;padding:0;overflow:visible;border-left-width:3px;border-radius:6px}
.ev.ico.tiny{border-radius:4px;min-height:3px;z-index:2}
.ev.ico svg{flex:none;opacity:.9}
.gstrip{grid-column:1/-1;display:flex;align-items:center;justify-content:center;gap:6px;padding:5px 10px;border:0;border-top:1px solid var(--line2);border-bottom:1px solid var(--line2);background:var(--soft);color:var(--mut2);font-size:12px;position:sticky;left:0}
.gstrip:hover{color:var(--tx)}
.gstrip.has{color:var(--acc);font-weight:500}
.gstrip .ic{transition:transform .2s}
.gstrip.early .ic{transform:rotate(180deg)}
.gstrip.early.open .ic{transform:none}
.gstrip.late.open .ic{transform:rotate(180deg)}
.sprev{margin-top:8px;display:flex;flex-direction:column;gap:7px}
.sp-sum{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;font-size:13px;color:var(--mut)}
.sp-sum b{color:var(--ink);font-weight:600}
.sp-sum .warn{color:#C62F2F;font-weight:500}
html[data-theme="dark"] .sp-sum .warn{color:#FF8A8A}
.sp-sum .okl{color:var(--okd);font-weight:500}
.sp-free{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.sp-free .lbl{font-size:12px;color:var(--mut2)}
.sp-free .chip{padding:2px 10px;font-size:12px}
.sp-wrap{display:grid;grid-template-columns:34px 1fr;border:1px solid var(--line);border-radius:11px;overflow:auto;max-height:236px;background:var(--card);overscroll-behavior:contain}
.sp-times{position:relative}
.sp-times span{position:absolute;right:5px;transform:translateY(-50%);font-size:10.5px;color:var(--mut2)}
.sp-col{position:relative;cursor:pointer;background:var(--free);border-left:1px solid var(--line2)}
.sp-col .hl{position:absolute;left:0;right:0;border-top:1px dashed var(--line2)}
.sp-b{position:absolute;border-radius:6px;padding:1px 6px;font-size:11px;line-height:1.25;background:var(--c);color:var(--ct);border-left:3px solid var(--ct);overflow:hidden;pointer-events:none;z-index:1}
.sp-b i{display:block;font-style:normal;opacity:.8;font-size:10.5px}
.sp-b .ln{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
.sp-new{position:absolute;left:2px;right:2px;border:2px dashed var(--acc);background:rgba(37,71,208,.16);border-radius:6px;pointer-events:none;z-index:2}
.sp-new.bad{border-color:#E5484D;background:rgba(229,72,77,.18)}
.sp-legend{display:flex;gap:14px;font-size:11.5px;color:var(--mut2)}
.sp-legend span{display:inline-flex;align-items:center;gap:5px}
.sp-legend .lg{width:12px;height:12px;border-radius:3px;display:inline-block;border:1px solid var(--line3)}
.sp-legend .lg.free{background:var(--free)}
.sp-legend .lg.busy{background:#C9DFF4;border-color:#8CB4DB}

.optchips{display:flex;flex-wrap:wrap;gap:7px;align-items:center}

@keyframes optIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}

@media (prefers-reduced-motion:reduce){#main.tabanim,.opt{animation:none}}

/* ===== hábitos ===== */
.hbprog{display:flex;align-items:center;gap:16px;padding:16px 18px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);margin-bottom:14px;transition:border-color .3s}
.hbpw{position:relative;width:64px;height:64px;flex:none;display:grid;place-items:center}

.hbring .fg{stroke:var(--okd);stroke-linecap:round;transition:stroke-dashoffset .7s cubic-bezier(.2,.8,.2,1)}

.hbpt{font-size:16px;font-weight:600;color:var(--ink)}

@keyframes hbflash{0%{box-shadow:0 0 0 0 rgba(47,143,99,.5)}100%{box-shadow:0 0 0 14px rgba(47,143,99,0)}}
.hbtime{width:46px;flex:none;font-size:13px;font-weight:600;color:var(--mut)}

.hbchk.burst{animation:hbpop .55s cubic-bezier(.2,1.6,.4,1)}
@keyframes hbpop{0%{transform:scale(.6)}60%{transform:scale(1.35)}100%{transform:scale(1)}}
.cfbox{position:absolute;inset:0;pointer-events:none}
.cfbox i{position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:2px;animation:cf .8s ease-out forwards}
@keyframes cf{from{transform:translate(0,0) rotate(0) scale(1);opacity:1}to{transform:translate(var(--x),var(--y)) rotate(220deg) scale(.3);opacity:0}}
.hbb{flex:1;min-width:0}
.hbt{font-weight:500;font-size:15px;color:var(--ink);overflow-wrap:anywhere}
.hbw{display:flex;align-items:center;gap:5px;font-size:12.5px;color:var(--mut)}
.hbs{display:inline-flex;align-items:center;gap:3px;font-size:13px;font-weight:600;color:#D9731C}
.hbcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;box-shadow:var(--sh);margin-bottom:12px}
.hbch{display:flex;align-items:flex-start;gap:10px}
.hbtt{flex:1;min-width:0}

  if(d<0){cls='late';l='Atrasada '+fmtDM(iso);}
  else if(d===0){cls='today';l='Hoje';}
  else if(d===1){cls='soon';l='Amanhã';}
  else{cls=d<=3?'soon':'';l=WD[parseISO(iso).getDay()]+', '+fmtDM(iso);}
  return {cls:cls,l:l};
}
// Prazo efetivo da tarefa: o dela mesmo ou o da data/prazo ao qual está ligada
function tDue(t){
  if(t.deadline)return t.deadline;
  let best='';(t.dateIds||[]).forEach(id=>{const d=dateById(id);if(d&&d.date&&(!best||d.date<best))best=d.date;});
  return best;
}
function tDueTime(t){
  if(t.deadline)return t.deadlineTime||'';
  const due=tDue(t);if(!due)return '';
  const d=(t.dateIds||[]).map(dateById).filter(x=>x&&x.date===due&&x.time)[0];return d?d.time:'';
}
const dueChip=t=>{const due=tDue(t);if(!due)return '';const i=dueInfo(due),h=tDueTime(t);return '<span class="due '+(t.done?'':i.cls)+'">'+ic('clock',12)+i.l+(h?' '+h:'')+'</span>';};
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),2600);}
function defaultSlot(date,start,end){return {id:uid(),mode:'date',date:date,start:start||'08:00',end:end||'09:00'};}
function nextTimes(){
  const n=new Date();let m=Math.ceil((n.getHours()*60+n.getMinutes()+1)/30)*30;
  if(m<360)m=360;if(m>1230)m=1230;
  return [mt(m),mt(m+60)];
}
function fixDay(){
  const we=addISO(UI.weekStart,6);
  if(UI.day<UI.weekStart||UI.day>we){const t=todayISO();UI.day=(t>=UI.weekStart&&t<=we)?t:UI.weekStart;}
}
const money=n=>(Number(n)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
function parseNum(s){if(s==null)return null;s=String(s).trim().replace(/[R$\s]/g,'');if(!s)return null;if(s.indexOf(',')>=0)s=s.replace(/\./g,'').replace(',','.');const n=parseFloat(s);return isNaN(n)?null:n;}
const hm=m=>{m=Math.round(m||0);return m<60?m+'min':Math.floor(m/60)+'h'+(m%60?pad(m%60):'');};
const f1=n=>n==null||n===''?'':String(Math.round(Number(n)*10)/10).replace('.',',');
const sumK=(list,k)=>list.reduce((s,e)=>s+(Number(e[k])||0),0);
function addMonthsISO(iso,n){const d=parseISO(iso),day=d.getDate(),t=new Date(d.getFullYear(),d.getMonth()+n,1),last=new Date(t.getFullYear(),t.getMonth()+1,0).getDate();t.setDate(Math.min(day,last));return toISO(t);}
// Contagem regressiva (datas importantes e notas)
function cdInfo(iso){
  const d=diffDays(iso,todayISO());
  if(d===0)return {t:'É hoje',cls:'today'};
  if(d===1)return {t:'Amanhã',cls:'soon'};
  if(d>1)return {t:'Faltam '+d+' Dias',cls:d<=7?'soon':''};
  if(d===-1)return {t:'Foi ontem',cls:'past'};
  return {t:'Há '+(-d)+' dias',cls:'past'};
}

/* ==========================================================================
   6. OCORRÊNCIAS: uma atividade, vários horários (semanais ou datas únicas)
   ========================================================================== */
function mkOcc(a,s,date){const key=s.id+'|'+date;return {act:a,slot:s,date:date,start:s.start,end:s.end,key:key,done:!!a.done[key]};}
function occurrences(fromD,toD){
  const out=[],d0=parseISO(fromD),d1=parseISO(toD);
  S.acts.forEach(a=>a.slots.forEach(s=>{
    if(s.mode==='date'){if(s.date>=fromD&&s.date<=toD)out.push(mkOcc(a,s,s.date));}
    else{for(let d=new Date(d0);d<=d1;d=addDays(d,1)){
      if(d.getDay()===s.weekday){const iso=toISO(d);if((!s.from||iso>=s.from)&&(!s.until||iso<=s.until))out.push(mkOcc(a,s,iso));}
    }}
  }));
  return out;
}
const cmpOcc=(a,b)=>a.date<b.date?-1:a.date>b.date?1:tmin(a.start)-tmin(b.start)||tmin(a.end)-tmin(b.end);
function occFromKey(aid,key){
  const a=actById(aid);if(!a)return null;
  const p=key.split('|'),s=a.slots.find(x=>x.id===p[0]);
  return s?mkOcc(a,s,p[1]):null;
}
// Próxima ocorrência (ou a primeira) de uma atividade: usada ao citá-la em notas
function nextOccOf(a){
  const t=todayISO(),list=occurrences(addISO(t,-30),addISO(t,120)).filter(o=>o.act===a).sort(cmpOcc);
  const f=list.find(o=>o.date>=t)||list[list.length-1];
  if(f)return f;
  const s=a.slots[0];return s?mkOcc(a,s,s.mode==='date'?s.date:t):null;
}

function passOcc(o){
  const f=UI.filters,a=o.act;
  if(f.blocks.length&&!f.blocks.includes(a.blockType))return false;
  if(f.kinds.length&&!f.kinds.includes(a.kind))return false;
  if(f.roots.length){const r=catRoot(a.catId);if(!r||!f.roots.includes(r.id))return false;}
  if(f.status==='pend'&&o.done)return false;
  if(f.status==='done'&&!o.done)return false;
  if(f.q&&!norm([aT(a),a.teacher,a.place,a.doWhat,a.where,a.bring].concat((a.extras||[]).map(x=>x.type+' '+x.name)).join(' ')).includes(norm(f.q)))return false;
  return true;
}
function passRootQ(catId,text){
  const f=UI.filters;
  if(f.roots.length){const r=catRoot(catId);if(!r||!f.roots.includes(r.id))return false;}
  if(f.q&&!norm(text).includes(norm(f.q)))return false;
  return true;
}

/* O que levar vale para o dia inteiro: o que for marcado em um evento aparece em todos os eventos daquele dia.
   Cada evento guarda só o que foi adicionado nele; a soma do dia é calculada aqui. Kits trazem o seu conteúdo fixo. */
function dayUnion(date){
  const mk=date+'|'+S.savedAt;if(DAYMEMO[mk])return DAYMEMO[mk];
  const ids=[],extras=[],names={},stow={},bring=[];
  occurrences(date,date).forEach(o=>{const a=o.act;
    (a.itemIds||[]).forEach(i=>{if(itemById(i)&&ids.indexOf(i)<0){ids.push(i);if(a.stow&&a.stow[i])stow[i]=a.stow[i];}});
    (a.extras||[]).forEach(x=>{const k=norm(x.name);if(k&&!names[k]){names[k]=1;extras.push(x);}});
    textLines(a.bring,true).forEach(l=>{if(bring.indexOf(l)<0)bring.push(l);});
  });
  return DAYMEMO[mk]={ids:ids,extras:extras,stow:stow,bring:bring};
}
function bagOf(a,date){
  const ids=[],add=i=>{if(itemById(i)&&ids.indexOf(i)<0)ids.push(i);},du=date?dayUnion(date):{ids:[],extras:[],stow:{},bring:[]};
  (a.itemIds||[]).forEach(add);du.ids.forEach(add);
  const stow=Object.assign({},du.stow,a.stow||{});
  for(let n=0;n<ids.length;n++){const it=itemById(ids[n]);if(it&&it.container)(it.inside||[]).forEach(k=>{if(k===it.id)return;add(k);if(!stow[k])stow[k]=it.id;});}
  const ex=(a.extras||[]).slice(),seen={};ex.forEach(x=>{seen[norm(x.name)]=1;});
  du.extras.forEach(x=>{if(!seen[norm(x.name)]){seen[norm(x.name)]=1;ex.push(x);}});
  const br=textLines(a.bring,true);du.bring.forEach(l=>{if(br.indexOf(l)<0)br.push(l);});
  return Object.assign({},a,{itemIds:ids,stow:stow,extras:ex,bring:br.join('\n')});
}
function packRows(a,ctl,date){
  const dd=date?' data-date="'+date+'"':'';
  const sel=(a.itemIds||[]).map(itemById).filter(Boolean),ids=sel.map(i=>i.id),stow=a.stow||{},extras=a.extras||[],seen={};
  const parentOf=i=>(stow[i.id]&&stow[i.id]!==i.id&&ids.indexOf(stow[i.id])>=0)?stow[i.id]:'';
  const apps=it=>{const pl=(a.plan||{})[it.id];return isEletro(it)&&pl&&pl.apps.length?'<span class="sub">'+esc(pl.apps.map(x=>x.name).join(', '))+'</span>':'';};
  const ex=x=>'<span class="xt">'+esc(x.type||'Objeto')+'</span>'+esc(x.name);
  const exRow=x=>ctl?'<div class="orow"><span>'+ex(x)+'</span>'+rmBtn('data-a="extra-remove" data-aid="'+a.id+'" data-id="'+x.id+'" data-n="'+esc(x.name)+'"'+dd,'Retirar objeto')+'</div>':ex(x);
  function node(it){
    seen[it.id]=1;
    const kids=sel.filter(k=>parentOf(k)===it.id&&!seen[k.id]).map(k=>'<li>'+node(k)+'</li>').concat(extras.filter(x=>x.into===it.id).map(x=>'<li>'+exRow(x)+'</li>'));
    const k=a.id+'|obj:'+it.id,open=!(ctl&&UI.fold[k]);
    const head=ctl?'<div class="orow">'+(kids.length?foldBtn(k,open):'')+'<span>'+esc(it.name)+'</span>'+rmBtn('data-a="obj-remove" data-aid="'+a.id+'" data-id="'+it.id+'"'+dd,date?'Retirar do dia':'Retirar objeto do evento')+'</div>':esc(it.name);
    return head+apps(it)+(kids.length&&open?'<ul class="inner">'+kids.join('')+'</ul>':'');
  }
  const rows=[];
  sel.filter(i=>!parentOf(i)).forEach(i=>rows.push(node(i)));
  sel.filter(i=>!seen[i.id]).forEach(i=>rows.push(node(i)));
  extras.filter(x=>!x.into||ids.indexOf(x.into)<0).forEach(x=>rows.push(exRow(x)));
  textLines(a.bring,true).forEach(l=>rows.push(esc(l)));
  return {rows:rows,total:sel.length+extras.length+textLines(a.bring,true).length,groups:Array.from(new Set(sel.map(i=>i.group||'Geral')))};
}

function layoutDay(evs){
  const res=[];let cluster=[],cend=-1;
  const flush=()=>{
    if(!cluster.length)return;
    const lanes=[];
    cluster.forEach(ev=>{let l=0;while(lanes[l]!==undefined&&lanes[l]>ev.s)l++;lanes[l]=ev.e;ev.lane=l;});
    cluster.forEach(ev=>{ev.n=lanes.length;res.push(ev);});
    cluster=[];
  };
  evs.forEach(ev=>{if(cluster.length&&ev.s>=cend){flush();cend=-1;}cluster.push(ev);cend=Math.max(cend,ev.e);});
  flush();return res;
}
function badgesHTML(a,date){

  const b=(n,i,t)=>n?'<span class="bd" title="'+t+'">'+ic(i,11)+n+'</span>':'';
  return b(ni,'bag','Objetos para levar')+b(nt,'tasks','Tarefas pendentes')+b(nl,'link','Links')+b(ng,'target','Objetivos')+b(nm,'dollar','Dinheiro')+b(hbCount(a),'sprout','Hábitos ligados');
}
const hoursStr=list=>{const m=list.reduce((s,o)=>s+tmin(o.end)-tmin(o.start),0);return (Math.round(m/6)/10).toString().replace('.',',')+'h';};
// Grade: das 06:00 às 23:00 (as demais horas ficam recolhidas e se abrem pelas faixas); a altura de cada evento é a duração real
const GRID_DESK=window.innerWidth>760,GPX=GRID_DESK?76:96; // computador: grade mais compacta
const GRID_LO=360,GRID_HI=1380;
function gridEvHTML(ev,lo,hi,span,print,pxh){
  const o=ev.o,a=o.act,col=catColor(a.catId),w=100/ev.n,dur=ev.e-ev.s,s0=Math.max(ev.s,lo),e0=Math.min(ev.e,hi),hpx=(e0-s0)*pxh/60,qk=!print&&quickOf(a);
  const pos='top:'+((s0-lo)/span*100)+'%;height:'+((e0-s0)/span*100)+'%;left:calc('+(ev.lane*w)+'% + 1px);width:calc('+w+'% - 3px);--c:'+col+';--ct:'+inkG(col)+';--cb:'+shade(col,.55);
  const act=print?'':' data-a="open-occ" data-aid="'+a.id+'" data-key="'+esc(o.key)+'" role="button" tabindex="0"';
  const pt=actParts(a),where=[a.place,a.teacher].filter(Boolean).join(' · ');
  const tip=[aT(a),o.start+'–'+o.end,where].filter(Boolean).join(' · ');
  if(qk||dur<=15){ // atalhos rápidos e eventos de até 15 min: só o ícone
    const sz=qk?16:Math.max(9,Math.min(14,Math.round(hpx)));
    return '<div class="ev ico '+(qk?'qk ':'')+(dur<=15?'tiny ':'')+(o.done?'done':'')+'" style="'+pos+'"'+act+' title="'+esc(tip)+'" aria-label="'+esc(tip)+'">'+ic(qk?qk.icon:catIcon(a.catId),sz)+'</div>';
  }
  if(!print)return gridEvCard(ev,o,a,pt,pos,act,tip,hpx);
  // Cartão: horário, título em negrito (tipo | tema), caminho da categoria, local/professor, o que fazer, refeição e marcadores.
  // Cada linha só entra se couber na altura real do evento; nenhuma palavra é cortada no meio.
  const nar=ev.n>1?Math.min(ev.n,3):1,lh=print?8.6:(nar===1?15.5:nar===2?14:13);
  const L=Math.max(1,Math.floor((hpx-(print?2:8))/lh)),cpl=[26,15,11,8][Math.min(ev.n,4)-1]*(print?1.4:1);
  const food=foodLine(o),bd=print?'':badgesHTML(a,o.date),title=(nar>1?[pt.tipo]:[pt.tipo,pt.theme]).filter(Boolean).join(' | ')||aT(a),thm=nar>1?pt.theme:'';
  const area=[pt.disc,pt.eixo].filter(Boolean).join(' / '),dw=print||nar>1?'':(textLines(a.doWhat)[0]||'');
  const inc={};let left=L;
  inc.head=1;left--;
  if(left>=1){inc.time=1;left--;}
  const want=Math.min(Math.ceil(title.length/cpl),L>=9?5:4);
  if(want>1&&left>=1){const x=Math.min(want-1,left);inc.head+=x;left-=x;}
  [['thm',!!thm],['area',!!area],['where',!!where],['food',!!food],['dw',!!dw],['bds',!!bd]].forEach(x=>{if(x[1]&&left>=1){inc[x[0]]=1;left--;}});
  if(inc.dw&&left>=1){inc.dw+=Math.min(left,2);left-=Math.min(left,2);}
  if(inc.area&&left>=1&&area.length>cpl){inc.area=2;left--;}
  if(inc.where&&left>=1&&where.length>cpl){inc.where=2;left--;}
  const clamp=n=>' style="-webkit-line-clamp:'+Math.max(1,n)+'"';
  let h='';
  if(inc.time)h+='<i>'+o.start+(nar>1?'–':' às ')+o.end+'</i>';
  h+='<b><span class="ln"'+clamp(inc.head)+'>'+esc(inc.head===1&&want>1&&nar===1?(pt.tipo||title):title)+'</span></b>';
  if(inc.thm)h+='<span class="th ln"'+clamp(2)+'>'+esc(thm)+'</span>';
  if(inc.area)h+='<em class="ln"'+clamp(inc.area)+'>'+esc(area)+'</em>';
  if(inc.where)h+='<em class="ln"'+clamp(inc.where)+'>'+esc(where)+'</em>';
  if(inc.food)h+='<span class="th ln"'+clamp(1)+'>'+esc(food)+'</span>';
  if(inc.dw)h+='<span class="th dw ln"'+clamp(inc.dw)+'>'+esc(dw)+'</span>';
  if(inc.bds)h+='<span class="bds">'+bd+'</span>';
  if(!print&&nar===1&&inc.time&&hpx>=40)h+='<span class="eic">'+ic(catIcon(a.catId),14)+'</span>';
  return '<div class="ev '+(ev.n>1?'nar'+Math.min(ev.n,3)+' ':'')+(o.done?'done':'')+'" style="'+pos+'"'+act+' title="'+esc(tip)+'">'+h+'</div>';
}
// Bloco da grade na tela: uma informação por linha (horário, título, categoria, local, professor, o que levar, tarefas…),
// cada uma em uma única linha; entram por ordem de importância até ocupar a altura real do evento.
function gridEvCard(ev,o,a,pt,pos,act,tip,hpx){
  const nar=ev.n>1?Math.min(ev.n,3):1,lh=GRID_DESK?(nar===1?14.5:nar===2?13.5:12.5):(nar===1?17:nar===2?15.5:14.5),L=Math.max(1,Math.floor((hpx-(GRID_DESK?5:8))/lh));
  const bg=bagOf(a,o.date),ni=bg.itemIds.filter(i=>!bg.stow[i]).length+bg.extras.length,nt=S.tasks.filter(t=>!t.done&&t.activityIds.includes(a.id)).length;
  const kits=bg.itemIds.map(itemById).filter(i=>i&&i.container).map(i=>i.name);
  const title=[pt.tipo,pt.theme].filter(Boolean).join(' | ')||aT(a),area=[pt.disc,pt.eixo].filter(Boolean).join(' · ');
  const L2=[ // [classe, ícone, texto]
    ['tm','',o.start+' – '+o.end],
    ['tt','',title],
    ['ar','',area],
    ['pl','pin',a.place],
    ['pr','user',a.teacher],
    ['bg','bag',ni?(kits.length?kits.join(', ')+(ni>kits.length?' + '+(ni-kits.length):''):ni+(ni===1?' item':' itens')):''],
    ['tk','tasks',nt?nt+(nt===1?' tarefa pendente':' tarefas pendentes'):''],
    ['fd','utensils',foodLine(o)],
    ['dw','target',textLines(a.doWhat)[0]||'']
  ].filter(x=>x[2]);
  let rows=L2;
  if(L<rows.length){rows=[L2[1]];if(L>=2)rows.unshift(L2[0]);rows=rows.concat(L2.slice(2,2+Math.max(0,L-rows.length)));}
  const tt2=L>=rows.length+1&&title.length>(nar===1?24:12); // sobra espaço: o título usa duas linhas
  const h=rows.map(x=>'<span class="el el-'+x[0]+'"'+(x[0]==='tt'&&tt2?' style="-webkit-line-clamp:2;white-space:normal"':'')+'>'+(x[1]&&nar===1?ic(x[1],11):'')+esc(x[2])+'</span>').join('');
  return '<div class="ev ev2 '+(nar>1?'nar'+nar+' ':'')+(o.done?'done':'')+'" style="'+pos+'"'+act+' title="'+esc(tip)+'">'+h+'</div>';
}

const rvCfg=()=>Object.assign({on:true,days:[1,7,30]},S.prefs.rv||{});
function reviewList(from,to){
  const c=rvCfg();if(!c.on)return [];
  const done=S.prefs.rvDone||{},out=[],mx=Math.max.apply(null,c.days);
  occurrences(addISO(from,-mx),to).forEach(o=>{
    const a=o.act,pt=actParts(a);if(!RV_TIPO.test(norm((pt.tipo||'')+' '+(a.kind||''))))return;
    c.days.forEach(n=>{const rd=addISO(o.date,n);if(rd<from||rd>to)return;const key='rv|'+a.id+'|'+o.date+'|'+n;

/* ----- tipo de arquivo (extensão): PDF, Word/Docs, Excel/Planilhas, PowerPoint/Slides ----- */
const FX={
  pdf:{fam:'pdf',lbl:'PDF',nome:'PDF'},
  docx:{fam:'doc',lbl:'.docx',nome:'Word (.docx)'},
  gdoc:{fam:'doc',lbl:'Docs',nome:'Google Docs'},
  xlsx:{fam:'xls',lbl:'.xlsx',nome:'Excel (.xlsx)'},
  gsheet:{fam:'xls',lbl:'Planilhas',nome:'Google Planilhas'},
  pptx:{fam:'ppt',lbl:'.pptx',nome:'PowerPoint (.pptx)'},
  gslide:{fam:'ppt',lbl:'Slides',nome:'Google Slides'}
};
// Descobre o tipo pelo endereço (Google Docs/Planilhas/Slides, OneDrive, extensão do arquivo) ou pelo nome
function detectExt(text){
  const t=String(text||'').toLowerCase();
  if(/docs\.google\.com\/document/.test(t))return 'gdoc';
  if(/docs\.google\.com\/spreadsheets/.test(t))return 'gsheet';
  if(/docs\.google\.com\/presentation/.test(t))return 'gslide';
  if(/\.pdf(?=$|[?#\s])/.test(t))return 'pdf';
  if(/\.docx?(?=$|[?#\s])/.test(t)||/:w:\/|1drv\.ms\/w\//.test(t))return 'docx';
  if(/\.(xlsx?|xlsm|csv)(?=$|[?#\s])/.test(t)||/:x:\/|1drv\.ms\/x\//.test(t))return 'xlsx';
  if(/\.(pptx?|ppsx)(?=$|[?#\s])/.test(t)||/:p:\/|1drv\.ms\/p\//.test(t))return 'pptx';
  return '';
}
const docExt=d=>FX[d.ext]?d.ext:(detectExt(d.link)||detectExt(d.title));

/* Ritmo por prova: o que falta (cards a revisar + itens avisados) dividido pelos dias que restam */
function paceFor(d){
  const days=diffDays(d.date,todayISO());if(days<0)return null;
  const now=Date.now();let cards=0;(d.deckIds||[]).forEach(id=>{if(deckById(id))cards+=deckStats(id,now).due;});
  const q=d.qtd||0;if(!cards&&!q)return null;
  const n=Math.max(days,1),per=k=>Math.ceil(k/n);
  const parts=[];if(cards)parts.push(per(cards)+(per(cards)===1?' card':' cards'));if(q)parts.push(per(q)+' '+(d.qlabel||'itens'));
  return {days:days,cards:cards,qtd:q,per:per(cards),perq:per(q),
    text:(days===0?'É hoje':'Faltam '+days+(days===1?' dia':' dias'))+(cards?' e '+cards+' cards':'')+(q?(cards?' e ':' e ')+q+' '+(d.qlabel||'itens'):'')+': '+parts.join(' + ')+(days>1?' por dia':'')};
}

function allLinks(){
  const saved=new Set(S.links.map(l=>normUrl(l.url))),m=new Map();
  const add=(url,label,src)=>{if(!url)return;const u=normUrl(url);if(saved.has(u))return;const e=m.get(u)||{url:u,items:[],clicks:S.linkClicks[u]||0};e.items.push({label:label,src:src});m.set(u,e);};
  S.acts.forEach(a=>add(a.link,aT(a),'Atividade'));
  S.tasks.forEach(t=>add(t.link,t.title,'Tarefa'));
  S.docs.forEach(d=>add(d.link,d.title,'Documento'));
  return Array.from(m.values()).sort((a,b)=>b.clicks-a.clicks||b.items.length-a.items.length);
}

(function(){
  let sx=0,sy=0,st=0,ok=false;

      if(/^(INPUT|TEXTAREA|SELECT|CANVAS|TABLE)$/.test(el.tagName)||el.isContentEditable)return true;
      if(el.classList&&(el.classList.contains('gridscroll')||el.classList.contains('fxview')||el.classList.contains('ftree')||el.classList.contains('noswipe')))return true;
      if(el.scrollWidth>el.clientWidth+4){const ox=getComputedStyle(el).overflowX;if(ox==='auto'||ox==='scroll')return true;}
    }

    const t=e.target;if(!t.closest||!t.closest('#main')||blocked(t))return;

})();

let PREVC=null;
function renderSlotPrev(){
  const box=$('#slotprev');if(!box)return;
  const c=prevCtx();PREVC=c;if(!c){box.innerHTML='';return;}
  const sm=c.st?tmin(c.st):null,em=sm==null?null:(c.en&&tmin(c.en)>sm?tmin(c.en):Math.min(1439,sm+60));
  const busy=occurrences(c.date,c.date).filter(o=>o.act.id!==c.aid).sort(cmpOcc);
  let lo=GRID_LO,hi=GRID_HI;
  if(sm!=null){lo=Math.min(lo,Math.floor(sm/60)*60);hi=Math.max(hi,Math.ceil(em/60)*60);}
  busy.forEach(o=>{lo=Math.min(lo,Math.floor(tmin(o.start)/60)*60);hi=Math.max(hi,Math.ceil(tmin(o.end)/60)*60);});
  lo=Math.max(0,lo);hi=Math.min(1440,hi);
  const span=hi-lo,H=span/60*SPX;
  // janelas livres no dia (06:00 a 23:00)
  const iv=busy.map(o=>[tmin(o.start),Math.max(tmin(o.end),tmin(o.start)+1)]).sort((a,b)=>a[0]-b[0]);
  const free=[];let cur=GRID_LO;
  iv.forEach(x=>{if(x[0]>cur)free.push([cur,Math.min(x[0],GRID_HI)]);cur=Math.max(cur,x[1]);});
  if(cur<GRID_HI)free.push([cur,GRID_HI]);
  let wins=free.filter(x=>x[1]-x[0]>=15&&x[0]<GRID_HI);
  if(wins.length>6&&sm!=null)wins=wins.slice().sort((a,b)=>Math.abs(a[0]-sm)-Math.abs(b[0]-sm)).slice(0,6).sort((a,b)=>a[0]-b[0]);
  const clash=sm==null?[]:busy.filter(o=>tmin(o.start)<em&&tmin(o.end)>sm);
  const nm=o=>{const pt=actParts(o.act);return clip([pt.tipo,pt.theme].filter(Boolean).join(' · ')||aT(o.act),34);};
  const d0=parseISO(c.date);
  let sum='<div class="sp-sum"><b>'+WDL[d0.getDay()]+', '+fmtDM(c.date)+'</b>';
  if(sm==null)sum+='<span>Escolha o horário de início.</span>';
  else if(clash.length)sum+='<span class="warn">Conflita com '+esc(nm(clash[0]))+' '+clash[0].start+'–'+clash[0].end+(clash.length>1?' e mais '+(clash.length-1):'')+'</span>';
  else sum+='<span class="okl">Horário livre</span>';
  sum+='</div>';
  const fr=wins.length?'<div class="sp-free"><span class="lbl">Livre</span>'+wins.map(x=>'<button type="button" class="chip" data-a="sp-free" data-s="'+x[0]+'" data-e="'+x[1]+'">'+mt(x[0])+'–'+mt(x[1])+'</button>').join('')+'</div>':'<div class="sp-free"><span class="lbl">Sem horários livres neste dia</span></div>';
  let tl='';for(let m=lo+60;m<hi;m+=60)tl+='<span style="top:'+((m-lo)/span*100)+'%">'+pad(m/60)+'</span>';
  let col='';for(let m=lo+60;m<hi;m+=60)col+='<div class="hl" style="top:'+((m-lo)/span*100)+'%"></div>';
  const evs=busy.map(o=>({o:o,s:tmin(o.start),e:Math.max(tmin(o.end),tmin(o.start)+5)}));
  layoutDay(evs).forEach(ev=>{
    const a=ev.o.act,w=100/ev.n,col2=catColor(a.catId),hp=(ev.e-ev.s)*SPX/60,one=hp<30;
    col+='<div class="sp-b" style="top:'+((ev.s-lo)/span*100)+'%;height:'+((ev.e-ev.s)/span*100)+'%;left:calc('+(ev.lane*w)+'% + 1px);width:calc('+w+'% - 3px);--c:'+col2+';--ct:'+ink(col2)+'" title="'+esc(aT(a)+' · '+ev.o.start+'–'+ev.o.end)+'">'+(one?'<span class="ln">'+esc(nm(ev.o))+'</span>':'<i>'+ev.o.start+'–'+ev.o.end+'</i><span class="ln">'+esc(nm(ev.o))+'</span>')+'</div>';
  });
  if(sm!=null)col+='<div class="sp-new '+(clash.length?'bad':'')+'" style="top:'+((sm-lo)/span*100)+'%;height:'+(Math.max(3,(em-sm)/span*H)/H*100)+'%"></div>';
  const old=$('.sp-wrap',box),top=old?old.scrollTop:null;
  box.innerHTML=sum+fr+'<div class="sp-wrap"><div class="sp-times" style="height:'+H+'px">'+tl+'</div><div class="sp-col" data-a="sp-pick" data-lo="'+lo+'" data-span="'+span+'" style="height:'+H+'px">'+col+'</div></div>'+
    '<div class="sp-legend"><span><i class="lg free"></i>Livre</span><span><i class="lg busy"></i>Ocupado</span><span><i class="lg new"></i>Este evento</span></div>';
  const w=$('.sp-wrap',box);
  if(w){
    const y=sm==null?0:(sm-lo)/60*SPX,hh=sm==null?0:(em-sm)/60*SPX;
    if(top==null)w.scrollTop=Math.max(0,y-70);
    else{w.scrollTop=top;if(sm!=null&&(y<top||y+hh>top+w.clientHeight))w.scrollTop=Math.max(0,y-70);}
  }
}

function syncTaskLinks(actId,ids){
  const set=new Set(ids);
  S.tasks.forEach(t=>{
    const has=t.activityIds.includes(actId);
    if(set.has(t.id)&&!has)t.activityIds.push(actId);
    if(!set.has(t.id)&&has)t.activityIds=t.activityIds.filter(x=>x!==actId);
  });
}
function syncDateTasks(dateId,ids){
  const set=new Set(ids);
  S.tasks.forEach(t=>{
    t.dateIds=t.dateIds||[];const has=t.dateIds.includes(dateId);
    if(set.has(t.id)&&!has)t.dateIds.push(dateId);
    if(!set.has(t.id)&&has)t.dateIds=t.dateIds.filter(x=>x!==dateId);
  });
}

function autoStow(cb){ // ao marcar uma bolsa (ou um objeto que ela guarda), aplica a hierarquia cadastrada
  const f=cb.closest('form');if(!f||!cb.checked)return;
  const ids=$$('input[name=it]:checked',f).map(i=>i.value),it=itemById(cb.value);if(!it)return;
  const put=(k,c)=>{if(FORMPACK.stow[k])return;let x=c;while(x){if(x===k)return;x=FORMPACK.stow[x];}FORMPACK.stow[k]=c;};
  if(it.container)(it.inside||[]).forEach(k=>{if(ids.indexOf(k)>=0)put(k,it.id);});
  S.items.forEach(c=>{if(c.container&&ids.indexOf(c.id)>=0&&(c.inside||[]).indexOf(it.id)>=0)put(it.id,c.id);});
}

const folderById=id=>S.folders.find(f=>f.id===id);
function folderChain(id){const p=[];let f=folderById(id),n=0;while(f&&n++<30){p.unshift(f);f=f.parentId?folderById(f.parentId):null;}return p;}
function folderPath(id){const p=[];let f=folderById(id),n=0;while(f&&n++<20){p.unshift(f.name);f=f.parentId?folderById(f.parentId):null;}return p;}
function folderDesc(id,acc){acc=acc||[id];S.folders.filter(f=>f.parentId===id).forEach(f=>{acc.push(f.id);folderDesc(f.id,acc);});return acc;}
function folderOptions(sel,skip){
  const out=['<option value="">Sem pasta</option>'];
  const walk=(pid,d)=>S.folders.filter(f=>(f.parentId||'')===pid&&f.id!==skip).sort((a,b)=>a.name.localeCompare(b.name)).forEach(f=>{out.push('<option value="'+f.id+'" '+(f.id===sel?'selected':'')+'>'+'\u2003'.repeat(d)+esc(f.name)+'</option>');walk(f.id,d+1);});
  walk('',0);return out.join('');
}
// Limpa o HTML das notas: só formatação simples (cor e tamanho do texto, imagens), sem scripts
const STYLE_TAGS={SPAN:1,IMG:1,P:1,DIV:1,H1:1,H2:1,H3:1,H4:1,LI:1,UL:1,OL:1,BLOCKQUOTE:1},BLK_RE=/^(P|DIV|H1|H2|H3|H4|LI|UL|OL|BLOCKQUOTE)$/;
const OK_TAGS={B:1,STRONG:1,I:1,EM:1,U:1,UL:1,OL:1,LI:1,P:1,DIV:1,BR:1,SPAN:1,A:1,H1:1,H2:1,H3:1,H4:1,MARK:1,HR:1,BLOCKQUOTE:1,IMG:1,TABLE:1,THEAD:1,TBODY:1,TR:1,TD:1,TH:1,SUP:1};
function cleanStyle(tag,text){
  const out=[],blk=BLK_RE.test(tag);
  String(text||'').split(';').forEach(d=>{
    const i=d.indexOf(':');if(i<0)return;
    const k=d.slice(0,i).trim().toLowerCase(),v=d.slice(i+1).trim().toLowerCase();
    if(tag==='SPAN'&&k==='color'&&/^(#[0-9a-f]{3,8}|rgba?\(\s*\d{1,3}\s*,\s*\d{1,3}\s*,\s*\d{1,3}\s*(,\s*[\d.]+\s*)?\))$/.test(v))out.push('color:'+v);
    else if(tag==='SPAN'&&k==='font-size'&&/^\d{1,2}(\.\d)?px$/.test(v)&&parseFloat(v)>=8&&parseFloat(v)<=72)out.push('font-size:'+v);
    else if(tag==='IMG'&&k==='width'&&/^\d{2,4}px$/.test(v))out.push('width:'+v);
    else if(blk&&k==='text-align'&&/^(left|right|center|justify)$/.test(v))out.push('text-align:'+v);
    else if(blk&&k==='line-height'&&/^\d(\.\d{1,2})?$/.test(v)&&parseFloat(v)>=0.8&&parseFloat(v)<=4)out.push('line-height:'+v);
    else if((blk||tag==='IMG')&&(k==='margin-top'||k==='margin-bottom')&&/^\d{1,3}(\.\d{1,2})?px$/.test(v)&&parseFloat(v)<=200)out.push(k+':'+v);
  });
  return out.join(';');
}
const IMG_SRC=/^(data:image\/(png|jpe?g|gif|webp);base64,[a-z0-9+\/=]+|https:\/\/[^\s"'<>]+)$/i;
function cleanHTML(html,opt){
  opt=opt||{};
  const tpl=document.createElement('template');tpl.innerHTML=String(html||'');
  const walk=node=>{
    Array.from(node.childNodes).forEach(ch=>{
      if(ch.nodeType===3)return;
      if(ch.nodeType!==1){ch.remove();return;}
      if(/^(SCRIPT|STYLE|IFRAME|OBJECT|EMBED|LINK|META)$/.test(ch.tagName)){ch.remove();return;}
      if(ch.tagName==='IMG'&&(opt.plain||!IMG_SRC.test(ch.getAttribute('src')||''))){ch.remove();return;}
      if(!OK_TAGS[ch.tagName]||(opt.plain&&ch.tagName==='SPAN')){walk(ch);while(ch.firstChild)node.insertBefore(ch.firstChild,ch);ch.remove();return;}
      walk(ch);
      const objH=ch.tagName==='DIV'&&/(^|\s)obj-h(\s|$)/.test(ch.getAttribute('class')||'');
      Array.from(ch.attributes).forEach(at=>{
        const n=at.name,t=ch.tagName;let keep=false;
        if(t==='DIV'&&n==='class'){const c=at.value.split(/\s+/).filter(x=>x==='obj'||x==='obj-h'||x==='tp'||x==='cols2'||x==='toc').join(' ');if(c)ch.setAttribute('class',c);else ch.removeAttribute('class');return;}
        if(t==='SPAN'&&n==='class'){if(/(^|\s)tpn(\s|$)/.test(at.value))ch.setAttribute('class','tpn');else if(/(^|\s)cm(\s|$)/.test(at.value))ch.setAttribute('class','cm');else ch.removeAttribute('class');return;}
        if(t==='SPAN'&&n==='data-c'){if(/(^|\s)cm(\s|$)/.test(ch.getAttribute('class')||'')){ch.setAttribute('data-c',at.value.slice(0,800));}else ch.removeAttribute(n);return;}
        if(t==='SUP'){
          if(n==='class'){ch.setAttribute('class','fnm');return;}
          if(n==='data-k'){ch.setAttribute('data-k',at.value==='ref'?'ref':'exp');return;}
          if(n==='data-t'){ch.setAttribute('data-t',at.value.slice(0,800));return;}
          if(n==='contenteditable'){ch.setAttribute('contenteditable','false');return;}
        }
        if(t==='DIV'&&n==='contenteditable'&&(objH||/(^|\s)toc(\s|$)/.test(ch.getAttribute('class')||'')))return;
        if(t==='A'&&n==='class'){const c=at.value.split(/\s+/).filter(x=>x==='ref'||x==='wl').join(' ');if(c)ch.setAttribute('class',c);else ch.removeAttribute('class');return;}
        if(t==='A'&&n==='data-ref'&&!/^[a-z]+:[\w-]+$/i.test(at.value)){ch.removeAttribute(n);return;}
        if(t==='A'&&(n==='data-ref'||n==='data-k'||n==='contenteditable'||n==='target'||n==='rel'))keep=true;
        if(t==='A'&&n==='href'&&/^https?:/i.test(at.value))keep=true;
        if(t==='IMG'&&(n==='src'||n==='alt'))keep=true;
        if(t==='IMG'&&n==='class'){if(at.value.split(/\s+/).indexOf('gif')>=0)ch.setAttribute('class','gif');else ch.removeAttribute('class');return;}
        if(n==='style'&&STYLE_TAGS[t]&&!opt.plain){const st=cleanStyle(t,at.value);if(st){ch.setAttribute('style',st);}else ch.removeAttribute('style');return;}
        if(!keep)ch.removeAttribute(n);
      });
      if(ch.tagName==='A'&&ch.getAttribute('href')){ch.setAttribute('target','_blank');ch.setAttribute('rel','noopener');}
      if(objH)ch.setAttribute('contenteditable','false');
      if(ch.tagName==='SUP'){if(ch.hasAttribute('data-t')){ch.setAttribute('class','fnm');ch.setAttribute('contenteditable','false');if(!ch.hasAttribute('data-k'))ch.setAttribute('data-k','exp');}else{while(ch.firstChild)node.insertBefore(ch.firstChild,ch);ch.remove();}}
    });
  };
  walk(tpl.content);return tpl.innerHTML;
}

const TAG_RE=/(^|[\s(\[,;:.>!?])#([\p{L}\p{N}_-]{2,40})/gu;
function tagsOfText(t){const out=[],seen={};String(t||'').replace(TAG_RE,(m,a,b)=>{const k=norm(b);if(/^([0-9a-f]{3}|[0-9a-f]{6})$/.test(k)||/^\d+$/.test(k))return m;if(!seen[k]){seen[k]=1;out.push(k);}return m;});return out;}
